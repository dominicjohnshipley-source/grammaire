    // ───────────────────────── 3. Spoken French
    {
      id: "u13-spoken",
      title: "The grammar of spoken French",
      summary: "Dropped ne, on, ça, dislocation, questions in situ, elisions, liaison: speech as a system",
      minutes: 20,
      goals: [
        "Describe the regular grammatical features of everyday spoken French",
        "Recognise reduced forms such as t'as, y a, chais pas, faut que",
        "Know which liaisons are obligatory, optional and forbidden",
        "Decide what to use in speech and what to avoid in writing, and recognise Québec -tu questions"
      ],
      theory: [
        { h: "A variety with its own rules", html: `<p>Everyday spoken French (here, in France) is not careless written French. It is a variety with stable rules, used by educated speakers in relaxed conversation. The same people switch to the written norm when they write or speak formally (see Lesson: Registers: familier to soutenu).</p>
<div class="tbl"><table><tr><th>feature</th><th>spoken</th><th>written norm</th></tr>
<tr><td>negation without <em>ne</em></td><td><em>Je sais pas.</em></td><td><em>Je <b>ne</b> sais pas.</em></td></tr>
<tr><td><em>on</em> for <em>nous</em></td><td><em>Nous, on est contents.</em></td><td><em>Nous sommes contents.</em></td></tr>
<tr><td><em>ça</em> for <em>cela</em></td><td><em>Ça m'énerve.</em></td><td><em>Cela m'énerve.</em></td></tr>
<tr><td>dislocation as the norm</td><td><em>Mon frère, sa voiture, elle est en panne.</em></td><td><em>La voiture de mon frère est en panne.</em></td></tr>
<tr><td>question in situ</td><td><em>Tu vas où ?</em></td><td><em>Où vas-tu ?</em></td></tr>
<tr><td><em>il</em> dropped in impersonals</td><td><em>Faut qu'on y aille. Y a personne.</em></td><td><em><b>Il</b> faut … <b>Il</b> n'y a personne.</em></td></tr>
<tr><td><em>c'est</em> + plural</td><td><em>C'est mes amis.</em></td><td><em>Ce <b>sont</b> mes amis.</em></td></tr></table></div>
<p>Questions: intonation (<em>Tu viens ?</em>), the question word in place (<em>Tu fais quoi ?</em>) or fronted without inversion (<em>Où tu vas ?</em>), and <em>est-ce que</em> (<em>Où est-ce que tu vas ?</em>). Popular speech adds <em>Où c'est que tu vas ?</em>. Inversion survives in set phrases: <em>Quelle heure est-il ?</em></p>` },
        { h: "How it works", html: `<p>Speech optimises for a listener in real time, so the system leans on <b>word order and intonation</b> rather than on redundant markers.</p>
<ul><li><em>Ne</em> is redundant: <em>pas, rien, jamais</em> already carry the negation, so <em>ne</em> drops in the large majority of casual negations. This is the latest stage of a long cycle: <em>pas</em> was once a reinforcing noun ("a step").</li>
<li><em>On</em> takes a singular verb, which is simpler than <em>nous</em>; adjectives and participles still agree with the meaning: <em>On est parti<b>s</b></em>. Pairing it with <em>nous</em> (<em>nous, on</em>) restores the person.</li>
<li><b>Dislocation</b> (détachement) puts the topic first, then a comment with a resumptive pronoun (pronom de reprise). It keeps the clause itself short, with a pronoun subject, which suits planning on the fly.</li>
<li>Tense and mood simplify: no <b>passé simple</b> or <b>subjonctif imparfait</b> in conversation; the <b>futur proche</b> dominates (<em>Je vais te dire</em>). Studies of Canadian French find the futur simple surviving mainly in negative sentences.</li>
<li>Phonetic reduction produces regular forms: <em>t'as</em> (tu as), <em>y a</em> (il y a), <em>i(l) vient</em>, <em>j'sais pas</em>, which assimilates to <em>chais pas</em> because the voiceless s devoices the j. The present subjunctive stays alive: <em>Faut que tu viennes.</em></li>
<li>Popular speech generalises <em>que</em> as an all-purpose relative: <em>le film que je t'ai parlé</em> (standard: <em>dont</em>). It is stigmatised; do not imitate it.</li></ul>` },
        { h: "Liaison, imitation, Québec", html: `<p>Liaison links a silent final consonant to a following vowel.</p>
<ul><li><b>Obligatory</b>: determiner + noun or adjective (<em>les‿enfants, un‿ancien‿ami</em>), pronoun + verb (<em>ils‿ont, on‿a</em>) and verb + pronoun in commands (<em>allez-y</em>), after one-syllable prepositions (<em>chez‿eux, en‿avion</em>), set phrases (<em>tout‿à fait</em>).</li>
<li><b>Forbidden</b>: after <em>et</em>, before an aspirated h (<em>les | haricots</em>), after a singular noun (<em>un étudiant | anglais</em>), after an inverted pronoun (<em>Ont-ils | eu…</em>).</li>
<li><b>Optional</b>: after verbs and auxiliaries (<em>je suis‿allé</em>), after plural nouns. The more liaisons you make, the more formal you sound; casual speech makes few.</li></ul>
<p>In speech, imitate dropped <em>ne</em>, <em>on</em>, <em>ça</em>, dislocation, <em>y a</em> and questions in situ. In writing, restore the norm. Avoid in both the popular relative <em>que</em>.</p>
<p>Québec French shares these features and adds others, notably the particle <em>-tu</em> in yes/no questions: <em>Tu viens-<b>tu</b> ? C'est-tu vrai ?</em> It comes from the old <em>-ti</em> of <em>vient-il</em> [vjɛ̃ti], reinterpreted as a question marker. The written norm is the same as in France.</p>` }
      ],
      examples: [
        ["Chais pas où il est passé.", "Dunno where he's got to."],
        ["Nous, on part demain matin.", "We're leaving tomorrow morning."],
        ["Ton frère, il habite où maintenant ?", "Where does your brother live now?"],
        ["Y a plus de pain, faut que j'aille en acheter.", "There's no bread left, I've got to go and buy some."],
        ["C'est mes voisins qui me l'ont dit.", "It was my neighbours who told me."],
        ["Tu viens-tu avec nous ? (Québec)", "Are you coming with us?"]
      ],
      pitfalls: [
        `Writing spoken forms in a formal text: in an essay or email to a stranger, write <em>Je <b>ne</b> sais pas</em>, <em><b>Il</b> faut</em>, <em><b>Il</b> y a</em>.`,
        `Keeping <em>c'est</em> + plural in writing: speech says <em>C'est mes amis</em>; careful writing uses <em>Ce <b>sont</b> mes amis</em>.`,
        `Imitating the popular relative <em>que</em>: say and write <em>le film <b>dont</b> je t'ai parlé</em>, not <em>le film que je t'ai parlé</em>.`,
        `Making liaison after <em>et</em>: <em>Paul et | Anne</em>, never with a t sound.`
      ],
      activities: [
        { t: "match", q: "Match the spoken form to its written equivalent.", pairs: [["chais pas", "je ne sais pas"], ["y a", "il y a"], ["t'as", "tu as"], ["faut que", "il faut que"], ["ça", "cela"]], x: "These reductions are regular: <em>ne</em> and impersonal <em>il</em> drop, vowels elide, and <em>j'sais</em> devoices to <em>chais</em>." },
        { t: "sort", q: "Everyday spoken French or written norm?", cats: ["spoken", "written norm"], items: [["Tu vas où ?", 0], ["Où vas-tu ?", 1], ["On y va ?", 0], ["Nous y allons.", 1], ["Il fut surpris.", 1], ["J'sais pas.", 0], ["Ce sont mes amis.", 1], ["C'est mes amis.", 0]], x: "Questions in situ, <em>on</em>, dropped <em>ne</em> and <em>c'est</em> + plural mark speech; inversion, <em>nous</em>, the passé simple and <em>ce sont</em> belong to the written norm." },
        { t: "mc", q: "Most natural in a casual chat: 'We're leaving tomorrow.'", o: ["On part demain.", "Nous partons demain.", "Nous partirons demain."], a: 0, x: "<em>On</em> replaces <em>nous</em> in everyday speech. The others are correct but sound formal in conversation." },
        { t: "order", q: "Your brother, where does he live? (casual)", w: ["Ton", "frère,", "il", "habite", "où ?"], alt: [], x: "Dislocation (<em>Ton frère, il…</em>) plus a question word left in place (<em>où</em>): two hallmarks of spoken French." },
        { t: "fill", q: "Formal rewrite of 'J'ai pas le temps': Je ___ pas le temps.", h: "avoir", a: ["n'ai"], x: "Writing restores <em>ne</em>, elided before a vowel: <em>Je n'ai pas le temps.</em>" },
        { t: "fill", q: "Formal rewrite of 'C'est des amis': Ce ___ des amis.", h: "être", a: ["sont"], x: "Before a plural noun, careful writing uses <em>ce sont</em>." },
        { t: "mc", q: "Standard form of the popular 'le film que je t'ai parlé':", o: ["le film dont je t'ai parlé", "le film que je t'ai parlé de", "le film où je t'ai parlé"], a: 0, x: "<em>Parler de</em> requires <em>dont</em>. The all-purpose <em>que</em> is stigmatised popular usage." },
        { t: "mc", q: "In which phrase is liaison forbidden?", o: ["les enfants", "ils ont", "Paul et Anne", "chez eux"], a: 2, x: "Liaison never follows <em>et</em>. The other three are obligatory liaisons." },
        { t: "spot", q: "Formal writing: tap the word that needs fixing.", w: ["J'sais", "pas", "pourquoi", "il", "est", "parti"], a: 0, fix: "Je ne sais", x: "Written French restores the full pronoun and both parts of the negation: <em>Je ne sais pas pourquoi il est parti.</em>" },
        { t: "mc", q: "In Québec, 'Tu viens-tu ?' means:", o: ["Are you coming?", "Are YOU coming, you?", "Come here!"], a: 0, x: "<em>-tu</em> here is a yes/no question particle, from the old <em>-ti</em> of <em>vient-il</em>. It is not a second subject pronoun." }
      ],
      sources: [
        { t: "Informal negation — Lawless French", u: "https://www.lawlessfrench.com/grammar/informal-negation/" },
        { t: "La liaison — Vitrine linguistique (OQLF)", u: "https://vitrinelinguistique.oqlf.gouv.qc.ca/23541/la-prononciation/liaisons/la-liaison" },
        { t: "D'où vient le tu interrogatif ? — Correspondance (CCDMD)", u: "https://correspo.ccdmd.qc.ca/wp-content/uploads/2020/05/correspondance-dou-vient-le-tu-interrogatif-et-cest-tu-pertinent-de-lenseigner.pdf" }
      ]
    },

    // ───────────────────────── 4. 1990 spelling reform
    {
      id: "u13-reform",
      title: "The 1990 spelling reform in detail",
      summary: "Rectifications de 1990: hyphens, plurals, circumflex, accents, -eler, laissé; both correct",
      minutes: 20,
      goals: [
        "Explain the status of the 1990 rectifications: recommended, optional, both spellings correct",
        "Apply the main rules: number hyphens, compound plurals, circumflex, accents, -eler/-eter",
        "Know where the circumflex is kept and which verbs keep double consonants",
        "Describe how schools, dictionaries and countries treat the reform"
      ],
      theory: [
        { h: "What it is", html: `<p>The <em>Rectifications de l'orthographe</em> were proposed in 1990 by the Conseil supérieur de la langue française, approved unanimously by the Académie française and published in the Journal officiel. They are <b>recommendations</b>, not obligations: the Académie states that neither spelling can be held to be wrong. They adjust a few thousand words; ordinary prose changes by about one word per page.</p>
<div class="tbl"><table><tr><th>rule</th><th>traditional</th><th>rectified</th></tr>
<tr><td>hyphens in all compound numerals</td><td><em>vingt et un, deux cent un</em></td><td><em>vingt-et-un, deux-cent-un</em></td></tr>
<tr><td>compound nouns (verb or preposition + noun): plural on the last element only</td><td><em>un pèse-lettres, des après-midi</em></td><td><em>un pèse-lettre, des pèse-lettres, des après-midis</em></td></tr>
<tr><td>no circumflex on i and u</td><td><em>connaître, il paraît, la flûte</em></td><td><em>connaitre, il parait, la flute</em></td></tr>
<tr><td>è where é is pronounced è</td><td><em>je céderai, événement</em></td><td><em>je cèderai, évènement</em></td></tr>
<tr><td>-eler/-eter verbs: è not double consonant</td><td><em>il ruisselle, il étiquette</em></td><td><em>il ruissèle, il étiquète</em></td></tr>
<tr><td>borrowings take regular plurals and accents</td><td><em>des matches, un revolver</em></td><td><em>des matchs, un révolver</em></td></tr>
<tr><td>-olle → -ole, -otter → -oter</td><td><em>corolle, grelotter</em></td><td><em>corole, greloter</em></td></tr>
<tr><td>anomalies</td><td><em>nénuphar, oignon, relais, asseoir</em></td><td><em>nénufar, ognon, relai, assoir</em></td></tr>
<tr><td><em>laissé</em> + infinitive invariable</td><td><em>Elle s'est laissée tomber.</em> (old rule: depends)</td><td><em>Elle s'est laissé tomber.</em></td></tr></table></div>
<p>For the Académie, <em>million, milliard</em> and <em>millier</em> are nouns and stay outside the hyphen rule: <em>deux millions</em>. The OQLF hyphenates them too: <em>deux-millions-sept-cent-mille</em>.</p>` },
        { h: "How it works", html: `<p>Each rule removes an <b>inconsistency</b> rather than modernising for its own sake.</p>
<ul><li>Hyphens: the old rule hyphenated only numbers under 100 not joined by <em>et</em>. Now every compound numeral is hyphenated, which also distinguishes <em>soixante-et-un tiers</em> (61/3) from <em>soixante et un tiers</em> (60 + 1/3).</li>
<li>Compound plurals: the old rules depended on meaning (<em>un compte-gouttes</em> already plural in the singular). Now the compound behaves like a simple noun: singular unmarked, plural marked at the end. Exceptions keep their logic: <em>des prie-Dieu, des trompe-l'œil</em>.</li>
<li>Circumflex: on i and u it marks no sound, only history (often a lost s). It is kept where it <b>distinguishes</b> words or forms: <em>dû/du, mûr/mur, sûr/sur, jeûne/jeune</em>, <em>il croît/il croit</em>; the passé simple <em>nous fûmes, vous fîtes</em>; the subjunctive <em>qu'il fût, qu'il eût</em>. Derivatives lose it: <em>sureté</em>.</li>
<li>Accents follow pronunciation: in <em>céderai</em> the first syllable is said with è, as in <em>sèmerai</em>. The same reasoning gives <em>évènement</em>.</li>
<li><em>-eler/-eter</em>: one pattern (<em>il pèle, il achète</em>) replaces two. <em>Appeler, jeter</em> and their families keep the double consonant because those forms are so frequent and stable.</li>
<li><em>Laissé</em> + infinitive now matches <em>fait</em> + infinitive, already invariable (see Lesson: Causative faire & laisser and Lesson: Past participle agreement in depth).</li></ul>` },
        { h: "Status today", html: `<ul><li><b>France</b>: school programmes have named the rectified spelling as the reference since 2008, and the 2016 programmes confirmed it; the traditional spelling is still accepted. The 2016 textbook change provoked a media outcry, mostly about <em>ognon</em>, <em>nénufar</em> and the circumflex.</li>
<li><b>Belgium</b>: ministerial circulars since 2008 ask teachers to give priority to the rectified forms. In French-speaking <b>Switzerland</b>, the CIIP made it the teaching reference in 2021, with new textbooks from 2023.</li>
<li><b>Québec</b>: the OQLF regards both spellings as correct, and the education ministry accepts both in exams. Some other provinces, such as Nova Scotia, teach the new spelling.</li>
<li><b>Dictionaries</b>: the Académie's 9th edition marks recommended forms; Usito, Le Robert and Larousse include many of them, often as variants. Spellcheckers usually offer a "traditional", "reformed" or "both" setting.</li></ul>
<p>Practical advice: either system is correct, but be <b>consistent</b> within a text, and do not over-apply the rules (the circumflex on <em>sûr, dû, nous fûmes</em> stays).</p>` }

<div class="tbl"><table><tr><th>tense</th><th>narrative value</th><th>example</th></tr>
<tr><td>passé simple</td><td>premier plan: completed events that move the story on</td><td><em>Elle <b>ouvrit</b> la porte.</em></td></tr>
<tr><td>imparfait</td><td>arrière-plan: setting, description, habit, ongoing state</td><td><em>Il <b>pleuvait</b> depuis l'aube.</em></td></tr>
<tr><td>présent de narration</td><td>a past event told as if happening now: vividness, a turning point</td><td><em>Soudain, un homme <b>entre</b>.</em></td></tr>
<tr><td>imparfait narratif (de rupture)</td><td>a single, dated event shown as if in progress: a slowed, dramatic close</td><td><em>Le lendemain, il <b>quittait</b> la ville.</em></td></tr>
<tr><td>plus-que-parfait</td><td>flashback (analepse)</td><td><em>Il <b>avait</b> autrefois <b>aimé</b> cette femme.</em></td></tr>
<tr><td>conditionnel</td><td>future seen from the past (prolepse)</td><td><em>Il ne la <b>reverrait</b> jamais.</em></td></tr></table></div>
<p>The imparfait narratif breaks the usual division: a punctual event, usually anchored by a precise time adverbial, takes the background tense. The reader sees it from inside, as a scene rather than a fact. It often ends a chapter. See Lesson: Passé simple & passé antérieur.</p>` },
        { h: "Speech and thought", html: `<ul><li><b>Discours direct</b>: the words as spoken, with quotation marks or dashes and the speaker's own person, tense and deictics: <em>Il dit : « Je pars demain. »</em></li>
<li><b>Discours indirect</b>: subordinated by a reporting verb, with person, tense and deictics shifted: <em>Il dit qu'il partait le lendemain.</em> (see Lesson: Reported speech).</li>
<li><b>Discours indirect libre</b> (free indirect speech): no reporting verb and no <em>que</em>, but the person and tense shifts of indirect speech, while keeping the <b>expressive features of direct speech</b>: exclamations, questions, interjections, colloquial words, and deictics such as <em>demain, maintenant, ici</em>. <em>Il partirait demain, c'était décidé ! Qu'avait-il à perdre, maintenant ?</em></li></ul>
<p>The tell-tale clash is a present-anchored deictic with a past tense (<em>maintenant</em> + imparfait, <em>demain</em> + conditionnel): the narrator's tense combined with the character's here and now.</p>` },
        { h: "How it works", html: `<p>Analysis links a <b>form</b> to an <b>effect</b>. Naming the device is not enough; say what it does to meaning or point of view.</p>
<ul><li>Free indirect speech fuses two voices. The narrator keeps grammatical control (third person, past tense) while the character's feelings colour the syntax. The effect is intimacy, and often irony, because the reader cannot always tell where the narrator stops endorsing the character. It is a key tool of internal focalisation (focalisation interne: the story seen through one character).</li>
<li><b>Modalisation</b> shows the speaker's degree of commitment: the conditionnel of unconfirmed information (<em>Le ministre <b>aurait</b> démissionné</em>), modal adverbs (<em>peut-être, sans doute</em>, which means "probably"), verbs such as <em>sembler, paraître</em>, epistemic <em>devoir</em> (<em>Il a dû partir</em>), and quotation marks of distance.</li>
<li>The <b>agentless passive</b> moves the patient into subject position (the thème) and lets the agent disappear: <em>Les manifestants ont été dispersés.</em> Who dispersed them? The choice can be neutral, tactful or evasive (see Lesson: The passive & its alternatives).</li>
<li><b>Phrases nominales</b> (verbless sentences) have no tense and therefore no time anchoring: <em>Silence. Puis un cri.</em> They give snapshots, impressions or stage directions.</li>
<li><b>Cohesion</b>: an <b>anaphore</b> takes up a referent. It can be pronominal (<em>il</em>), faithful (<em>un homme… cet homme</em>), unfaithful, which adds information or judgement (<em>un homme… <b>ce colosse</b></em>), or a summary of a whole idea (<em>Cette décision…</em>). The choice of label is often the narrator's or character's evaluation.</li></ul>` }

const DEFAULTS = () => ({ xp: 0, lessons: {}, tests: {}, days: {}, goal: 30, badges: {}, read: {}, bank: {}, reviews: 0, open: {}, drill: { right: 0, total: 0, best: 0 }, drillTenses: ["present", "pc", "imparfait", "futur"], drillSet: "all" });

const $ = (s, r = document) => r.querySelector(s);

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLowerCase().replace(/[’`´‘]/g, "'").replace(/ /g, " ").replace(/\s+/g, " ").replace(/\s*'\s*/g, "'").replace(/\s*-\s*/g, "-").replace(/[.!?…]+$/, "").trim();
const strip = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/œ/g, "oe");

/* ═════════ course index ═════════ */
const ALL = [];
COURSE.forEach((u, ui) => { u.num = u.id.replace("u", ""); u.lessons.forEach((l, li) => { l.unit = u; l.num = u.num + "." + (li + 1); ALL.push(l); }); });
const LESSON = Object.fromEntries(ALL.map(l => [l.id, l]));
const UNIT = Object.fromEntries(COURSE.map(u => [u.id, u]));
const rec = id => S.lessons[id] || {};
const isDone = id => !!rec(id).done;
const starsFor = pct => pct >= 100 ? 3 : pct >= 80 ? 2 : pct >= 50 ? 1 : 0;
const nextLesson = () => ALL.find(l => !isDone(l.id)) || null;
const doneCount = () => ALL.filter(l => isDone(l.id)).length;
const totalStars = () => ALL.reduce((n, l) => n + (rec(l.id).stars || 0), 0);
ALL.forEach(l => l.activities.forEach((a, i) => { a._key = l.id + "#" + i; a._lesson = l; }));
const ACT = Object.fromEntries(ALL.flatMap(l => l.activities.map(a => [a._key, a])));
Object.keys(S.bank).forEach(k => { if (!ACT[k]) delete S.bank[k]; });
/* unit test: spread 12 questions evenly across the unit's lessons */
function testItems(u) {
  const pools = u.lessons.map(l => shuffle(l.activities)), out = [];
  for (let r = 0; out.length < 12 && r < 10; r++) pools.forEach(p => { if (out.length < 12 && p[r]) out.push(p[r]); });
  return shuffle(out);
}
/* review: saved mistakes first, topped up from finished lessons */
function reviewItems() {
  const missed = shuffle(Object.keys(S.bank).map(k => ACT[k]).filter(Boolean)).slice(0, 7);
  const pool = shuffle(ALL.filter(l => isDone(l.id)).flatMap(l => l.activities).filter(a => !missed.includes(a)));
  return shuffle([...missed, ...pool.slice(0, 10 - missed.length)]);
}

const LEVELS = [[0, "Débutant"], [100, "Curieux"], [300, "Apprenti"], [600, "Élève"], [1000, "Étudiant"], [1600, "Initié"], [2400, "Connaisseur"], [3500, "Lettré"], [5000, "Érudit"], [7000, "Grammairien"], [10000, "Académicien"]];
function levelInfo(xp) {
  let i = 0; while (i + 1 < LEVELS.length && xp >= LEVELS[i + 1][0]) i++;
  const nx = LEVELS[i + 1];
  return { n: i + 1, name: LEVELS[i][1], from: LEVELS[i][0], to: nx ? nx[0] : null, pct: nx ? (xp - LEVELS[i][0]) / (nx[0] - LEVELS[i][0]) : 1 };
}

const LINES = [["#8D8FA6", "#fff", "#A9ABC2"], ["#FFCD00", "#1B1B3A"], ["#003CA6", "#fff", "#4D7EF0"], ["#837902", "#fff", "#ABA034"], ["#CF009E", "#fff", "#E43BBC"], ["#FF7E2E", "#fff"], ["#6ECA97", "#1B1B3A"], ["#FA9ABA", "#1B1B3A"], ["#E19BDF", "#1B1B3A"], ["#B6BD00", "#1B1B3A"], ["#C9910D", "#fff", "#DCA52A"], ["#704B1C", "#fff", "#A8773F"], ["#007852", "#fff", "#1FA676"], ["#6EC4E8", "#1B1B3A"]];

/* ═════════ network map (course page) ═════════ */
function octiRoute(a, b, diagFirst) {

}

}
function networkSVG(nx) {
  const W = 400, H = 330, cx = 200, cy = 165, n = COURSE.length, f1 = v => v.toFixed(1);
  const lines = COURSE.map((u, i) => {
    const a0 = Math.PI + (i + 0.5) * Math.PI / n, a1 = a0 + Math.PI;
    const A = [cx + 176 * Math.cos(a0), cy + 140 * Math.sin(a0)], B = [cx + 176 * Math.cos(a1), cy + 140 * Math.sin(a1)];
    const off = ((i % 5) - 2) * 15, px = -Math.sin(a0), py = Math.cos(a0);
    const C = [cx + off * px + ((i % 3) - 1) * 10, cy + off * py];
    const pts = octiPath([A, C, B], i);
    const k = u.lessons.length, fr = stopFracs(k), done = u.lessons.map((l, j) => isDone(l.id) ? j : -1).filter(j => j >= 0);
    const passed = (S.tests[u.id]?.best || 0) >= 80;
    const frac = done.length === k && passed ? 1 : done.length ? fr[Math.max(...done)] : 0;
    const d = "M" + pts.map(p => f1(p[0]) + " " + f1(p[1])).join(" L");
    const stops = u.lessons.map((l, j) => { const [x, y] = pointAt(pts, fr[j]), cur = nx && nx.id === l.id; return `<circle class="${cur ? "nm-here" : "nm-stop"}" cx="${f1(x)}" cy="${f1(y)}" r="${cur ? 5.6 : 3.5}"/>`; }).join("");

    ${lines.map(o => `<g class="nm-line lc" style="${lineStyle(o.u)}" data-u="${o.u.id}" tabindex="0" role="button" aria-label="Unit ${o.u.num}: ${esc(o.u.title)}"><path class="nm-base" d="${o.d}"/>${o.frac ? `<path class="nm-fill" d="${o.d}" style="stroke-dasharray:${f1(o.L * o.frac)} ${f1(o.L + 20)}"/>` : ""}</g>`).join("")}
    <g class="nm-stops" aria-hidden="true">${lines.map(o => o.stops).join("")}</g>
    ${lines.map(o => o.ends.map(e => `<g class="nm-roundel lc" style="${lineStyle(o.u)}" data-u="${o.u.id}" aria-hidden="true"><circle cx="${f1(e[0])}" cy="${f1(e[1])}" r="12"/><text x="${f1(e[0])}" y="${f1(e[1] + 4.6)}" text-anchor="middle">${o.u.num}</text></g>`).join("")).join("")}

}

      <div class="q-actions" style="margin-top:8px"><button class="btn" id="bk">Copy backup code</button></div>
      <textarea id="bk-code" class="code-box" readonly hidden aria-label="Backup code"></textarea>
      <label class="lbl" for="rs-code" style="display:block;margin-top:1rem">Restore from a code</label>
      <textarea id="rs-code" class="code-box" placeholder="Paste a backup code starting with GF1."></textarea>
      <div class="q-actions" style="margin-top:8px"><button class="btn" id="rs">Restore progress</button><span class="note" id="rs-msg" style="margin:0;align-self:center"></span></div>
    </section>
    <section class="sec"><h2>Start over</h2>
      <div id="reset-box"><button class="btn ghost" id="reset">Reset all progress</button></div></section>
  </div>`;
  app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { S.goal = +b.dataset.g; save(); checkBadges(); renderProgress(); });
  $("#bk").onclick = () => {
    const code = encodeBackup(), ta = $("#bk-code");
    ta.value = code; ta.hidden = false;
    const fallback = () => { ta.focus(); ta.select(); toast(IC.check, "Code selected. Copy it from the box."); };
    try { navigator.clipboard.writeText(code).then(() => toast(IC.check, "Backup code copied"), fallback); } catch (e) { fallback(); }
  };
  $("#rs").onclick = () => {
    try {
      const o = decodeBackup($("#rs-code").value);
      snapshot("Before restoring a backup");
      S = Object.assign(DEFAULTS(), o); save(); hud(); checkBadges(); renderProgress();
      toast(IC.check, "Progress restored");
    } catch (e) { $("#rs-msg").textContent = "That code didn't work. Copy the whole code, starting with GF1."; }
  };
  app.querySelectorAll("[data-snap]").forEach(b => b.onclick = () => {
    const i = +b.dataset.snap, box = $("#snap-" + i);
    box.innerHTML = `<span class="note" style="margin:0">Your current progress is saved as a snapshot first.</span><button class="btn" id="snap-no-${i}">Cancel</button><button class="btn primary" id="snap-yes-${i}">Restore this</button>`;
    $("#snap-no-" + i).onclick = renderProgress;
    $("#snap-yes-" + i).onclick = () => restoreSnapshot(i);
  });
  $("#reset").onclick = () => {
    $("#reset-box").innerHTML = `<div class="confirm"><span>Erase all XP, stars, streaks and badges? A snapshot is saved first, so you can undo this.</span><button class="btn" id="no">Keep everything</button><button class="btn primary" id="yes">Erase progress</button></div>`;
    $("#no").onclick = renderProgress;
    $("#yes").onclick = () => { snapshot("Before reset"); S = Object.assign(DEFAULTS(), { goal: S.goal, drillTenses: S.drillTenses, drillSet: S.drillSet }); save(); hud(); renderProgress(); };
  };
}

/* ═════════ conjugation engine ═════════ */
const PRON = ["je", "tu", "il/elle/on", "nous", "vous", "ils/elles"];
const TENSES = [
  { id: "present", name: "Présent", en: "I speak" },
  { id: "pc", name: "Passé composé", en: "I spoke / have spoken" },
  { id: "imparfait", name: "Imparfait", en: "I was speaking / used to" },
  { id: "pqp", name: "Plus-que-parfait", en: "I had spoken" },
  { id: "futur", name: "Futur simple", en: "I will speak" },
  { id: "cond", name: "Conditionnel présent", en: "I would speak" },
  { id: "subj", name: "Subjonctif présent", en: "(that) I speak" },
  { id: "imper", name: "Impératif", en: "speak!" }
];
const END = { imp: ["ais", "ais", "ait", "ions", "iez", "aient"], fut: ["ai", "as", "a", "ons", "ez", "ont"], subj: ["e", "es", "e", "ions", "iez", "ent"] };
const AGREE = ["(e)", "(e)", "(e)", "(e)s", "(e)(s)", "(e)s"];
function joinStem(stem, end) {
  if (end[0] === "i" || end[0] === "e") { if (stem.endsWith("ge")) stem = stem.slice(0, -1); if (stem.endsWith("ç")) stem = stem.slice(0, -1) + "c"; }
  return [stem, end];
}
function splitPresent(inf, form) {
  const base = inf.replace(/(er|ir|re|oir)$/, "");
  let i = 0; while (i < form.length && i < base.length && form[i] === base[i]) i++;
  return i >= 2 ? [form.slice(0, i), form.slice(i)] : [form, ""];
}
function simple(inf, tense) {
  const v = VERBS[inf], pres = v.p.split(" ");
  if (tense === "present") return pres.map(f => v.g.startsWith("irregular") ? [f, ""] : splitPresent(inf, f));
  if (tense === "imparfait") { const st = v.imp || pres[3].replace(/ons$/, ""); return END.imp.map(e => joinStem(st, e)); }
  if (tense === "futur") return END.fut.map(e => [v.f, e]);
  if (tense === "cond") return END.imp.map(e => [v.f, e]);
  if (tense === "subj") {
    if (v.s) return v.s.split(" ").map(f => [f, ""]);
    const st = pres[5].replace(/ent$/, ""), impSt = v.imp || pres[3].replace(/ons$/, "");
    return END.subj.map((e, k) => (k === 3 || k === 4) ? joinStem(impSt, e) : [st, e]);
  }
  if (tense === "imper") {
    if (v.ipv === "-") return [null, null, null, null, null, null];
    let f;
    if (v.ipv) f = v.ipv.split(" ");
    else { let tu = pres[1]; if (/es$/.test(tu)) tu = tu.slice(0, -1); f = [tu, pres[3], pres[4]]; }
    return [null, [f[0], ""], null, [f[1], ""], [f[2], ""], null];
  }
}
function conj(inf, tense) {
  const v = VERBS[inf];
  if (tense === "pc" || tense === "pqp") {
    const aux = v.e ? "être" : "avoir";
    const auxForms = simple(aux, tense === "pc" ? "present" : "imparfait").map(([a, b]) => a + b);
    return auxForms.map((a, k) => ({ aux: a, pp: v.pp, agree: v.e ? AGREE[k] : "" }));
  }
  return simple(inf, tense).map(x => x && { stem: x[0], end: x[1] });
}
const vowelStart = s => /^[aeéèêiîoôuûh]/i.test(s);
function pronoun(k, firstWord, tense) {
  if (tense === "imper") return "(" + ["tu", "", "", "nous", "vous", ""][k] + ")";
  let p = PRON[k];
  if (k === 0 && vowelStart(firstWord)) p = "j'";
  if (tense === "subj") p = (k === 2 || k === 5) ? "qu'" + p : "que " + p;
  return p;
}
const plain = f => f.aux ? f.aux + " " + f.pp : f.stem + f.end;

/* ═════════ conjugation view ═════════ */
let conjMode = "ref", conjVerb = "être";
try { conjVerb = localStorage.getItem("grammaire-verb") || "être"; if (!VERBS[conjVerb]) conjVerb = "être"; } catch (e) {}
function renderConj() {
  app.innerHTML = `
  <section class="wall hero"><div class="wrap">
    <h1>Conjugaison</h1>
    <p>${Object.keys(VERBS).length} verbs in ${TENSES.length} tenses. Look them up in the tables, or drill them for 3 XP a correct answer.</p>
    <div class="picker"><div class="seg" role="group" aria-label="Mode">
      <button id="m-ref" aria-pressed="${conjMode === "ref"}">Tables</button>
      <button id="m-drill" aria-pressed="${conjMode === "drill"}">Drill</button>
    </div></div>
  </div></section>
  <div class="wrap"><div id="conj-body"></div></div>`;
  $("#m-ref").onclick = () => { conjMode = "ref"; renderConj(); };
  $("#m-drill").onclick = () => { conjMode = "drill"; renderConj(); };
  conjMode === "ref" ? drawRef() : drawDrill();
}
function drawRef() {
  const body = $("#conj-body"), groups = {};
  Object.entries(VERBS).forEach(([k, v]) => { const g = v.g.startsWith("irregular") ? "Irregular" : "Regular & spelling-change"; (groups[g] = groups[g] || []).push(k); });
  const v = VERBS[conjVerb];
  body.innerHTML = `
    <div class="picker"><label for="verb-sel">Verb</label>
      <select id="verb-sel">${Object.entries(groups).map(([g, ks]) => `<optgroup label="${g}">${ks.map(k => `<option value="${k}" ${k === conjVerb ? "selected" : ""}>${k} — ${VERBS[k].en}</option>`).join("")}</optgroup>`).join("")}</select></div>
    <div class="verb-id"><h2 lang="fr">${conjVerb}</h2><span class="meta">${v.en}</span></div>
    <div class="verb-facts"><span>${v.g}</span><span>auxiliary: ${v.e ? "être" : "avoir"}</span><span>participle: ${v.pp}</span><span>future stem: ${v.f}-</span></div>
    <div class="conj-grid">${TENSES.map(T => {
      const forms = conj(conjVerb, T.id);
      if (forms.every(f => !f)) return `<div class="tense"><h3>${T.name} <small>${T.en}</small></h3><p class="note" style="margin:0">Not used in the imperative.</p></div>`;
      return `<div class="tense"><h3>${T.name} <small>${T.en}</small></h3><table>${forms.map((f, k) => {
        if (!f) return "";
        const first = f.aux || (f.stem + f.end), pr = pronoun(k, first, T.id);
        const form = f.aux ? `<span class="aux">${f.aux}</span> ${f.pp}${f.agree ? `<span class="aux">${f.agree}</span>` : ""}` : `${f.stem}${f.end ? `<span class="end">${f.end}</span>` : ""}`;
        return `<tr><td class="pr" lang="fr">${pr}</td><td class="fm" lang="fr">${form}</td></tr>`;
      }).join("")}</table></div>`;
    }).join("")}</div>
    <p class="note">Highlighted letters are the endings. Grey shows the auxiliary and the agreement you add with être.</p>`;
  $("#verb-sel").onchange = e => { conjVerb = e.target.value; try { localStorage.setItem("grammaire-verb", conjVerb); } catch (er) {} drawRef(); };
}
let D = null;
const drillPool = () => Object.keys(VERBS).filter(k => S.drillSet === "all" || (S.drillSet === "irr" ? VERBS[k].g.startsWith("irregular") : !VERBS[k].g.startsWith("irregular")));
function newDrill() {
  const tenses = S.drillTenses.length ? S.drillTenses : ["present"], pool = drillPool();
  let inf, tense, k, f, guard = 0;
  do {
    inf = pool[Math.floor(Math.random() * pool.length)];
    tense = tenses[Math.floor(Math.random() * tenses.length)];
    k = Math.floor(Math.random() * 6);
    f = conj(inf, tense)[k];
  } while (!f && ++guard < 50);
  if (!f) { tense = "present"; f = conj(inf, tense)[k]; }
  D = { inf, tense, k, f, answered: false, run: D ? D.run : 0 };
}
function drawDrill() {
  if (!D) newDrill();
  const body = $("#conj-body"), T = TENSES.find(t => t.id === D.tense);
  const first = D.f.aux || (D.f.stem + D.f.end), pr = pronoun(D.k, first, D.tense);
  const acc = S.drill.total ? Math.round(S.drill.right / S.drill.total * 100) : 0;
  body.innerHTML = `
    <div class="lbl" style="margin-top:1rem">Tenses</div>
    <div class="chips">${TENSES.map(t => `<button class="toggle" data-t="${t.id}" aria-pressed="${S.drillTenses.includes(t.id)}">${t.name}</button>`).join("")}</div>
    <div class="lbl" style="margin-top:1rem">Verbs</div>
    <div class="chips">${[["all", "All " + Object.keys(VERBS).length], ["reg", "Regular"], ["irr", "Irregular"]].map(([k, l]) => `<button class="toggle" data-s="${k}" aria-pressed="${S.drillSet === k}">${l}</button>`).join("")}</div>
    <div class="card" aria-live="polite">
      <div class="card-top"><span>Run <b>${D.run}</b></span><span>Best run <b>${S.drill.best}</b></span><span>Accuracy <b>${acc}%</b></span></div>
      <div class="drill-prompt"><span class="inf" lang="fr">${D.inf}</span><span class="tn">${T.name} · ${VERBS[D.inf].en}</span></div>
      <div class="drill-line"><span class="pr" lang="fr">${D.tense === "subj" || D.tense === "imper" ? pr : PRON[D.k]}</span><input class="gap-input" id="dans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Conjugated form"></div>
      ${accentBar()}
      <div class="q-actions"><button class="btn primary" id="dcheck">Check</button><button class="btn ghost" id="dskip">Show answer</button></div>
      <div id="dfb"></div>
    </div>
    <p class="note">Type the verb form only. With être, the masculine form is enough (agreement is accepted too).</p>`;
  body.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    const id = b.dataset.t, on = S.drillTenses.includes(id);
    if (on && S.drillTenses.length === 1) return;
    S.drillTenses = on ? S.drillTenses.filter(x => x !== id) : [...S.drillTenses, id]; save();
    if (!S.drillTenses.includes(D.tense)) newDrill();
    drawDrill();
  });
  body.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { S.drillSet = b.dataset.s; save(); newDrill(); drawDrill(); });
  const inp = $("#dans"); wireAccents(body, inp);
  const check = giveUp => {
    if (D.answered) return;
    const v = norm(inp.value).replace(/^(que |qu')/, "").replace(/^(je |j'|tu |il |elle |on |nous |vous |ils |elles )/, "");
    if (!v && !giveUp) { inp.focus(); return; }
    D.answered = true;
    const base = plain(D.f), variants = D.f.agree ? ["", "e", "s", "es"].map(x => base + x) : [base];
    let ok = !giveUp && variants.map(norm).includes(v), warn = false;
    if (!ok && !giveUp && variants.map(x => strip(norm(x))).includes(strip(v))) { ok = true; warn = true; }
    S.drill.total++;
    if (ok) { S.drill.right++; D.run++; S.drill.best = Math.max(S.drill.best, D.run); } else D.run = 0;
    save(); if (ok) addXP(3); checkBadges();
    inp.classList.add(ok ? "ok" : "no"); inp.readOnly = true;
    const shown = D.f.aux ? `${D.f.aux} ${D.f.pp}${D.f.agree}` : base;
    const fullPr = pronoun(D.k, D.f.aux || base, D.tense), sep = fullPr.endsWith("'") ? "" : " ";
    const line = D.tense === "imper" ? `${shown} ! ${fullPr}` : `${fullPr}${sep}${shown}`;
    $("#dfb").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}"><span class="verdict">${ok ? IC.check + "Correct" : IC.x + "Not quite"}${ok ? '<span class="plus">+3 XP</span>' : ""}</span>
      ${warn ? `<span class="warnline">Check the accents.</span>` : ""}<em lang="fr">${line}</em></div>
      <div class="q-actions"><button class="btn primary" id="dnext">Next verb</button><button class="btn ghost" id="dtable">Open ${D.inf} tables</button></div>`;
    body.querySelector(".accents").remove(); $("#dcheck").remove(); $("#dskip").remove();
    $("#dnext").onclick = () => { newDrill(); drawDrill(); };
    $("#dtable").onclick = () => { conjVerb = D.inf; conjMode = "ref"; renderConj(); };
    $("#dnext").focus({ preventScroll: true });
  };
  $("#dcheck").onclick = () => check(false);
  $("#dskip").onclick = () => check(true);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(false); } });
  if (canHover()) inp.focus({ preventScroll: true });
}


/* ═════════ standalone app extras (GitHub Pages build only) ═════════ */
/* offline support */
if ("serviceWorker" in navigator) window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
/* ask the browser to keep this app's storage (granted silently for installed apps) */
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}

/* "Install app" button, shown only when Chrome says the app can be installed */
let installEvt = null;
const isInstalled = () => window.matchMedia("(display-mode: standalone)").matches;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); installEvt = e;
  if (isInstalled() || $("#install")) return;
  const b = document.createElement("button");
  b.id = "install"; b.className = "install-pill"; b.type = "button";
  b.innerHTML = `${IC.bolt}<span>Install app</span>`;
  b.onclick = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (er) {} installEvt = null; b.remove(); };
  document.body.appendChild(b);
});
window.addEventListener("appinstalled", () => { const b = $("#install"); if (b) b.remove(); toast(IC.check, "Installed. Open Grammaire from your home screen."); });
const _hashRoute = route;
route = function () { _hashRoute(); const b = $("#install"); if (b) b.hidden = document.body.classList.contains("playing"); };

/* backup as a file: download and restore */
const backupName = () => `grammaire-progress-${today()}.json`;
function downloadBackup() {
  const data = JSON.stringify({ app: "grammaire", version: 1, savedAt: new Date().toISOString(), state: S }, null, 1);
  const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = backupName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(IC.check, "Backup saved to your Downloads");
}
function restoreFromText(text) {
  const t = String(text).trim();
  let o;
  if (t.startsWith("GF1.")) o = decodeBackup(t);
  else { const j = JSON.parse(t); o = j && j.state ? j.state : j; }
  if (!o || typeof o !== "object" || typeof o.xp !== "number" || typeof o.lessons !== "object") throw new Error("shape");
  snapshot("Before restoring a backup");
  S = Object.assign(DEFAULTS(), o); save(); hud(); checkBadges(); renderProgress();
  toast(IC.check, "Progress restored");
}
const _renderProgress = renderProgress;
renderProgress = function () {
  _renderProgress();
  const bk = $("#bk"); if (!bk) return;
  bk.insertAdjacentHTML("beforebegin", `<button class="btn primary" id="dl">Download backup file</button>`);
  $("#dl").onclick = downloadBackup;
  const rs = $("#rs");
  rs.insertAdjacentHTML("afterend", `<label class="btn" for="rs-file">Restore from file</label><input type="file" id="rs-file" accept=".json,application/json,text/plain" hidden>`);
  $("#rs-file").onchange = e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { restoreFromText(r.result); } catch (er) { $("#rs-msg").textContent = "That file isn't a Grammaire backup."; } };
    r.readAsText(f);
  };
  const note = bk.closest(".sec").querySelector(".note");
  if (note) note.textContent = "Progress is saved inside this app on this phone. Download a backup file now and then, or copy the code, to keep it safe or move it to another device.";
};

route();
