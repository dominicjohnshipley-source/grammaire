    // ───────────────────────── 7. Pronominal verbs ─────────────────────────
    {
      id: "u2-pronominal",
      title: "Pronominal verbs",
      summary: "je me lève, ils s'aiment, je m'appelle: verbs with a reflexive pronoun",
      minutes: 14,
      goals: [
        "Conjugate a pronominal verb with the right reflexive pronoun",
        "Tell reflexive, reciprocal and idiomatic uses apart",
        "Place ne... pas and use the pronoun with an infinitive",
        "Use le/la/les with body parts and form Lève-toi !"
      ],
      theory: [
        { h: "The forms", html: `
<p>A <b>verbe pronominal</b> (pronominal verb) has a <b>pronom réfléchi</b> (reflexive pronoun) that refers back to the subject. The infinitive is listed with <em>se</em>: <em>se laver</em> (to wash oneself).</p>
<div class="tbl"><table>
<tr><th>se laver</th><th>s'habiller</th></tr>
<tr><td><em>je <b>me</b> lave</em></td><td><em>je <b>m'</b>habille</em></td></tr>
<tr><td><em>tu <b>te</b> laves</em></td><td><em>tu <b>t'</b>habilles</em></td></tr>
<tr><td><em>il / elle / on <b>se</b> lave</em></td><td><em>il <b>s'</b>habille</em></td></tr>
<tr><td><em>nous <b>nous</b> lavons</em></td><td><em>nous <b>nous</b> habillons</em></td></tr>
<tr><td><em>vous <b>vous</b> lavez</em></td><td><em>vous <b>vous</b> habillez</em></td></tr>
<tr><td><em>ils / elles <b>se</b> lavent</em></td><td><em>ils <b>s'</b>habillent</em></td></tr>
</table></div>
<p><em>Me, te, se</em> become <em>m', t', s'</em> before a vowel or mute h. The verb itself conjugates normally.</p>` },
        { h: "How it works", html: `
<p>The reflexive pronoun is an object pronoun that happens to point back at the subject. Compare <em>Je lave la voiture</em> (I wash the car) with <em>Je <b>me</b> lave</em> (I wash myself). English often leaves "myself" out ("I get dressed"); French must say it, because without the pronoun the verb would need some other object.</p>
<p>There are three main uses:</p>
<ul>
<li><b>Reflexive</b>: the subject acts on itself. <em>Il se rase</em>, <em>je me lève</em>.</li>
<li><b>Reciprocal</b>: plural subjects act on each other. <em>Ils s'aiment</em> (they love each other), <em>on se téléphone</em>.</li>
<li><b>Idiomatic</b>: the pronoun changes the meaning. <em>appeler</em> (call) → <em>s'appeler</em> (be called); <em>ennuyer</em> (bore) → <em>s'ennuyer</em> (be bored); <em>entendre</em> (hear) → <em>s'entendre</em> (get on).</li>
</ul>
<p>A few verbs exist only in pronominal form, such as <em>se souvenir</em> (remember).</p>
<p>Because the pronoun already says whose body it is, French uses <em>le / la / les</em> with body parts, not a possessive: <em>Je me brosse <b>les</b> dents</em> (I brush my teeth).</p>` },
        { h: "Word order", html: `
<p><b>Negation</b>: the pronoun stays glued to the verb, and <em>ne... pas</em> goes round the pair: <em>Je <b>ne</b> me lève <b>pas</b> tôt.</em></p>
<p><b>With an infinitive</b>: the pronoun goes before the infinitive and still matches the subject: <em>Je vais <b>me</b> coucher</em>, <em>Tu dois <b>te</b> lever</em>, <em>Nous allons <b>nous</b> promener</em>. <em>Se</em> appears only when the subject is 3rd person.</p>
<p><b>Affirmative imperative</b> (commands): the pronoun moves after the verb with a hyphen, and <em>te</em> becomes <em>toi</em>: <em>Lève-toi !</em>, <em>Lave-toi les mains !</em> With <em>vous</em> and <em>nous</em>: <em>Levez-vous !</em> In the negative, it returns before the verb: <em>Ne te lève pas !</em> The full imperative comes in a later lesson.</p>` }
      ],
      examples: [
        ["Je me lève à sept heures.", "I get up at seven."],
        ["Comment vous appelez-vous ?", "What's your name?"],
        ["Ils se téléphonent tous les jours.", "They phone each other every day."],
        ["Elle ne se maquille pas.", "She doesn't wear make-up."],
        ["Je vais me coucher.", "I'm going to bed."],
        ["Lave-toi les mains !", "Wash your hands!"]
      ],
      pitfalls: [
        `Keeping <em>se</em> with an infinitive whatever the subject: <em>je vais <b>me</b> coucher</em>, never <em>je vais se coucher</em>.`,
        `Using a possessive with body parts: <em>je me lave <b>les</b> mains</em>, not <em>je me lave mes mains</em>.`,
        `Splitting the pronoun from the verb in negation: <em>je ne <b>me lève</b> pas</em>, never <em>je me ne lève pas</em>.`,
        `Forgetting élision: <em>je <b>m'</b>appelle</em>, never <em>je me appelle</em>.`
      ],
      activities: [
        { t: "match", q: "Match the subject to its reflexive pronoun.", pairs: [["je", "me"], ["tu", "te"], ["il", "se"], ["nous", "nous"], ["vous", "vous"]], x: "Only the 3rd person uses <em>se</em>. <em>Nous</em> and <em>vous</em> repeat themselves." },
        { t: "fill", q: "Tu ___ lèves à quelle heure ?", h: "reflexive pronoun", a: ["te"], x: "<em>Tu</em> takes <em>te</em>: <em>tu te lèves</em>." },
        { t: "fill", q: "Je ___ appelle Sophie.", h: "reflexive pronoun", a: ["m'"], x: "<em>Me</em> elides before a vowel: <em>je m'appelle</em>." },
        { t: "fill", q: "Nous nous ___ à sept heures.", h: "se réveiller", a: ["réveillons"], x: "The verb conjugates normally after the pronoun: <em>nous nous réveillons</em>." },
        { t: "sort", q: "Reflexive, reciprocal or idiomatic?", cats: ["reflexive", "reciprocal", "idiomatic"], items: [["Je me lave.", 0], ["Ils s'aiment.", 1], ["Je m'appelle Tom.", 2], ["Elle s'habille.", 0], ["Nous nous écrivons.", 1], ["Tu t'ennuies ?", 2], ["Il se rase.", 0]], x: "Reflexive: on oneself. Reciprocal: on each other. Idiomatic: the pronoun changes the meaning (<em>appeler</em> → <em>s'appeler</em>)." },
        { t: "mc", q: "I'm going to go to bed.", o: ["Je vais me coucher.", "Je vais se coucher.", "Je me vais coucher."], a: 0, x: "The pronoun sits before the infinitive and matches <em>je</em>." },
        { t: "spot", q: "Tap the word that's wrong.", w: ["Nous", "allons", "se", "promener"], a: 2, fix: "nous", x: "The pronoun matches the subject <em>nous</em>: <em>nous allons nous promener</em>." },
        { t: "spot", q: "Tap the word that's wrong.", w: ["Je", "me", "brosse", "mes", "dents"], a: 3, fix: "les", x: "With body parts, the reflexive pronoun shows the owner, so use <em>les</em>: <em>je me brosse les dents</em>." },
        { t: "order", q: "I don't get up early.", w: ["Je", "ne", "me", "lève", "pas", "tôt"], x: "<em>Ne</em> goes before the pronoun + verb block, <em>pas</em> after it." },

      ],
      sources: [

COURSE.push({
  id: "u3",
  level: "A1–A2",
  title: "Describing things",
  intro: "Adjectives, comparisons and adverbs let you say what things are like and how things are done. This unit shows how French adjectives agree and where they sit, how to compare, how adverbs are built, and when to say c'est or il est.",
  lessons: [

    // ───────────────────────── 1. Adjective agreement
    {
      id: "u3-adj-agreement",
      title: "Adjective agreement",
      summary: "Masculine/feminine, singular/plural: the endings that adjectives take",
      minutes: 15,
      goals: [
        "Make an adjective agree with its noun in gender and number",
        "Form the feminine of adjectives in -eux, -if, -er, -el, -en, -on, -et and -c",
        "Use the irregulars blanc, long, doux, frais, faux and gentil",
        "Handle -al/-eau plurals, mixed groups and invariable colours"
      ],
      theory: [
        { h: "The rule", html: `<p>An adjectif (adjective) takes the gender and number of the nom (noun) it describes. The masculine singular is the dictionary form. By default you add <b>-e</b> for feminine and <b>-s</b> for plural:</p>
<div class="tbl"><table><tr><th></th><th>singular</th><th>plural</th></tr>
<tr><td>masculine</td><td><em>petit</em></td><td><em>petit<b>s</b></em></td></tr>
<tr><td>feminine</td><td><em>petit<b>e</b></em></td><td><em>petit<b>es</b></em></td></tr></table></div>
<p>If the masculine already ends in an unaccented <em>-e</em>, nothing is added for the feminine: <em>un livre rouge, une voiture rouge</em>. If it ends in <em>-s</em> or <em>-x</em>, nothing is added for the masculine plural: <em>des chats gris, des hommes heureux</em>.</p>` },
        { h: "Feminine patterns", html: `<div class="tbl"><table><tr><th>masculine</th><th>feminine</th><th>example</th></tr>
<tr><td>-eux</td><td>-euse</td><td><em>heureux → heur<b>euse</b></em></td></tr>
<tr><td>-if</td><td>-ive</td><td><em>actif → act<b>ive</b></em></td></tr>
<tr><td>-er</td><td>-ère</td><td><em>cher → ch<b>ère</b>, premier → premi<b>ère</b></em></td></tr>
<tr><td>-el, -en, -on</td><td>-elle, -enne, -onne</td><td><em>cruel<b>le</b>, ancien<b>ne</b>, bon<b>ne</b></em></td></tr>
<tr><td>-et</td><td>-ette (most)</td><td><em>muet → mu<b>ette</b>, net → n<b>ette</b></em></td></tr>
<tr><td>-et</td><td>-ète (a few)</td><td><em>complet → compl<b>ète</b>, inquiet, secret, discret</em></td></tr>
<tr><td>-c</td><td>-che or -que</td><td><em>blanc → blan<b>che</b>, sec → s<b>èche</b>, public → publi<b>que</b>, grec → gre<b>cque</b></em></td></tr></table></div>
<p>Irregulars to learn: <em>long → longue, doux → douce, frais → fraîche, faux → fausse, gentil → gentille</em>.</p>` },
        { h: "How it works", html: `<p>Most of these patterns are spelling that protects a sound. In <em>petit</em> the final <em>t</em> is silent. Adding <em>-e</em> makes it pronounced: <em>petite</em>. So in speech the feminine is often the masculine plus a consonant sound.</p>
<ul><li>Doubling the consonant (<em>bonne, ancienne, cruelle, nette</em>) shows that the consonant is now pronounced and, after <em>-on/-en</em>, that the vowel is no longer nasal: <em>bon</em> sounds nasal, <em>bonne</em> does not.</li>
<li>The grave accent (<em>chère, complète</em>) is the other way of marking the open è sound before a consonant + silent <em>e</em>.</li>
<li><em>-f → -ve</em> and <em>-x → -se</em>: between vowels the feminine has a voiced consonant sound (v, z), much as in English <em>wife/wives</em>.</li>
<li><em>-que</em> and <em>-che</em> keep a final <em>c</em> from being read as an s sound before <em>e</em>.</li></ul>
<p>Plurals follow the noun patterns. <em>-al</em> becomes <em>-aux</em> in the masculine plural (<em>normal → normaux</em>, but feminine <em>normales</em>); a few keep <em>-als</em> (<em>banals, finals</em>). <em>-eau</em> takes <em>-x</em>: <em>beaux, nouveaux</em>.</p>
<p>When one adjective describes a mixed group of masculine and feminine nouns, it takes the <b>masculine plural</b>: <em>Paul et Marie sont content<b>s</b></em>. The masculine is the unmarked default form in French grammar.</p>` },
        { h: "Colours", html: `<p>Ordinary colour adjectives agree: <em>des chemises blanches, des yeux verts</em>.</p>
<ul><li>Colours that are really nouns (a fruit, a nut, a stone) stay invariable, because they mean "the colour of": <em>des chaussures <b>marron</b>, des t-shirts <b>orange</b></em>. <em>Rose</em> and <em>mauve</em> (and a few rarer ones such as <em>fauve, pourpre, écarlate</em>) are exceptions and agree: <em>des fleurs roses</em>.</li>
<li>Compound colours (two words) are invariable: <em>des yeux <b>bleu clair</b>, une robe <b>vert foncé</b></em>.</li></ul>` }
      ],
      examples: [
        ["Ma sœur est très active et curieuse.", "My sister is very active and curious."],

        ["Ce sont des problèmes normaux.", "These are normal problems."],

    // ───────────────────────── 2. Adjective placement
    {
      id: "u3-adj-placement",
      title: "Where adjectives go",
      summary: "After the noun by default, BAGS before, bel/nouvel/vieil, and meaning changes",
      minutes: 15,
      goals: [
        "Place most adjectives after the noun",

        "Use bel, nouvel and vieil before a vowel sound",

      ],
      theory: [
        { h: "The rule", html: `<p>Most adjectives go <b>after</b> the noun: <em>une voiture rouge, un film intéressant, un vin français</em>.</p>
<p>A short list of very common adjectives goes <b>before</b>. Remember them as BAGS:</p>
<ul><li><b>B</b>eauty: <em>beau, joli</em></li>
<li><b>A</b>ge: <em>jeune, vieux, nouveau</em></li>
<li><b>G</b>oodness: <em>bon, mauvais, gentil</em></li>
<li><b>S</b>ize: <em>grand, petit, gros, long</em></li></ul>
<p>So: <em>une <b>petite</b> maison, un <b>bon</b> restaurant, une <b>jolie</b> fille</em>. You can combine both: <em>une petite voiture rouge</em>.</p>` },
        { h: "How it works", html: `<p>French tends to put the noun first and the defining information after it. An adjective after the noun sorts the thing into a category: colour, shape, nationality, religion, a property you could check. <em>Un vin français</em> picks out French wine from all wine.</p>
<p>The BAGS adjectives are short, very frequent and often subjective. Placed before, they blend with the noun into a single idea (<em>une petite maison</em>) rather than classifying it. That is why position can change meaning: before the noun an adjective is more figurative or subjective; after it, more literal and objective.</p>
<p><em>Beau, nouveau, vieux</em> have special forms before a masculine noun starting with a vowel sound: <em><b>bel</b> homme, <b>nouvel</b> ami, <b>vieil</b> arbre</em>. These are older forms kept so that the adjective links smoothly to the vowel. They are also the base of the feminines: <em>bel → belle, nouvel → nouvelle, vieil → vieille</em>. In the plural the normal form returns: <em>de beaux arbres</em>.</p>
<p>In standard written French, the plural article <em>des</em> becomes <b>de</b> before a preposed adjective: <em><b>de</b> petites maisons, <b>de</b> bons amis</em>. In everyday speech many people say <em>des petites maisons</em>. Fixed compounds keep <em>des</em>: <em>des petits pois</em>.</p>` },
        { h: "Meaning changes with position", html: `<div class="tbl"><table><tr><th>adjective</th><th>before the noun</th><th>after the noun</th></tr>
<tr><td><em>ancien</em></td><td><em>mon ancien prof</em>: former</td><td><em>un meuble ancien</em>: old, antique</td></tr>
<tr><td><em>propre</em></td><td><em>ma propre chambre</em>: own</td><td><em>une chambre propre</em>: clean</td></tr>
<tr><td><em>grand</em> (people)</td><td><em>un grand homme</em>: great</td><td><em>un homme grand</em>: tall</td></tr>
<tr><td><em>cher</em></td><td><em>mon cher ami</em>: dear</td><td><em>un repas cher</em>: expensive</td></tr>
<tr><td><em>seul</em></td><td><em>la seule personne</em>: only</td><td><em>une personne seule</em>: alone, lonely</td></tr>
<tr><td><em>même</em></td><td><em>le même jour</em>: same</td><td><em>le jour même</em>: that very day</td></tr>
<tr><td><em>dernier</em></td><td><em>la dernière semaine</em>: final (of a series)</td><td><em>la semaine dernière</em>: last week, just gone</td></tr>
<tr><td><em>pauvre</em></td><td><em>un pauvre homme</em>: unfortunate</td><td><em>un homme pauvre</em>: penniless</td></tr></table></div>` }
      ],
      examples: [
        ["J'ai une petite voiture rouge.", "I have a small red car."],
        ["C'est un bel appartement.", "It's a beautiful flat."],
        ["Mon ancien professeur habite à Lyon.", "My former teacher lives in Lyon."],
        ["Il y a de jolies fleurs dans le jardin.", "There are pretty flowers in the garden."],
        ["Je suis allé à Paris la semaine dernière.", "I went to Paris last week."]
      ],
      pitfalls: [
        `Putting every adjective first, as in English: <em>une voiture <b>rouge</b></em>, not <em>une rouge voiture</em>.`,
        `Using <em>beau, nouveau, vieux</em> before a vowel: <em>un <b>bel</b> homme, un <b>nouvel</b> appartement, un <b>vieil</b> ami</em>.`,
        `Keeping <em>des</em> before a preposed adjective in writing: <em>Il y a <b>de</b> jolies fleurs</em>.`,
        `Missing the meaning change: <em>mon <b>ancien</b> professeur</em> is my former teacher, not an old one.`

    // ───────────────────────── 3. Comparison
    {
      id: "u3-comparison",
      title: "Comparatives and superlatives",
      summary: "plus/moins/aussi … que, autant, le plus, and meilleur, mieux, pire",
      minutes: 15,
      goals: [
        "Compare with plus, moins, aussi … que and autant (de) … que",
        "Form superlatives, repeating the article after the noun",
        "Choose between meilleur and mieux",
        "Use pire and plus mauvais"

      theory: [
        { h: "The rule", html: `<div class="tbl"><table><tr><th>compare…</th><th>more</th><th>less</th><th>as much</th></tr>
<tr><td>adjective, adverb</td><td><em><b>plus</b> grand <b>que</b></em></td><td><em><b>moins</b> vite <b>que</b></em></td><td><em><b>aussi</b> grand <b>que</b></em></td></tr>
<tr><td>verb</td><td><em>travaille <b>plus que</b></em></td><td><em>travaille <b>moins que</b></em></td><td><em>travaille <b>autant que</b></em></td></tr>
<tr><td>noun</td><td><em><b>plus de</b> livres <b>que</b></em></td><td><em><b>moins de</b> livres <b>que</b></em></td><td><em><b>autant de</b> livres <b>que</b></em></td></tr></table></div>
<p>The adjective still agrees: <em>Elle est plus grand<b>e</b> que lui.</em> After <em>que</em>, use a stressed pronoun: <em>que moi, que toi, que lui</em>.</p>` },
        { h: "The superlative", html: `<p>The superlatif (superlative) is the definite article plus the comparative: <em><b>le/la/les plus</b></em> or <em><b>le/la/les moins</b></em>. "In" is <em>de</em>: <em>le plus grand <b>de</b> la classe</em>.</p>
<ul><li>Adjective before the noun: <em>la <b>plus belle</b> ville</em>.</li>
<li>Adjective after the noun: the article is repeated: <em>la ville <b>la plus</b> intéressante</em>.</li>
<li>Adverb: always <em>le</em>, since adverbs have no gender: <em>C'est elle qui court <b>le plus</b> vite.</em></li></ul>` },
        { h: "How it works", html: `<p>French builds comparison from separate words (<em>plus, moins</em>) where English often uses an ending (<em>taller</em>). <em>Que</em> introduces the second term, like English <em>than/as</em>. <em>Aussi</em> modifies qualities (adjectives, adverbs); <em>autant</em> measures quantity (actions, things), which is why it needs <em>de</em> before a noun, like <em>beaucoup de</em>.</p>
<p>In the superlative the article does the work of English <em>-est</em>. When the adjective comes after the noun, it needs its own article to show it is the superlative: without it, <em>la ville plus belle</em> reads as a comparative, not "the most beautiful town".</p>
<p>A few very common words kept their Latin comparatives:</p>
<div class="tbl"><table><tr><th>base</th><th>comparative</th><th>superlative</th></tr>
<tr><td><em>bon</em> (adj.)</td><td><em><b>meilleur</b></em> (from Latin <em>melior</em>)</td><td><em>le meilleur</em></td></tr>
<tr><td><em>bien</em> (adv.)</td><td><em><b>mieux</b></em> (from <em>melius</em>)</td><td><em>le mieux</em></td></tr>
<tr><td><em>mauvais</em> (adj.)</td><td><em><b>pire</b></em> (from <em>peior</em>) or <em>plus mauvais</em></td><td><em>le pire, le plus mauvais</em></td></tr></table></div>
<p><em>Meilleur</em> is an adjective: it describes a noun and agrees (<em>meilleure, meilleurs</em>). <em>Mieux</em> is an adverb: it describes a verb and never changes. <em>Plus bon</em> is wrong. <em>Pire</em> already means "more bad", so <em>plus pire</em> is wrong too. Both <em>pire</em> and <em>plus mauvais</em> are correct; <em>pire</em> is usual for things that are harmful or already bad (<em>une erreur pire</em>), <em>plus mauvais</em> for quality or taste.</p>` }
      ],
      examples: [
        ["Paris est plus grand que Lyon.", "Paris is bigger than Lyon."],
        ["Je travaille autant que toi.", "I work as much as you."],
        ["C'est la ville la plus intéressante de France.", "It's the most interesting town in France."],
        ["Ce gâteau est meilleur que l'autre.", "This cake is better than the other one."],
        ["Elle chante mieux que moi.", "She sings better than me."],
        ["La situation est pire qu'hier.", "The situation is worse than yesterday."]
      ],
      pitfalls: [
        `Saying <em>plus bon</em>: the comparative of <em>bon</em> is <em><b>meilleur</b></em>.`,
        `Using <em>meilleur</em> with a verb: <em>Elle chante <b>mieux</b></em>, not <em>meilleur</em>.`,
        `Forgetting the second article when the adjective follows the noun: <em>la ville <b>la</b> plus belle</em>.`,
        `Using <em>aussi</em> with a noun or verb: <em>J'ai <b>autant de</b> livres que toi</em>, <em>Il travaille <b>autant</b> que moi</em>.`
      ],
      activities: [

        { t: "sort", q: "aussi or autant?", cats: ["aussi", "autant"], items: [["Il est ___ grand que moi.", 0], ["Elle travaille ___ que lui.", 1], ["J'ai ___ de livres que toi.", 1], ["Tu cours ___ vite que lui.", 0], ["Il mange ___ que son frère.", 1], ["C'est ___ facile que ça.", 0]], x: "<em>Aussi</em> goes with adjectives and adverbs; <em>autant</em> with verbs, and <em>autant de</em> with nouns." },
        { t: "fill", q: "Ce gâteau est ___ que l'autre.", h: "better", a: ["meilleur"], x: "It describes the noun <em>gâteau</em>, so use the adjective <em>meilleur</em>." },
        { t: "fill", q: "Elle danse ___ que moi.", h: "better", a: ["mieux"], x: "It describes the verb <em>danser</em>, so use the adverb <em>mieux</em>." },
        { t: "fill", q: "C'est la maison ___ plus chère de la rue.", h: "article", a: ["la"], x: "When the adjective follows the noun, repeat the article: <em>la maison la plus chère</em>." },
        { t: "spot", q: "Tap the word that's wrong.", w: ["Ce", "vin", "est", "plus bon", "que", "l'autre"], a: 3, fix: "meilleur", x: "<em>Plus bon</em> does not exist: use <em>meilleur</em>." },
        { t: "mc", q: "The film is worse than the book: Le film est ___ que le livre.", o: ["plus pire", "pire", "plus mal"], a: 1, x: "<em>Pire</em> already means worse, so it takes no <em>plus</em>. <em>Plus mauvais</em> would also be correct." },

    // ───────────────────────── 4. Adverbs
    {
      id: "u3-adverbs",
      title: "Adverbs",
      summary: "Building -ment adverbs, the common short ones, and where they go",
      minutes: 15,
      goals: [
        "Form adverbs in -ment from adjectives, including -amment/-emment",
        "Use common short adverbs like bien, souvent, déjà, trop",
        "Place adverbs correctly in simple and compound tenses",
        "Choose bien or bon, mal or mauvais"
      ],
      theory: [
        { h: "Forming adverbs in -ment", html: `<p>An adverbe (adverb) describes a verb, an adjective or another adverb. It never agrees. Most are built from an adjective:</p>
<div class="tbl"><table><tr><th>adjective</th><th>rule</th><th>adverb</th></tr>
<tr><td><em>lent, heureux</em></td><td>feminine + <em>-ment</em></td><td><em>lente<b>ment</b>, heureuse<b>ment</b></em></td></tr>
<tr><td><em>vrai, poli, absolu</em></td><td>ends in a vowel: masculine + <em>-ment</em></td><td><em>vrai<b>ment</b>, poli<b>ment</b>, absolu<b>ment</b></em></td></tr>
<tr><td><em>constant, élégant</em></td><td><em>-ant → -amment</em></td><td><em>consta<b>mment</b>, éléga<b>mment</b></em></td></tr>
<tr><td><em>évident, prudent</em></td><td><em>-ent → -emment</em></td><td><em>évide<b>mment</b>, prude<b>mment</b></em></td></tr></table></div>
<p>Exceptions: <em>gentil → <b>gentiment</b></em>, <em>précis → précis<b>é</b>ment</em>, <em>énorme → énorm<b>é</b>ment</em>, <em>profond → profond<b>é</b>ment</em>. <em>Lent → lentement</em> ends in <em>-ent</em> but keeps the regular feminine + <em>-ment</em> pattern.</p>
<p>Common short adverbs: <em>bien, mal, vite, souvent, toujours, déjà, encore, beaucoup, trop, assez, très</em>.</p>` },
        { h: "How it works", html: `<p>The ending <em>-ment</em> comes from Latin <em>mente</em>, "with a mind": <em>clara mente</em> meant "with a clear mind". <em>Mens</em> was a feminine noun, so the adjective in front of it was feminine. That is why French still builds adverbs on the feminine form: <em>lente + ment</em>.</p>
<p>The <em>-amment/-emment</em> spellings exist because adjectives in <em>-ant/-ent</em> come from Latin adjectives with one form for both genders, so Old French had no separate feminine to build on and added <em>-ment</em> straight to the masculine (<em>constant + ment</em>). The <em>n</em> then merged into the <em>m</em>. Both spellings are pronounced the same, like <em>-amant</em>.</p>
<p><b>Placement</b> follows the verb, not the subject. In a simple tense the adverb comes straight after the conjugated verb: <em>Je vais <b>souvent</b> au cinéma.</em> English puts many adverbs before the verb (<em>I often go</em>); French does not.</p>
<p>In a compound tense (auxiliaire, auxiliary + participe passé, past participle), short common adverbs go between the two: <em>J'ai <b>bien</b> dormi. Il a <b>déjà</b> mangé.</em> Longer <em>-ment</em> adverbs usually follow the participle: <em>Il a parlé lentement.</em></p>
<p>Adverbs of time and place, like <em>aujourd'hui, demain, hier, ici, là-bas</em>, go at the start or end of the sentence: <em>Demain, je travaille.</em> An adverb describing an adjective or adverb goes before it: <em>très grand, assez souvent</em>.</p>` },
        { h: "bien/bon, mal/mauvais", html: `<p><em>Bon</em> and <em>mauvais</em> are adjectives: they describe a noun and agree. <em>Bien</em> and <em>mal</em> are adverbs: they describe how something is done.</p>
<ul><li><em>un <b>bon</b> repas</em> (a good meal) / <em>Il cuisine <b>bien</b>.</em> (He cooks well.)</li>
<li><em>une <b>mauvaise</b> idée</em> (a bad idea) / <em>J'ai <b>mal</b> dormi.</em> (I slept badly.)</li></ul>
<p>After <em>être</em>, both are possible with different meanings: <em>C'est bon</em> usually means it tastes good or it's fine; <em>C'est bien</em> means it's good, right, or well done.</p>` }
      ],
      examples: [

        `Putting a short adverb after the participle: <em>J'ai <b>bien</b> dormi</em>, not <em>J'ai dormi bien</em>.`,
        `Building on the masculine: <em>heureu<b>se</b>ment</em>, and the exception <em>genti<b>ment</b></em> (not <em>gentillement</em>).`

        { t: "fill", q: "Elle conduit ___.", h: "prudent → adverb", a: ["prudemment"], x: "<em>-ent</em> becomes <em>-emment</em>: <em>prudemment</em>." },
        { t: "fill", q: "Expliquez ___ le problème, s'il vous plaît.", h: "précis → adverb", a: ["précisément"], x: "<em>Précis</em> takes <em>-ément</em>: <em>précisément</em>." },
        { t: "sort", q: "bien (adverb) or bon/bonne (adjective)?", cats: ["bien", "bon / bonne"], items: [["Il chante ___.", 0], ["un ___ restaurant", 1], ["Elle travaille ___.", 0], ["une ___ idée", 1], ["J'ai ___ dormi.", 0], ["Ce pain est ___.", 1]], x: "Describing a noun: <em>bon/bonne</em>. Describing an action: <em>bien</em>." },

    // ───────────────────────── 5. C'est vs il est
    {
      id: "u3-cest-ilest",
      title: "C'est or il est?",
      summary: "Choosing c'est or il/elle est by what follows: noun, adjective, profession",
      minutes: 14,
      goals: [
        "Use il/elle est with an adjective, profession or nationality",
        "Use c'est with a determiner + noun, a name or a stressed pronoun",
        "Use c'est + masculine adjective for general ideas",
        "Choose il est … de vs c'est … à before an infinitive"
      ],
      theory: [
        { h: "The rule", html: `<div class="tbl"><table><tr><th><em>il/elle est</em> (<em>ils/elles sont</em>) +</th><th><em>c'est</em> (<em>ce sont</em>) +</th></tr>
<tr><td>adjective: <em>Il est sympa.</em></td><td>determiner + noun: <em>C'est <b>un</b> ami.</em></td></tr>
<tr><td>profession, no article: <em>Elle est médecin.</em></td><td>article + profession: <em>C'est <b>une</b> médecin.</em></td></tr>
<tr><td>nationality, no article: <em>Il est anglais.</em></td><td>name: <em>C'est Paul. C'est Paris.</em></td></tr>
<tr><td></td><td>stressed pronoun: <em>C'est moi. C'est lui.</em></td></tr></table></div>
<p>So the choice depends on what comes after the verb: a bare adjective or profession takes <em>il/elle est</em>; anything with a determiner (<em>un, le, mon, ce</em>…) takes <em>c'est</em>. Adding an adjective to a profession turns it into a noun phrase: <em>C'est un bon médecin.</em></p>
<p>The plural is <em>ce sont</em>: <em>Ce sont mes parents.</em> In speech, <em>c'est</em> is often used for plurals too.</p>` },
        { h: "How it works", html: `<p><em>Il</em> and <em>elle</em> are personal pronouns: they stand for a specific noun already known, and they carry its gender and number. <em>Ce</em> is a neutral demonstrative: it points at something (a person, a thing, a situation) and presents it, like English <em>that is / this is</em>.</p>
<ul><li>To <b>identify</b> (who or what is it?), you present a noun: <em>c'est</em>.</li>
<li>To <b>describe</b> a known person or thing, you use its pronoun with an adjective: <em>il/elle est</em>. A profession without an article works like an adjective.</li></ul>
<p>Because <em>ce</em> has no gender, <em>c'est</em> + adjective is used for ideas in general, and the adjective stays masculine: <em>La musique, c'est important.</em> For one specific thing, use its pronoun: <em>Cette chanson ? Elle est belle.</em></p>` },
        { h: "Before an infinitive: de or à", html: `<ul><li><em><b>Il est</b> + adjective + <b>de</b> + infinitive</em>: <em>il</em> is an empty subject (sujet impersonnel); the real subject is the infinitive that follows. <em>Il est difficile <b>de</b> parler chinois.</em></li>
<li><em><b>C'est</b> + adjective + <b>à</b> + infinitive</em>: <em>ce</em> refers back to something already mentioned, and the infinitive has no object after it. <em>Le chinois ? C'est difficile <b>à</b> apprendre.</em></li></ul>
<p>The same <em>à</em> appears after a real noun subject: <em>Ce livre est facile à lire.</em></p>
<p>Register: in everyday speech, <em>c'est</em> very often replaces the impersonal <em>il est</em>: <em>C'est difficile <b>de</b> parler chinois.</em> This is normal spoken French; <em>il est … de</em> is more formal and more common in writing.</p>` }
      ],
      examples: [
        ["C'est mon frère. Il est ingénieur.", "That's my brother. He's an engineer."],
        ["C'est un bon médecin.", "He's a good doctor."],
        ["Le français, c'est difficile.", "French is difficult."],
        ["Il est important de dormir.", "It's important to sleep."],
        ["Cette question est facile à comprendre.", "This question is easy to understand."],
        ["Qui est là ? C'est moi.", "Who's there? It's me."]
      ],
      pitfalls: [
        `Adding an article after <em>il est</em>: <em>Il est <b>médecin</b></em> (or <em>C'est un médecin</em>), not <em>Il est un médecin</em>.`,
        `Using <em>il est</em> before a determiner + noun: <em><b>C'est</b> mon meilleur ami</em>, not <em>Il est mon meilleur ami</em>.`,
        `Using <em>elle est</em> for a general idea: <em>La musique, <b>c'est</b> important</em>.`,
        `Using <em>de</em> when the subject is a real thing: <em>Ce livre est difficile <b>à</b> lire</em>, not <em>de lire</em>.`
      ],

<p>The object pronouns <em>le</em> and <em>les</em> belong to the verb that follows, so they <b>never contract</b>: <em>J'ai commencé <b>à le</b> lire. Il a décidé <b>de les</b> vendre.</em></p>
<p><b>Places.</b> Cities take <em>à</em> / <em>de</em> with no article: <em>à Paris, de Londres</em>. Countries carry gender, mostly feminine if they end in -e:</p>

<p><em>Soi</em> refers back to an indefinite subject such as <em>on, chacun, tout le monde</em>: <em>Chacun pour soi.</em> When <em>on</em> means "we", its stressed form is <em>nous</em>: <em>Nous, on part.</em></p>`

<p>English can shout "<em>I</em> did it". French stress falls on the last syllable of a word group, so it cannot highlight <em>je</em>. Instead it adds a separate stressed word: <em><b>Moi</b>, je l'ai fait.</em></p>`

<p><em>Je <b>sais</b> nager. J'<b>apprends à</b> conduire. J'<b>ai décidé de</b> rester.</em> Some verbs accept both: <em>continuer à</em> and <em>continuer de</em> are both standard.</p>`

<p>English uses "to" or "-ing" (I want <em>to</em> go, I stopped smok<em>ing</em>). French uses the infinitive, including after a preposition: <em>arrêter <b>de fumer</b>, sans <b>parler</b></em>. The one exception is <em>en</em>, which takes the -ant form (<em>en parlant</em>).</p>
<p>Which preposition a verb takes must be learnt with the verb, but there are tendencies. <em>À</em> (Latin <em>ad</em>, "towards") often looks ahead to a goal: <em>apprendre à, réussir à, aider à</em>. <em>De</em> (Latin <em>de</em>, "from, about") often marks something stopped or the content of a decision: <em>arrêter de, oublier de, décider de</em>. Treat these as memory aids, not rules.</p>

          html: `<p>The <b>impératif</b> (imperative) has three forms. Take the present tense and remove the subject pronoun:</p>
<div class="tbl"><table>
<tr><th>Present</th><th>Imperative</th></tr>
<tr><td><em>tu finis / tu prends</em></td><td><em><b>Finis</b> ! <b>Prends</b> !</em></td></tr>
<tr><td><em>nous allons</em></td><td><em><b>Allons</b> !</em> (let's go)</td></tr>
<tr><td><em>vous écoutez</em></td><td><em><b>Écoutez</b> !</em></td></tr>
<tr><td><em>tu parles / tu vas</em></td><td><em><b>Parle</b> ! <b>Va</b> !</em> (no -s)</td></tr>
</table></div>
<p>-er verbs, <em>aller</em>, and verbs like <em>ouvrir</em> (<em>Ouvre !</em>) drop the -s in the <em>tu</em> form. Before <em>y</em> or <em>en</em> the -s comes back, pronounced z: <em><b>Vas-y</b> ! <b>Parles-en</b> ! <b>Manges-en</b> !</em></p>`
        },
        {
          h: "How it works",
          html: `<p>No subject is needed, because the person addressed is obvious and the ending shows who is meant.</p>
<p>The missing -s is old. The Latin imperative of -are verbs had no -s (<em>canta</em>, "sing!"), while the present had one (<em>cantas</em>). French -er verbs kept that difference: <em>Chante !</em> but <em>tu chantes</em>. Most other verbs had no -s in the Old French imperative either (<em>fai, di</em>); they later took the -s of the present by analogy (<em>Fais ! Dis ! Finis !</em>). The -s in <em>Vas-y</em> returns to avoid two vowels colliding.</p>
<p>Four verbs borrow their imperative from the subjunctive (subjonctif):</p>
<div class="tbl"><table>
<tr><th></th><th>tu</th><th>nous</th><th>vous</th></tr>
<tr><td><em>être</em></td><td><em>sois</em></td><td><em>soyons</em></td><td><em>soyez</em></td></tr>
<tr><td><em>avoir</em></td><td><em>aie</em></td><td><em>ayons</em></td><td><em>ayez</em></td></tr>
<tr><td><em>savoir</em></td><td><em>sache</em></td><td><em>sachons</em></td><td><em>sachez</em></td></tr>
<tr><td><em>vouloir</em></td><td>(<em>veuille</em>, rare)</td><td>(<em>veuillons</em>, rare)</td><td><em>veuillez</em></td></tr>

<tr><td><em>faire</em></td><td><em>fer-</em></td><td><em>courir / mourir</em></td><td><em>courr- / mourr-</em></td></tr>
<tr><td><em>pouvoir</em></td><td><em>pourr-</em></td><td><em>falloir</em></td><td><em>faudr-</em> (<em>il faudra</em>)</td></tr>
<tr><td><em>vouloir</em></td><td><em>voudr-</em></td><td><em>pleuvoir</em></td><td><em>pleuvr-</em> (<em>il pleuvra</em>)</td></tr>
<tr><td><em>devoir</em></td><td><em>devr-</em></td><td><em>recevoir</em></td><td><em>recevr-</em></td></tr>
<tr><td><em>savoir</em></td><td><em>saur-</em></td><td></td><td></td></tr>
</table></div>`
        },
        {
          h: "Using it",
          html: `<p><b>Futur simple or futur proche?</b> Both talk about the future. The <em>futur proche</em> (<em>je vais partir</em>) is everyday speech and links the event to now. The <em>futur simple</em> sounds more certain, more formal or more distant: forecasts, promises, plans in writing. <em>Un jour, j'irai au Japon.</em></p>
<p><b>Time clauses.</b> After <em>quand, lorsque, dès que, aussitôt que</em>, French uses the future when the event is in the future. English uses the present here. <em>Quand j'<b>aurai</b> le temps, je t'appellerai</em> = When I have time, I'll call you.</p>
<p><b>Si clauses.</b> After <em>si</em> meaning "if", never the future. Use the present, and put the future in the other clause: <em>S'il <b>pleut</b>, nous resterons à la maison.</em> (When <em>si</em> means "whether", the future is fine: <em>Je ne sais pas si elle viendra.</em>)</p>`
        }
      ],
      examples: [
        ["Demain, il fera beau dans le sud.", "Tomorrow it will be fine in the south."],
        ["Nous irons en Espagne l'année prochaine.", "We'll go to Spain next year."],
        ["Tu pourras venir samedi ?", "Will you be able to come on Saturday?"],
        ["Dès que j'arriverai, je t'enverrai un message.", "As soon as I arrive, I'll send you a message."],
        ["Si tu as faim, on mangera plus tôt.", "If you're hungry, we'll eat earlier."],
        ["Il faudra partir à huit heures.", "We'll have to leave at eight."]
      ],
      pitfalls: [
        `Using the future after <em>si</em> ('if'): <em>Si tu viendras, on ira au parc</em> ✗ → <em>Si tu <b>viens</b>, on ira au parc</em> ✓.`,
        `Using the present after <em>quand</em> for a future event, as in English: <em>Quand j'arrive à Paris, je t'appellerai</em> ✗ → <em>Quand j'<b>arriverai</b> à Paris, je t'appellerai</em> ✓.`,
        `Regularising irregular stems or keeping the <em>e</em> of -re verbs: <em>je pouverai, je prenderai</em> ✗ → <em>je <b>pourr</b>ai, je <b>prendr</b>ai</em> ✓.`
      ],
      activities: [
        { t: "match", q: "Match each verb to its future stem.", pairs: [["être", "ser-"], ["avoir", "aur-"], ["aller", "ir-"], ["faire", "fer-"], ["voir", "verr-"]], x: "Irregular stems still end in <em>r</em> and take the regular endings." },
        { t: "fill", q: "Nous ___ le train de huit heures.", h: "prendre, futur simple", a: ["prendrons"], x: "-re verbs drop the final <em>e</em>: <em>prendr- + ons</em>." },

        { t: "fill", q: "D'après la météo, il ___ demain.", h: "pleuvoir, futur simple", a: ["pleuvra"], x: "<em>Pleuvoir</em> has the stem <em>pleuvr-</em>: <em>il pleuvra</em>." },
        { t: "sort", q: "Regular or irregular future stem?", cats: ["regular (infinitive)", "irregular stem"], items: [["tu finiras", 0], ["elle viendra", 1], ["nous parlerons", 0], ["ils devront", 1], ["vous vendrez", 0], ["je saurai", 1]], x: "<em>Finir, parler, vendre</em> use the infinitive; <em>venir, devoir, savoir</em> have special stems." },
        { t: "spot", q: "Tap the word that's wrong.", w: ["Je", "pouverai", "venir", "samedi."], a: 1, fix: "pourrai", x: "<em>Pouvoir</em> has the irregular stem <em>pourr-</em>: <em>je pourrai</em>." },
        { t: "mc", q: "Quand tu ___ à Paris, tu m'appelleras.", o: ["arriveras", "arrives"], a: 0, x: "After <em>quand</em> with a future meaning, standard French uses the future: <em>quand tu arriveras</em>. (With an imperative in the main clause, speech often allows the present: <em>Quand tu arrives, appelle-moi.</em>)" },
        { t: "mc", q: "S'il ___ demain, nous resterons à la maison.", o: ["pleut", "pleuvra"], a: 0, x: "After <em>si</em> meaning 'if', use the present: <em>s'il pleut</em>." },
        { t: "spot", q: "Tap the word that's wrong.", w: ["Si", "tu", "viendras,", "on", "ira", "au", "parc."], a: 2, fix: "viens,", x: "Never the future after <em>si</em> ('if'): <em>si tu <b>viens</b></em>." },
        { t: "order", q: "I'll pay as soon as I receive the bill.", w: ["Je", "paierai", "dès", "que", "je", "recevrai", "la", "facture."], x: "<em>Dès que</em> + future for a future event; <em>paierai</em> (or <em>payerai</em>) for <em>payer</em>, <em>recevr-</em> for <em>recevoir</em>." }
      ],
      sources: [
        { t: "Formes du futur simple — Banque de dépannage linguistique (OQLF)", u: "https://vitrinelinguistique.oqlf.gouv.qc.ca/24655/la-grammaire/le-verbe/conjugaison/formes-du-futur-simple" },

COURSE.push({
  id: "u6",
  level: "A2",
  title: "Pronouns",
  intro: "Object pronouns, y, en and the basic relative pronouns let you stop repeating nouns and join ideas into longer sentences. They also follow strict word-order rules that differ sharply from English.",
  lessons: [
    // ------------------------------------------------------------------ 1
    {
      id: "u6-cod",
      title: "Direct object pronouns",
      summary: "me, te, le/la, nous, vous, les: what a COD is, where it goes, and participle agreement",
      minutes: 15,
      goals: [
        "Identify a COD with the qui ?/quoi ? test",
        "Place a direct object pronoun correctly in present, compound and verb + infinitive sentences",
        "Use the neutral le for a whole idea",
        "Make the past participle agree with a preceding direct object pronoun"
      ],
      theory: [
        { h: "What a COD is", html: `<p>The <em>complément d'objet direct</em> (COD, direct object) is the person or thing the verb acts on directly, with no preposition in between. Test: ask <em>qui ?</em> or <em>quoi ?</em> straight after the verb.</p>
<p><em>Je regarde <b>le film</b>.</em> Je regarde quoi ? <em>le film</em>: no preposition, so it is a COD.</p>
<div class="tbl"><table><tr><th>Person</th><th>Pronoun</th><th>Example</th></tr>
<tr><td>me</td><td><em>me / m'</em></td><td><em>Il <b>m'</b>appelle.</em></td></tr>
<tr><td>you (tu)</td><td><em>te / t'</em></td><td><em>Je <b>te</b> vois.</em></td></tr>
<tr><td>him / it (masc.)</td><td><em>le / l'</em></td><td><em>Je <b>le</b> connais.</em></td></tr>
<tr><td>her / it (fem.)</td><td><em>la / l'</em></td><td><em>Je <b>l'</b>aime.</em></td></tr>
<tr><td>us</td><td><em>nous</em></td><td><em>Elle <b>nous</b> aide.</em></td></tr>
<tr><td>you (vous)</td><td><em>vous</em></td><td><em>Je <b>vous</b> écoute.</em></td></tr>
<tr><td>them</td><td><em>les</em></td><td><em>Je <b>les</b> attends.</em></td></tr></table></div>` },
        { h: "How it works", html: `<p>French object pronouns are unstressed words that lean on the verb, so they sit right in front of it. <em>Le, la, les</em> come from the same Latin word as the articles <em>le, la, les</em> (<em>ille</em>, 'that'), which is why they look identical. They elide (<em>l'</em>, <em>m'</em>, <em>t'</em>) before a vowel or mute h for the same sound reason as the articles.</p>
<p>The pronoun goes before the verb it belongs to:</p>
<ul><li>simple tense: before the conjugated verb, <em>Je <b>la</b> vois.</em></li>
<li>compound tense: before the <em>auxiliaire</em> (auxiliary), <em>Je <b>l'</b>ai vue.</em></li>
<li>verb + infinitive: before the infinitive, because it is the object of the infinitive, <em>Je vais <b>le</b> voir</em>, <em>Je peux <b>t'</b>aider.</em></li></ul>
<p>In the negative, <em>ne ... pas</em> wraps the pronoun and its verb as one block: <em>Je <b>ne</b> la vois <b>pas</b></em>, <em>Je <b>ne</b> l'ai <b>pas</b> vue.</em> With an infinitive the negation goes round the first verb: <em>Je <b>ne</b> vais <b>pas</b> le voir.</em></p>
<p><b>Neutral <em>le</em></b>: <em>le</em> can stand for a whole idea or clause, like English 'it' or 'so'. <em>Il est parti ? Oui, je <b>le</b> sais.</em> <em>Je <b>le</b> pense.</em></p>` },
        { h: "Direct in French, not in English", html: `<p>Some verbs take a direct object in French where English adds a preposition. Never translate the preposition.</p>
<ul><li><em>écouter</em> = listen <b>to</b>: <em>J'écoute la radio. Je l'écoute.</em></li>
<li><em>regarder</em> = look <b>at</b>: <em>Je les regarde.</em></li>
<li><em>attendre</em> = wait <b>for</b>: <em>Je t'attends.</em></li>
<li><em>chercher</em> = look <b>for</b>: <em>Je la cherche.</em></li>
<li><em>payer</em> = pay <b>for</b>: <em>Je l'ai payé.</em> (the meal)</li>
<li><em>demander quelque chose</em> = ask <b>for</b> something: <em>Je demande l'addition. Je la demande.</em></li></ul>` },
        { h: "Agreement with avoir", html: `<p>With <em>avoir</em>, the <em>participe passé</em> (past participle) agrees with the COD if the COD comes <b>before</b> it. A COD pronoun always comes before, so the participle agrees with what the pronoun stands for.</p>
<ul><li><em>J'ai vu Marie.</em> → <em>Je l'ai vu<b>e</b>.</em></li>
<li><em>J'ai pris les clés.</em> → <em>Je les ai pris<b>es</b>.</em></li>
<li><em>J'ai acheté les livres.</em> → <em>Je les ai acheté<b>s</b>.</em></li></ul>
<p>The logic: when the participle is written, the reader already knows the object, so it is marked on the participle like an adjective. Usually the agreement is only visible in writing; with participles ending in a consonant (<em>prise, faite, écrite</em>) you also hear it, although speakers often drop it in casual speech. Neutral <em>le</em> never triggers agreement: <em>Elle est plus forte que je ne l'avais pensé.</em></p>` }
      ],
      examples: [
        ["Tu connais Julie ? Oui, je la connais bien.", "Do you know Julie? Yes, I know her well."],
        ["Je t'attends devant la gare.", "I'm waiting for you outside the station."],
        ["Les photos ? Je les ai mises sur la table.", "The photos? I put them on the table."],
        ["Nous allons vous aider demain.", "We're going to help you tomorrow."],
        ["Le film ? Je ne l'ai pas encore vu.", "The film? I haven't seen it yet."],
        ["Elle a raison, je le sais.", "She's right, I know."]
      ],
      pitfalls: [
        `Putting the pronoun after the verb as in English: <em>Je vois la</em> ✗ → <em>Je <b>la</b> vois</em> ✓.`,
        `Adding the English preposition: <em>J'attends pour le bus</em> ✗ → <em>J'attends le bus</em> / <em>Je l'attends</em> ✓.`,
        `Placing the pronoun before the wrong verb: <em>Je le vais voir</em> ✗ → <em>Je vais <b>le</b> voir</em> ✓.`,
        `Forgetting agreement: <em>Ta lettre, je l'ai lu</em> ✗ → <em>je l'ai lu<b>e</b></em> ✓.`
      ],
      activities: [
        { t: "match", q: "Match the direct object pronoun to its meaning.", pairs: [["me", "me"], ["te", "you (one friend)"], ["la", "her / it (fem.)"], ["nous", "us"], ["les", "them"]], x: `The COD pronouns: <em>me, te, le/la, nous, vous, les</em>. Only the 3rd person shows gender, and only in the singular.` },
        { t: "mc", q: "Tu regardes la télé ? Oui, je ___ regarde.", o: ["la", "le", "lui"], a: 0, x: `<em>la télé</em> is feminine and direct (<em>regarder</em> + quoi ?), so <em>la</em>.` },
        { t: "sort", q: "Does the verb take a direct object (COD) here? Sort each sentence.", cats: ["COD (no preposition)", "not a COD (à + noun)"], items: [["J'attends le bus.", 0], ["Je parle à Paul.", 1], ["Je cherche mes clés.", 0], ["Je téléphone à Marie.", 1], ["J'écoute la radio.", 0], ["Je réponds à mon frère.", 1]], x: `Ask <em>qui ?/quoi ?</em> after the verb. If a preposition comes between the verb and the noun, it is not a COD. <em>Attendre, chercher, écouter</em> are direct in French.` },
        { t: "mc", q: "Choose the correct French for: I'm looking for my keys.", o: ["Je cherche mes clés.", "Je cherche pour mes clés.", "Je cherche à mes clés."], a: 0, x: `<em>chercher</em> already means 'look for'. It takes a direct object, with no preposition.` },
        { t: "fill", q: "Les enfants ? Je ___ attends devant l'école.", h: "them", a: ["les"], x: `<em>attendre</em> is direct: <em>attendre les enfants</em> → <em>je <b>les</b> attends</em>.` },
        { t: "mc", q: "Choose the correct sentence: I can help you.", o: ["Je peux t'aider.", "Je te peux aider.", "Je peux aider te."], a: 0, x: `The pronoun goes before the infinitive whose object it is: <em>Je peux <b>t'</b>aider.</em>` },
        { t: "order", q: "I'm going to see her tomorrow.", w: ["Je", "vais", "la", "voir", "demain"], alt: [], x: `<em>la</em> is the object of <em>voir</em>, so it goes just before the infinitive: <em>Je vais <b>la</b> voir.</em>` },
        { t: "order", q: "I didn't see them.", w: ["Je", "ne", "les", "ai", "pas", "vus"], alt: [], x: `In a compound tense the pronoun goes before the auxiliary, and <em>ne ... pas</em> wraps pronoun + auxiliary: <em>Je ne les ai pas vus.</em>` },
        { t: "fill", q: "Il est parti ? Oui, je ___ sais.", h: "it = that fact", a: ["le"], x: `Neutral <em>le</em> stands for the whole idea 'that he has left': <em>Je <b>le</b> sais.</em>` },
        { t: "spot", q: "Tap the word that's wrong.", w: ["Ta", "lettre,", "je", "l'ai", "lu", "hier"], a: 4, fix: "lue", x: `<em>l'</em> = <em>ta lettre</em> (feminine) comes before the participle with <em>avoir</em>, so it agrees: <em>je l'ai lu<b>e</b></em>.` }
      ],
      sources: [
        { t: "Using le/la/l'/les = it/him/her/them (French Direct Object Pronouns) — Lawless French", u: "https://progress.lawlessfrench.com/my-languages/French/view/705" },
        { t: "Pronoms directs vs pronoms indirects — Lawless French", u: "https://www.lawlessfrench.com/grammar/direct-vs-indirect-objects/" },
        { t: "Accord du participe passé avec le complément direct l' — Banque de dépannage linguistique", u: "https://vitrinelinguistique.oqlf.gouv.qc.ca/21878/la-grammaire/le-verbe/accord-du-participe-passe/avec-lauxiliaire-avoir/accord-du-participe-passe-avec-le-complement-direct-l" }
      ]
    },
    // ------------------------------------------------------------------ 2
    {
      id: "u6-coi",
      title: "Indirect object pronouns",
      summary: "lui and leur for à + person, verbs that are indirect in French, and à + moi/lui",
      minutes: 15,
      goals: [
        "Replace à + person with me, te, lui, nous, vous, leur",
        "Recognise common verbs that take à in French but not in English",
        "Tell the pronoun leur from the possessive leur(s)",
        "Use à + stressed pronoun with penser à and similar verbs"
      ],
      theory: [
        { h: "What a COI is", html: `<p>The <em>complément d'objet indirect</em> (COI, indirect object) is linked to the verb by a preposition. The pronouns <em>lui</em> and <em>leur</em> replace <b><em>à</em> + a person</b>.</p>
<p><em>Je parle <b>à Paul</b>.</em> → <em>Je <b>lui</b> parle.</em> <em>J'écris <b>à mes parents</b>.</em> → <em>Je <b>leur</b> écris.</em></p>
<div class="tbl"><table><tr><th></th><th>COD</th><th>COI</th></tr>
<tr><td>me / you</td><td><em>me, te</em></td><td><em>me, te</em></td></tr>
<tr><td>3rd singular</td><td><em>le, la</em></td><td><em><b>lui</b></em></td></tr>
<tr><td>us / you</td><td><em>nous, vous</em></td><td><em>nous, vous</em></td></tr>
<tr><td>3rd plural</td><td><em>les</em></td><td><em><b>leur</b></em></td></tr></table></div>
<p>Only the 3rd person has separate forms, so that is where you must decide direct or indirect. <em>Lui</em> means 'to him' <b>or</b> 'to her'.</p>` },
        { h: "How it works", html: `<p><em>Lui</em> continues a Late Latin dative form, the case for 'to someone'. <em>Leur</em> comes from <em>illorum</em>, 'of them', which is why the same word is also the possessive 'their'. The pronoun <em>leur</em> is invariable: it never takes <em>-s</em>. The possessive agrees with its noun: <em>leur maison</em>, <em>leur<b>s</b> enfants</em>. Test: before a verb it is the pronoun, before a noun it is the possessive. <em>Je <b>leur</b> donne <b>leurs</b> livres.</em></p>
<p>Position is the same as for COD pronouns: before the conjugated verb, before the auxiliary, before the infinitive. <em>Je ne lui ai pas répondu. Je vais leur téléphoner.</em></p>
<p>No agreement: the participle with <em>avoir</em> agrees only with a preceding COD. A COI never triggers agreement: <em>Je lui ai parlé</em> (to Marie), never <em>parlée</em>.</p>` },
        { h: "Indirect in French, direct in English", html: `<p>These verbs take <em>à</em> + person, so the pronoun is <em>lui/leur</em> even though English has no 'to':</p>
<ul><li><em>téléphoner à</em> (phone): <em>Je lui téléphone.</em></li>
<li><em>répondre à</em> (answer): <em>Elle leur répond.</em></li>
<li><em>ressembler à</em> (look like): <em>Il lui ressemble.</em></li>
<li><em>plaire à</em> (please): <em>Ce film leur plaît</em> = they like this film.</li>
<li><em>obéir à</em> (obey): <em>Les enfants lui obéissent.</em></li>
<li><em>conseiller à</em> (advise): <em>Je lui conseille de partir.</em></li>
<li><em>demander à, dire à, donner à</em> + person, with the thing as COD: <em>Je <b>lui</b> donne <b>le livre</b>.</em></li></ul>` },
        { h: "Verbs that keep à + moi, lui...", html: `<p>A few verbs refuse <em>lui/leur</em> for people. They keep <em>à</em> + a stressed pronoun (<em>moi, toi, lui, elle, nous, vous, eux, elles</em>):</p>
<ul><li><em>penser à</em>: <em>Je pense <b>à elle</b>.</em></li>
<li><em>s'intéresser à</em>: <em>Il s'intéresse <b>à eux</b>.</em></li>
<li><em>faire attention à</em>: <em>Fais attention <b>à lui</b> !</em></li>
<li><em>tenir à</em> (be attached to): <em>Je tiens <b>à toi</b>.</em></li>
<li><em>être à</em> (belong to): <em>Ce sac est <b>à moi</b>.</em></li></ul>
<p>With these verbs, a thing is replaced by <em>y</em> (see Lesson: The pronoun y).</p>` }
      ],
      examples: [
        ["Tu as téléphoné à ta mère ? Oui, je lui ai téléphoné.", "Did you phone your mother? Yes, I phoned her."],
        ["Je leur écris une carte.", "I'm writing them a card."],
        ["Ce restaurant nous plaît beaucoup.", "We really like this restaurant."],
        ["Elle ressemble à son père. Elle lui ressemble.", "She looks like her father. She looks like him."],
        ["Je pense souvent à mes grands-parents. Je pense souvent à eux.", "I often think about my grandparents. I often think about them."],
        ["Ils ont vendu leurs vélos.", "They sold their bikes."]
      ],
      pitfalls: [
        `Using a COD pronoun with an indirect verb: <em>Je la téléphone</em> ✗ → <em>Je <b>lui</b> téléphone</em> ✓.`,
        `Adding <em>-s</em> to the pronoun: <em>Je leurs parle</em> ✗ → <em>Je <b>leur</b> parle</em> ✓.`,
        `Using <em>lui</em> with <em>penser à</em>: <em>Je lui pense</em> ✗ → <em>Je pense <b>à lui</b></em> ✓.`,
        `Agreeing the participle with a COI: <em>Je lui ai parlée</em> ✗ → <em>Je lui ai parl<b>é</b></em> ✓.`
      ],
      activities: [
        { t: "mc", q: "Tu téléphones à ta mère ? Oui, je ___ téléphone ce soir.", o: ["la", "lui", "leur"], a: 1, x: `<em>téléphoner <b>à</b> quelqu'un</em> is indirect, and <em>ta mère</em> is singular, so <em>lui</em>.` },

      theory: [
        { h: "Y for places", html: `<p><em>Y</em> means 'there'. It replaces a place introduced by <em>à, en, dans, chez, sur, sous</em>:</p>
<ul><li><em>Je vais <b>à Lyon</b>.</em> → <em>J'<b>y</b> vais.</em></li>
<li><em>Il est <b>dans sa chambre</b>.</em> → <em>Il <b>y</b> est.</em></li>
<li><em>On dîne <b>chez Marc</b> ?</em> → <em>On <b>y</b> dîne ?</em></li></ul>
<p>Position is the same as for object pronouns: <em>Je n'y vais pas. J'y suis allé. Je vais y aller.</em></p>

        { h: "How it works", html: `<p><em>Y</em> comes from a Latin adverb of place (<em>ibi</em>, 'there'). Grammars call it a <em>pronom adverbial</em> (adverbial pronoun) for that reason: it started as 'there' and spread to stand for any <em>à</em> + thing. The logic is that <em>à</em> marks a destination or target, and <em>y</em> is the short form of '<em>à</em> + that'.</p>
<p>It is used for things, places and ideas. For people, French prefers <em>lui/leur</em> or <em>à</em> + stressed pronoun:</p>
<div class="tbl"><table><tr><th>à + thing</th><th>à + person</th></tr>
<tr><td><em>Je réponds à la lettre. → J'<b>y</b> réponds.</em></td><td><em>Je réponds à Paul. → Je <b>lui</b> réponds.</em></td></tr>
<tr><td><em>Je pense à mon examen. → J'<b>y</b> pense.</em></td><td><em>Je pense à ma sœur. → Je pense <b>à elle</b>.</em></td></tr></table></div>
<p>Larousse notes that relaxed speech sometimes uses <em>y</em> for people (<em>j'y pense, à Marie</em>). In careful French, avoid it.</p>` },
        { h: "Y for à + thing or idea", html: `<p>After verbs built with <em>à</em>, <em>y</em> replaces <em>à</em> + a thing or idea:</p>
<ul><li><em>penser à</em>: <em>Tu penses à tes vacances ? Oui, j'y pense.</em></li>
<li><em>réfléchir à</em>: <em>J'y réfléchis.</em> (I'm thinking it over.)</li>
<li><em>s'intéresser à</em>: <em>Le sport ? Je m'y intéresse.</em></li>
<li><em>croire à</em>: <em>Cette histoire ? Je n'y crois pas.</em></li>
<li><em>répondre à</em> + thing: <em>Le message ? J'y ai répondu.</em></li></ul>` },
        { h: "Idioms and the aller exception", html: `<ul><li><em>il y a</em> = there is / there are</li>
<li><em>On y va !</em> = Let's go!</li>
<li><em>Ça y est !</em> = That's it! / Done!</li>
<li><em>J'y suis.</em> = I've got it / I'm with you (also literally 'I'm there').</li></ul>
<p>Before the <em>futur</em> and <em>conditionnel</em> of <em>aller</em> (<em>irai, iras, irait, irions...</em>), <em>y</em> is dropped to avoid the clash of two i sounds: <em>Tu vas à Rome ? Oui, <b>j'irai</b> en mai.</em> Not <em>j'y irai</em>. The present and other tenses keep it: <em>j'y vais, j'y suis allé, je vais y aller</em>.</p>` }

    {
      id: "u6-en",
      title: "The pronoun en",
      summary: "en for some/any, quantities, de + thing or place, idioms, and il y en a",

      goals: [
        "Replace du/de la/des + noun with en",

      ],
      theory: [
        { h: "En replaces de + something", html: `<p><em>En</em> stands for <em>de</em> + a noun. That includes the partitive and indefinite articles, which contain <em>de</em>:</p>
<ul><li><em>Tu veux <b>du</b> café ?</em> → <em>Oui, j'<b>en</b> veux.</em></li>
<li><em>Il a <b>des</b> enfants ?</em> → <em>Oui, il <b>en</b> a.</em></li>
<li><em>Tu as <b>de l'</b>argent ?</em> → <em>Non, je n'<b>en</b> ai pas.</em></li></ul>
<p>English often drops 'some' or 'any' here ('Yes, I want some' or just 'Yes, I do'). French must keep <em>en</em>.</p>` },
        { h: "How it works", html: `<p><em>En</em> comes from Latin <em>inde</em>, 'from there'. Its core meaning is 'of it, of them, from there'. Anything introduced by <em>de</em> can collapse into <em>en</em>, which is why one word covers 'some', 'of them' and 'from there'.</p>
<p><b>Quantities.</b> <em>En</em> replaces only the noun. The number or quantity word stays, because it is the new information:</p>
<div class="tbl"><table><tr><th>Full sentence</th><th>With en</th></tr>
<tr><td><em>J'ai trois frères.</em></td><td><em>J'en ai <b>trois</b>.</em></td></tr>
<tr><td><em>Elle a un vélo.</em></td><td><em>Elle en a <b>un</b>.</em></td></tr>
<tr><td><em>Il a beaucoup de livres.</em></td><td><em>Il en a <b>beaucoup</b>.</em></td></tr>
<tr><td><em>J'achète un kilo de pommes.</em></td><td><em>J'en achète <b>un kilo</b>.</em></td></tr></table></div>
<p>This works for people too, since <em>en</em> stands for the noun after a quantity: <em>J'en ai trois</em> (brothers).</p>
<p><b>Position</b> is the usual one, and <em>y</em> always comes before <em>en</em>: <em>Il <b>y en</b> a.</em> <em>Il n'y en a plus.</em></p>` },
        { h: "De + thing, de + place", html: `<p>After verbs and adjectives built with <em>de</em>, <em>en</em> replaces <em>de</em> + thing or idea:</p>
<ul><li><em>parler de</em>: <em>Le film ? On en parle.</em></li>
<li><em>avoir besoin de</em>: <em>Ton vélo ? J'en ai besoin.</em></li>
<li><em>avoir peur de</em>: <em>Les orages ? Elle en a peur.</em></li>
<li><em>être content de</em>: <em>Ton travail ? Tu en es content ?</em></li></ul>
<p>It also replaces <em>de</em> + a place you come from: <em>Tu viens de la gare ? Oui, j'en viens.</em></p>` },
        { h: "People, idioms and register", html: `<p>For a specific person after <em>de</em>, use <em>de</em> + stressed pronoun: <em>Je parle de Paul</em> → <em>Je parle <b>de lui</b>.</em> Everyday speech sometimes uses <em>en</em> here, but careful French does not.</p>
<p>Fixed expressions:</p>
<ul><li><em>s'en aller</em> = to leave, go away: <em>Je m'en vais.</em> (neutral)</li>
<li><em>en avoir marre</em> = to be fed up: <em>J'en ai marre !</em> (informal)</li>
<li><em>je m'en fiche</em> = I don't care (informal; ruder variants exist, so avoid them in polite company)</li></ul>` }

    {
      id: "u6-relative-basic",
      title: "Relative pronouns qui, que, où",
      summary: "qui, que, où and ce qui/ce que: choosing by role, and agreement after qui",
      minutes: 14,
      goals: [
        "Choose qui or que by checking whether the next clause has a subject",
        "Use où for both place and time (le jour où)",
        "Make the verb after qui agree with its antecedent (c'est moi qui suis)",
        "Use ce qui and ce que for 'what'"
      ],
      theory: [
        { h: "Joining two sentences", html: `<p>A <em>pronom relatif</em> (relative pronoun) links a clause to a noun just before it, the <em>antécédent</em> (antecedent). It saves repeating the noun:</p>
<p><em>J'ai un ami. <b>Cet ami</b> habite à Lyon.</em> → <em>J'ai un ami <b>qui</b> habite à Lyon.</em></p>
<div class="tbl"><table><tr><th>Pronoun</th><th>Role in its clause</th><th>Example</th></tr>
<tr><td><em>qui</em></td><td>subject</td><td><em>le train <b>qui</b> part</em></td></tr>
<tr><td><em>que / qu'</em></td><td>direct object</td><td><em>le train <b>que</b> je prends</em></td></tr>
<tr><td><em>où</em></td><td>place or time</td><td><em>la ville <b>où</b> j'habite</em>, <em>le jour <b>où</b> il est né</em></td></tr></table></div>` },
        { h: "How it works", html: `<p><em>Qui</em> and <em>que</em> are the subject and object forms of one pronoun, like English 'who' and 'whom' (Latin <em>qui</em> and <em>quem</em>). Both work for people and things. To choose, look at the clause after the gap:</p>
<ul><li>No subject there? The pronoun is the subject: <em>qui</em>. <em>la fille <b>qui</b> chante</em></li>
<li>Already a subject (<em>je, tu, Marie...</em>)? The pronoun is the object: <em>que</em>. <em>la fille <b>que</b> je connais</em></li></ul>
<p><em>Que</em> elides before a vowel (<em>qu'il, qu'elle</em>). <em>Qui</em> never elides: <em>l'ami <b>qui a</b> appelé</em>.</p>
<p>English can drop the object pronoun ('the film I saw'). French cannot: <em>le film <b>que</b> j'ai vu</em>.</p>
<p><em>Où</em> covers time as well as place, so 'the day when' is <em>le jour <b>où</b></em>, never <em>quand</em>. Likewise <em>le moment où</em>, <em>l'année où</em>.</p>` },
        { h: "Agreement after qui", html: `<p><em>Qui</em> has no person or number of its own. The verb after it agrees with the antecedent:</p>
<ul><li><em>les enfants qui jou<b>ent</b></em></li>
<li><em>C'est moi qui <b>suis</b> en retard.</em> (not <em>qui est</em>)</li>
<li><em>C'est nous qui <b>avons</b> gagné.</em> <em>C'est toi qui <b>as</b> raison.</em></li></ul>
<p>After <em>que</em> with <em>avoir</em>, the participle agrees with the antecedent, because <em>que</em> is a COD placed before it: <em>la robe que j'ai achet<b>ée</b></em> (see Lesson: Direct object pronouns).</p>` },
        { h: "Ce qui, ce que, and what comes next", html: `<p>When there is no noun to refer back to, add <em>ce</em> ('the thing'). This gives English 'what':</p>
<ul><li><em>ce qui</em> = what (subject): <em><b>Ce qui</b> me plaît, c'est la musique.</em></li>
<li><em>ce que</em> = what (object): <em>Je comprends <b>ce que</b> tu dis.</em></li></ul>
<p>The same subject/object test applies. Never use <em>quoi</em> or <em>que</em> alone for 'what' in this position.</p>
<p>At B1 you will meet <em>dont</em> (replacing <em>de</em> + noun) and <em>lequel</em>, <em>auquel</em>, <em>duquel</em> (after other prepositions).</p>` }

        { h: "The five slots", html: `<p>When a verb has two object pronouns, they always come in this order before the verb:</p>
<div class="tbl"><table><tr><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
<tr><td><em>me, te, se, nous, vous</em></td><td><em>le, la, les</em></td><td><em>lui, leur</em></td><td><em>y</em></td><td><em>en</em></td></tr></table></div>
<ul><li><em>Il <b>me le</b> donne.</em> (slots 1 + 2)</li>
<li><em>Je <b>le lui</b> donne.</em> (slots 2 + 3)</li>
<li><em>Je <b>les y</b> ai emmenés.</em> (slots 2 + 4)</li>
<li><em>Il <b>y en</b> a.</em> <em>Je <b>leur en</b> ai donné.</em> <em>Je <b>vous en</b> prie.</em> (<em>en</em> always last)</li></ul>
<p>Two pronouns is the practical limit. Three in a row is rare and sounds clumsy, so French keeps one of the objects as a noun instead.</p>` },
        { h: "How it works", html: `<p>The order is set by <b>form</b>, not by function. English learners often memorise 'direct before indirect', but that fails in slot 1: in <em>Il <b>me</b> le donne</em>, <em>me</em> is the <em>COI</em> (indirect object, 'to me') and it comes <b>before</b> the <em>COD</em> (direct object) <em>le</em>. In <em>Je le <b>lui</b> donne</em>, the COI comes <b>after</b>.</p>
<p>The reason is that slot-1 pronouns (<em>me, te, se, nous, vous</em>) have one form for both functions, so they behave as 'person' pronouns and lead the group. Only the 3rd person kept separate forms: <em>le/la/les</em> (direct) and <em>lui/leur</em> (indirect; <em>lui</em> continues a Latin dative, <em>leur</em> the genitive plural <em>illorum</em>, 'of them'). Within the 3rd person, the direct form comes first. <em>Y</em> and <em>en</em> are adverbial pronouns (from Latin adverbs of place) and always close the group, <em>en</em> last.</p>
<p><b>Banned pairs.</b> A slot-1 pronoun cannot combine with <em>lui/leur</em>, and two slot-1 pronouns cannot combine. Both would be 'person' pronouns competing for the same role. French keeps the direct object as a pronoun and turns the indirect one into <em>à</em> + stressed pronoun:</p>
<ul><li><em>Je me présente <b>à lui</b>.</em> (not <em>je me lui présente</em>)</li>
<li><em>Il t'a recommandé <b>à eux</b>.</em> (not <em>il te leur a recommandé</em>)</li>

<ul><li><em>Je <b>ne le lui</b> ai <b>pas</b> dit.</em></li>
<li><em>Je vais <b>te les</b> montrer.</em> <em>Je ne peux pas <b>vous en</b> parler.</em></li></ul>
<p>Agreement still follows the COD: <em>Ces photos, je te les ai envoy<b>ées</b>.</em> With <em>en</em> the participle normally stays invariable: <em>Des photos, je t'en ai envoyé.</em></p>` },

<li>Before <em>en</em> or <em>y</em>, <em>moi/toi</em> go back to elided <em>m'/t'</em>: <em>Donne-<b>m'en</b> !</em> <em>Va-<b>t'en</b> !</em> (from <em>s'en aller</em>) <em>Donnez-<b>nous-en</b> !</em></li></ul>
<p>After the verb the last pronoun is stressed, so it needs a stressed form (<em>moi</em>). Before <em>en</em> it is no longer last, so the light form returns. You will hear <em>donne-moi-le</em> and <em>donne-moi-z-en</em> in casual speech; the Banque de dépannage linguistique advises against both, especially in writing.</p>
<p><b>Negative imperative</b>: back to the normal five-slot order before the verb, no hyphens: <em>Ne <b>me le</b> donne pas.</em> <em>Ne <b>le lui</b> dis pas.</em> <em>Ne <b>t'en</b> va pas.</em></p>` }

    {
      id: "u7-dont-lequel",
      title: "Relative pronouns dont & lequel",
      summary: "dont for de + noun, lequel after prepositions, de qui/duquel, ce dont, ce à quoi",
      minutes: 18,

      theory: [
        { h: "Dont: the de relative", html: `<p><em>Dont</em> replaces <em>de</em> + the antecedent. It works for people and things:</p>
<ul><li>verb + <em>de</em>: <em>le livre <b>dont</b> j'ai besoin</em> (<em>avoir besoin de</em>), <em>la fille <b>dont</b> je t'ai parlé</em> (<em>parler de</em>)</li>
<li>adjective + <em>de</em>: <em>le travail <b>dont</b> il est fier</em> (<em>fier de</em>)</li>
<li>noun + <em>de</em> = 'whose': <em>l'homme <b>dont</b> la fille est médecin</em></li>
<li>'including': <em>dix invités, <b>dont</b> trois enfants</em></li></ul>
<p>Word order after <em>dont</em> is normal subject + verb + object, with a definite article: <em>l'homme dont je connais <b>la</b> fille</em>, never <em>dont la fille je connais</em> or <em>dont je connais <b>sa</b> fille</em>. The possessive and the pronoun <em>en</em> both hide a <em>de</em>, so adding them after <em>dont</em> says it twice: <em>le projet dont il est satisfait</em>, not <em>dont il en est satisfait</em>.</p>` },
        { h: "How it works", html: `<p>A relative pronoun does two jobs: it links the clause to the antecedent, and it fills a gap inside the clause. Its form shows <b>what role the gap plays</b> (see Lesson: Relative pronouns qui, que, où):</p>
<div class="tbl"><table><tr><th>Gap in the clause</th><th>Pronoun</th></tr>
<tr><td>subject</td><td><em>qui</em></td></tr>
<tr><td>direct object</td><td><em>que</em></td></tr>
<tr><td><em>de</em> + noun</td><td><em>dont</em></td></tr>
<tr><td>other preposition + noun</td><td>preposition + <em>qui</em> / <em>lequel</em></td></tr></table></div>
<p><em>Dont</em> comes from Latin <em>de unde</em>, 'from where'. It largely lost the place meaning and became the all-purpose 'of which / of whom'.</p>
<p><b>Where <em>dont</em> cannot reach.</b> <em>Dont</em> must depend directly on the verb, an adjective, or a noun that is subject or object. If the <em>de</em> belongs to a longer preposition (<em>à côté de, près de, en face de, au milieu de</em>) or to a noun that is itself after a preposition, the whole phrase moves to the front with <em>de qui</em> (people) or <em>duquel</em>:</p>
<ul><li><em>la personne <b>à côté de qui</b> j'étais assis</em></li>
<li><em>le parc <b>près duquel</b> nous habitons</em></li>
<li><em>l'ami <b>à la sœur de qui</b> j'ai écrit</em> ('the friend to whose sister I wrote')</li></ul>` },
        { h: "Lequel after a preposition", html: `<p><em>Lequel</em> agrees with the antecedent and fuses with <em>à</em> and <em>de</em> like the article:</p>
<div class="tbl"><table><tr><th></th><th>m. sg</th><th>f. sg</th><th>m. pl</th><th>f. pl</th></tr>
<tr><td>plain</td><td><em>lequel</em></td><td><em>laquelle</em></td><td><em>lesquels</em></td><td><em>lesquelles</em></td></tr>
<tr><td><em>à</em> +</td><td><em><b>auquel</b></em></td><td><em>à laquelle</em></td><td><em><b>auxquels</b></em></td><td><em><b>auxquelles</b></em></td></tr>
<tr><td><em>de</em> +</td><td><em><b>duquel</b></em></td><td><em>de laquelle</em></td><td><em><b>desquels</b></em></td><td><em><b>desquelles</b></em></td></tr></table></div>
<ul><li>Things: <em>lequel</em> is required. <em>la raison <b>pour laquelle</b></em>, <em>le projet <b>auquel</b> je travaille</em>.</li>
<li>People: <em>qui</em> is usual, <em>lequel</em> possible. <em>l'amie <b>avec qui</b> je pars</em>. After <em>parmi</em>, always <em>lesquels</em>: <em>des amis, <b>parmi lesquels</b> Paul</em>.</li>
<li>Place: <em>où</em> often replaces <em>dans lequel</em>: <em>la maison <b>où</b> / <b>dans laquelle</b> j'ai grandi</em>. Keep <em>dans lequel</em> for 'inside': <em>la boîte <b>dans laquelle</b> je range mes clés</em>.</li></ul>` },
        { h: "Ce dont, ce à quoi", html: `<p>With no noun antecedent ('what'), French adds <em>ce</em>, as with <em>ce qui / ce que</em>. After a preposition the pronoun is <em>quoi</em>:</p>
<ul><li><em><b>Ce dont</b> j'ai besoin, c'est de dormir.</em> (not <em>ce que j'ai besoin</em>)</li>
<li><em>C'est <b>ce à quoi</b> je pensais.</em> (<em>penser à</em>)</li>
<li><em>Voilà <b>ce sur quoi</b> tu peux compter.</em> (<em>compter sur</em>)</li></ul>
<p>The OQLF also rejects <em>C'est de cette voiture dont j'ai envie</em>: the <em>de</em> is already there, so the relative is <em>que</em>: <em>C'est de cette voiture <b>que</b> j'ai envie.</em> This structure is covered in Lesson: Emphasis: c'est … qui / que.</p>` }

        `Using <em>dont</em> inside a longer preposition: <em>la maison dont j'habite à côté</em> ✗ → <em>la maison <b>à côté de laquelle</b> j'habite</em> ✓.`,

      ],

<div class="tbl"><table><tr><th></th><th>singular</th><th>plural</th></tr>
<tr><td>masc.</td><td><em>celui</em></td><td><em>ceux</em></td></tr>
<tr><td>fem.</td><td><em>celle</em></td><td><em>celles</em></td></tr></table></div>
<p>They <b>never stand alone</b>. One of three things must follow:</p>
<ul><li><em>-ci / -là</em>: <em>Quelle robe ? <b>Celle-ci</b> ou <b>celle-là</b> ?</em></li>
<li>a relative clause: <em><b>celui qui</b> parle</em>, <em><b>celle que</b> j'ai achetée</em>, <em><b>ceux dont</b> je t'ai parlé</em>, <em><b>celle où</b> j'habite</em></li>
<li><em>de</em> + noun: <em>mon vélo et <b>celui de</b> Paul</em> (Paul's), <em>le train de 8 h ou <b>celui de</b> 9 h</em></li></ul>
<p>Without an antecedent, <em>celui qui / ceux qui</em> means 'the one who / those who': <em><b>Ceux qui</b> veulent venir peuvent m'appeler.</em></p>` },
        { h: "How it works", html: `<p>The forms are a demonstrative element fused with a stressed pronoun: <em>celui</em> goes back to Latin <em>ecce</em> ('here is') + the form that also gave <em>lui</em>, and <em>ceux</em> matches <em>eux</em> in the same way. That is why the endings echo <em>lui, elle, eux, elles</em> (see Lesson: Stressed pronouns).</p>
<p>The pronoun carries gender and number but no content. It says 'the one', and something else has to say <b>which</b> one. <em>-ci</em> (here) and <em>-là</em> (there) do it by pointing; a relative clause or <em>de</em> does it by description. English has the same need ('the one <b>that</b>...', 'John's') but can also say 'this one' with no extra word.</p>
<p>In everyday speech <em>-là</em> is used for both near and far; <em>-ci</em> appears mainly when contrasting two items. In writing, <em>celui-ci</em> means 'the latter' (nearest in the text) and <em>celui-là</em> 'the former': <em>Paul et Marc sont venus ; <b>celui-ci</b> était fatigué</em> (= Marc).</p>
<p><em>Celui</em> + participle (<em>celui envoyé hier</em>) was long criticised and is now accepted; Larousse still recommends a relative clause in careful writing: <em>celui qu'on m'a envoyé hier</em>.</p>` },

<ul><li><em>ce / c'</em>: only as subject of <em>être</em> (<em>c'est, c'était, ce sera, ce sont</em>, also <em>ce doit être, ce peut être</em>) and before a relative (<em>ce qui, ce que, ce dont</em>). See Lesson: C'est or il est?</li>
<li><em>cela</em> (= <em>ce</em> + <em>là</em>) and <em>ceci</em> (= <em>ce</em> + <em>ci</em>): with any other verb. <em>Cela me plaît.</em> Strictly, <em>ceci</em> points to what follows, <em>cela</em> to what came before: <em>Retenez <b>ceci</b> : ...</em></li>
<li><em>ça</em>: the spoken contraction of <em>cela</em>. <em>Ça me plaît. Ça va ?</em></li></ul>
<p><b>Register.</b> The Académie française notes that <em>ça</em> has largely displaced <em>cela</em> in speech. <em>Ça</em> is normal in conversation and informal writing; formal writing prefers <em>cela</em>. Before <em>est</em> use <em>c'</em>: <em>C'est vrai</em>, not <em>ça est vrai</em> (heard in Belgium). In speech <em>ça</em> often doubles the subject: <em><b>Ça</b>, c'est génial !</em></p>` }

<div class="tbl"><table><tr><th>owner</th><th>m. sg</th><th>f. sg</th><th>m. pl</th><th>f. pl</th></tr>
<tr><td>je</td><td><em>le mien</em></td><td><em>la mienne</em></td><td><em>les miens</em></td><td><em>les miennes</em></td></tr>
<tr><td>tu</td><td><em>le tien</em></td><td><em>la tienne</em></td><td><em>les tiens</em></td><td><em>les tiennes</em></td></tr>
<tr><td>il / elle</td><td><em>le sien</em></td><td><em>la sienne</em></td><td><em>les siens</em></td><td><em>les siennes</em></td></tr>
<tr><td>nous</td><td><em>le nôtre</em></td><td><em>la nôtre</em></td><td><em>les nôtres</em></td><td><em>les nôtres</em></td></tr>
<tr><td>vous</td><td><em>le vôtre</em></td><td><em>la vôtre</em></td><td><em>les vôtres</em></td><td><em>les vôtres</em></td></tr>
<tr><td>ils / elles</td><td><em>le leur</em></td><td><em>la leur</em></td><td><em>les leurs</em></td><td><em>les leurs</em></td></tr></table></div>
<p>The article contracts with <em>à</em> and <em>de</em> as usual: <em>Je pense à ton projet et <b>au mien</b>.</em> <em>Je me sers de ton vélo et <b>du sien</b>.</em> <em>Ils parlent <b>des vôtres</b>.</em></p>` },
        { h: "How it works", html: `<p>Each pronoun has two parts doing two jobs:</p>
<ul><li>the <b>stem</b> (<em>mien, tien, sien, nôtre...</em>) shows the <b>owner</b>;</li>
<li>the <b>article and ending</b> show the gender and number of the <b>thing owned</b>, exactly like <em>mon/ma/mes</em> (see Lesson: Possessive determiners).</li></ul>
<p>So <em>le sien</em> is 'his' or 'hers': <em>Paul a pris sa valise et Marie <b>la sienne</b></em> (<em>valise</em> is feminine, whoever owns it).</p>
<p><em>Mien, tien, sien</em> and <em>mon, ton, son</em> both go back to Latin <em>meum, tuum, suum</em>: the first set developed where the word carried stress, the second where it was unstressed before a noun. It is the same split as <em>moi</em> versus <em>me</em>: the pronoun stands on its own, so it needs the full, stressed form.</p>
<p>The same logic explains the circumflex. It stands for the lost <em>s</em> of Old French <em>nostre, vostre</em>, and it was kept only on the stressed pronoun, whose vowel stayed closed and longer [o]. The unstressed determiner <em>notre</em> has an open [ɔ] in standard pronunciation and no accent: <em><b>notre</b> maison</em> but <em>la <b>nôtre</b></em>. <em>Leur</em> never takes a circumflex; its plural pronoun is <em>les leurs</em>.</p>` },

<p>Use the possessive pronoun when you <b>pick out</b> one item against another, or anywhere a noun phrase could go:</p>
<ul><li><em>Ce n'est pas ton parapluie, c'est <b>le mien</b>.</em></li>
<li><em>Ta chambre est plus grande que <b>la mienne</b>.</em></li></ul>
<p><em>Ce sac est le mien</em> is also correct, but less usual in conversation; English 'it's mine' is usually <em>il est à moi</em> or <em>c'est le mien</em>. Never use <em>mien</em> without its article in everyday French.</p>
<p>Fixed uses: <em><b>les miens</b></em> = my family, my people; <em>Il est <b>des nôtres</b></em> = he's one of us / he's joining us; <em><b>À la vôtre</b> !</em> = Cheers!</p>` }

<p><b>Why <em>tous</em> has two pronunciations.</b> The determiner is unstressed and leans on its noun: <em>tous les jours</em> [tu]. The pronoun stands on its own, so its final s is pronounced: <em>ils sont tous là</em> [tus]. Sound can change meaning: <em>Ils sont <b>tous</b> contents</em> [tus] = all of them are happy; <em>Ils sont <b>tout</b> contents</em> [tu] = they are really happy. In the feminine both read <em>toutes contentes</em>, which is ambiguous in writing.</p>

          html: `<p>A <b>mode</b> (mood) is the way a verb presents an action. A <b>temps</b> (tense) places it in time. French grammars traditionally list four personal moods:</p>
<div class="tbl"><table>
<tr><th>Mode</th><th>What it presents</th><th>Example</th></tr>
<tr><td><em>indicatif</em></td><td>a fact, asserted as real</td><td><em>Il <b>vient</b>.</em></td></tr>
<tr><td><em>conditionnel</em></td><td>something imagined, possible or reported</td><td><em>Il <b>viendrait</b>.</em></td></tr>
<tr><td><em>subjonctif</em></td><td>something wanted, feared, judged, not asserted</td><td><em>Il faut qu'il <b>vienne</b>.</em></td></tr>
<tr><td><em>impératif</em></td><td>an order or request</td><td><em><b>Viens</b> !</em></td></tr>
</table></div>
<p>The infinitive, participles and gérondif are impersonal moods: they do not change for person.</p>
<p>Traditional grammars call the conditionnel a mood. Most modern grammarians, the OQLF and the French school terminology of 2020 class it as a <b>tense of the indicative</b>. Two reasons: its endings combine the future <em>-r-</em> with imparfait endings, and one of its main jobs is purely temporal (the future seen from the past). Both labels are in use; the forms and uses are the same either way.</p>`
