<div class="tbl"><table>
<tr><th></th><th><em>parler</em></th><th><em>être</em></th><th><em>pouvoir</em></th></tr>
<tr><td><em>je</em></td><td><em>parler<span class="end">ais</span></em></td><td><em>ser<span class="end">ais</span></em></td><td><em>pourr<span class="end">ais</span></em></td></tr>
<tr><td><em>tu</em></td><td><em>parler<span class="end">ais</span></em></td><td><em>ser<span class="end">ais</span></em></td><td><em>pourr<span class="end">ais</span></em></td></tr>
<tr><td><em>il/elle/on</em></td><td><em>parler<span class="end">ait</span></em></td><td><em>ser<span class="end">ait</span></em></td><td><em>pourr<span class="end">ait</span></em></td></tr>
<tr><td><em>nous</em></td><td><em>parler<span class="end">ions</span></em></td><td><em>ser<span class="end">ions</span></em></td><td><em>pourr<span class="end">ions</span></em></td></tr>
<tr><td><em>vous</em></td><td><em>parler<span class="end">iez</span></em></td><td><em>ser<span class="end">iez</span></em></td><td><em>pourr<span class="end">iez</span></em></td></tr>
<tr><td><em>ils/elles</em></td><td><em>parler<span class="end">aient</span></em></td><td><em>ser<span class="end">aient</span></em></td><td><em>pourr<span class="end">aient</span></em></td></tr>
</table></div>
<p>Every irregular future stem carries over: <em>aur-, ir-, fer-, saur-, voudr-, viendr-, devr-, verr-, faudr-</em>. If you know the future, you know the conditional.</p>
<p>The shape has a history. Late Latin built a future from infinitive + present of <em>habere</em> ("I have to sing") and a conditional from infinitive + imperfect of <em>habere</em> (<em>cantare habebam</em>, "I had to sing"). The two words fused: <em>cantare habebam</em> became <em>chanterais</em>. So the conditional is literally a <b>future placed in the past</b>: the <em>-r-</em> looks forward, the imparfait ending looks back. That is why it expresses the future in the past (<em>Il a dit qu'il <b>viendrait</b></em>), and by extension anything seen from a distance: imagined, unreal, softened or unconfirmed.</p>
<p>Watch the spelling: <em>je parler<b>ai</b></em> (future) and <em>je parler<b>ais</b></em> (conditional) sound alike for many speakers, though careful speech distinguishes [e] and [ɛ].</p>`

<li><b>Hypothesis</b>: the result of an imagined condition. <em>Avec plus de temps, je <b>lirais</b> plus.</em> With <em>si</em>, see Lesson: Si clauses.</li>
<li><b>Future in the past</b>: <em>Elle savait qu'il <b>réussirait</b>.</em> This is the purely temporal use. More in Lesson: Reported speech.</li>
<li><b>Unconfirmed information</b> (the journalistic conditional): <em>Le suspect <b>serait</b> en Espagne.</em> = is reportedly. The writer does not vouch for the fact.</li>
<li><b>Imagined play</b>: children set up a game with <em>On dirait que tu <b>serais</b> le roi.</em> (Let's pretend you're the king.) The imparfait is also common here.</li>
</ul>`

<div class="tbl"><table>
<tr><th>Condition: si +</th><th>Result</th><th>Meaning</th></tr>
<tr><td>présent</td><td>présent, futur or impératif</td><td>real, likely: <em>Si tu <b>viens</b>, on <b>ira</b> au cinéma.</em></td></tr>
<tr><td>imparfait</td><td>conditionnel présent</td><td>imagined now or later: <em>Si tu <b>venais</b>, on <b>irait</b> au cinéma.</em></td></tr>
<tr><td>plus-que-parfait</td><td>conditionnel passé</td><td>unreal past: <em>Si tu <b>étais venu</b>, on <b>serait allés</b> au cinéma.</em></td></tr>
</table></div>
<p>The plus-que-parfait is the imparfait of <em>avoir/être</em> + participle (<em>j'avais vu</em>); the conditionnel passé is the conditional of <em>avoir/être</em> + participle (<em>j'aurais vu</em>). Both get their own lessons: see Lesson: Plus-que-parfait and Lesson: Conditionnel passé.</p>
<p><b>Mixed pattern</b>: a past condition with a present result. <em>Si j'<b>avais pris</b> le train, je <b>serais</b> déjà là.</em> (If I had taken the train, I would be there by now.) The reverse also works: <em>Si j'<b>étais</b> prudent, je n'<b>aurais</b> pas <b>pris</b> ce risque.</em></p>`

        {
          h: "How it works",
          html: `<p>The condition is the starting point of the reasoning, so it must be stated as something given: a present or a past. The future and the conditional both project forward, so they belong to the <b>result</b>. Hence the rule: after <em>si</em> meaning "if", <b>never the future, never the conditional</b>. <em>Si j'aurais</em> ✗ → <em>Si j'avais</em> ✓.</p>
<p>Why the imparfait for something imagined? Past tenses create distance. Moving a present situation one step into the past makes it less real: <em>Si j'avais de l'argent</em> = I don't, but suppose I did. English does the same ("if I had"). The plus-que-parfait pushes a past event one step further back, into the unreal.</p>
<p>When <em>si</em> means <b>"whether"</b> (indirect question, after <em>savoir, se demander, dire</em>…), it is not a condition and any tense is fine: <em>Je ne sais pas s'il <b>viendra</b>. Je me demande si elle <b>accepterait</b>.</em> Test: can you say "whether" in English?</p>
<p><b>Elision</b>: <em>si</em> drops its <em>i</em> only before <em>il</em> and <em>ils</em>: <em><b>s'il</b>, <b>s'ils</b></em>, but <em>si elle, si on</em> (or <em>si l'on</em> in careful writing).</p>`

<li><em><b>sauf si</b></em> (unless) also: <em>On mange dehors, sauf s'il <b>fait</b> froid.</em></li>
<li><em><b>au cas où</b></em> (in case) takes the <b>conditional</b>: <em>Prends un parapluie au cas où il <b>pleuvrait</b>.</em> It is not <em>si</em>, so the ban does not apply.</li>
<li><em>si</em> + imparfait alone makes a <b>suggestion</b> or a <b>wish</b>: <em>Et si on <b>allait</b> au cinéma ?</em> (How about going…?) <em>Si seulement j'<b>avais</b> plus de temps !</em> (If only…)</li>
</ul>
<p>Polite English "if you would…" is not a conditional in French: <em>Si vous <b>voulez</b> bien me suivre.</em></p>`

<p><b>Why the <em>-er</em> forms look like the present.</b> The endings <em>-e, -es, -e, -ent</em> are the same as the present endings of <em>-er</em> verbs. So <em>que je parle, que tu parles, qu'il parle, qu'ils parlent</em> are identical to the present. Only <em>nous</em> and <em>vous</em> differ, by the <em>-i-</em>: <em>que nous parl<b>i</b>ons</em>.</p>

<tr><td><em>Je veux <b>partir</b>.</em></td><td><em>Je veux que <b>tu partes</b>.</em></td></tr>

</table></div>
<p>So <em>Je veux que je parte</em> is wrong, not just clumsy. English works similarly ("I want to leave" / "I want you to leave"), but English uses an infinitive in both cases; French needs a full clause as soon as the subjects differ.</p>
<p>The same logic applies to <em>penser</em> and <em>croire</em>, which take the indicative: with one subject the infinitive is possible and more elegant. <em>Je crois <b>avoir</b> compris</em> = <em>Je crois que j'ai compris</em>. <em>Je pense <b>partir</b> en juin</em> means "I'm planning to leave in June".</p>`

<div class="tbl"><table>
<tr><th></th><th><em>finir</em></th><th><em>partir</em></th></tr>
<tr><td><em>je / j'</em></td><td><em><b>avais</b> fini</em></td><td><em><b>étais</b> parti(e)</em></td></tr>

<tr><td><em>nous</em></td><td><em>avions fini</em></td><td><em>étions parti(e)s</em></td></tr>
<tr><td><em>vous</em></td><td><em>aviez fini</em></td><td><em>étiez parti(e)(s)</em></td></tr>
<tr><td><em>ils/elles</em></td><td><em>avaient fini</em></td><td><em>étaient parti(e)s</em></td></tr>
</table></div>
<p>Everything else is copied from the passé composé: the same verbs take <em>être</em> (movement and change-of-state verbs, all pronominal verbs), the participle agrees with the subject after <em>être</em> (<em>elles étaient arrivé<b>es</b></em>), and after <em>avoir</em> it agrees only with a COD placed before it (<em>les clés que j'avais perdu<b>es</b></em>). Negation wraps the auxiliary: <em>je <b>n'</b>avais <b>pas</b> compris</em>. See Lesson: Passé composé with être.</p>`

          h: "How it works",
          html: `<p>French pairs every simple tense with a compound tense. The compound form takes the time of its auxiliary and adds the idea of <b>completion</b> (<em>l'accompli</em>):</p>
<ul>
<li>auxiliary in the present → <em>j'ai fini</em> (done, as of now)</li>
<li>auxiliary in the imparfait → <em>j'avais fini</em> (done, as of a past moment)</li>
</ul>
<p>So the plus-que-parfait is a past seen from another past. Picture a time line: <b>[earlier event] → [past reference point] → now</b>. The reference point is set by a passé composé, an imparfait or a time phrase; the plus-que-parfait sits behind it. <em>Quand je suis arrivé, le film <b>avait commencé</b>.</em> The film started first. With <em>quand je suis arrivé, le film <b>a commencé</b></em>, it started as I arrived.</p>
<p>The name comes from Latin grammar, <em>plus quam perfectum</em>, "more than perfect": further back than the perfect (the passé composé).</p>
<p>English often lets the simple past do this job ("I found the keys I lost"). French usually marks the earlier event: <em>J'ai retrouvé les clés que j'<b>avais perdues</b>.</em> In a story, it creates flashbacks and explains causes: <em>Il était fatigué : il n'<b>avait</b> pas <b>dormi</b>.</em></p>
<p><em>Déjà</em>, <em>jamais</em> and <em>pas encore</em> sit right after the auxiliary: <em>Elle <b>avait déjà</b> mangé. Je <b>n'avais jamais</b> vu la mer. Ils <b>n'étaient pas encore</b> rentrés.</em></p>`

<li><b>Regrets</b>: <em>si</em> + plus-que-parfait looks at a past that did not happen. Alone, it is a wish: <em>Si j'avais su !</em> (If only I'd known!). With a result, it pairs with the conditionnel passé: <em>Si j'avais su, je serais venu</em> (see Lesson: Conditionnel passé). Never put a conditional after <em>si</em>.</li>
<li><b>Polite softening</b>: in speech, the plus-que-parfait can distance a request made now: <em>J'<b>étais venu</b> vous demander un conseil.</em> (I came to ask you for some advice.) The past form makes the request sound less direct, like the polite imparfait <em>Je voulais vous demander…</em></li>

<li><b>Simple sequences</b>: events told in order need no plus-que-parfait. <em>Je suis rentré, j'ai mangé, je me suis couché.</em> Use it only when you step back in time.</li>
</ul>`

<p>The key difference from English is <b>time clauses</b>. After <em>quand, lorsque, dès que, aussitôt que, une fois que</em> and <em>après que</em>, French uses the tense that matches real time. If the clause refers to the future, it takes a future tense:</p>

<p>The link word depends on what is reported:</p>
<div class="tbl"><table>
<tr><th>Direct</th><th>Indirect</th></tr>
<tr><td>statement: <em>« J'ai faim. »</em></td><td><em>Il dit <b>qu'</b>il a faim.</em></td></tr>
<tr><td>yes/no question: <em>« Tu viens ? » / « Est-ce que tu viens ? »</em></td><td><em>Il demande <b>si</b> tu viens.</em></td></tr>
<tr><td><em>« Où / Quand / Pourquoi / Comment pars-tu ? »</em></td><td><em>Il demande <b>où / quand / pourquoi / comment</b> tu pars.</em></td></tr>
<tr><td><em>« Qu'est-ce que tu veux ? » / « Que veux-tu ? »</em></td><td><em>Il demande <b>ce que</b> tu veux.</em></td></tr>
<tr><td><em>« Qu'est-ce qui se passe ? »</em></td><td><em>Il demande <b>ce qui</b> se passe.</em></td></tr>
<tr><td>order: <em>« Ferme la porte ! »</em></td><td><em>Il me dit <b>de</b> fermer la porte.</em></td></tr>
</table></div>
<p>Common reporting verbs: <em>dire que, expliquer que, répondre que, ajouter que, demander si / où…, vouloir savoir si, demander à qqn de, ordonner à qqn de, conseiller à qqn de</em>. A negative order puts both words before the infinitive: <em>Il me dit <b>de ne pas</b> crier.</em> <em>Si</em> elides only before <em>il(s)</em>: <em><b>s'il</b> vient</em>, but <em>si elle vient</em>.</p>`

        {
          h: "How it works",
          html: `<p>Once the words become a <b>subordonnée</b> (subordinate clause), they are no longer a question or an order in their own right. They are the object of the reporting verb. That explains every change:</p>
<ul>
<li><b>Question markers disappear.</b> Inversion, <em>est-ce que</em> and the question mark belong to real questions, so the clause takes normal statement order: <em>Il demande où <b>tu habites</b></em>, never <em>où habites-tu</em>. With a noun subject, the verb may still come first (stylistic inversion, common in careful French): <em>Je me demande où habite ton frère.</em></li>
<li><b><em>Ce que / ce qui</em></b>: <em>qu'est-ce que</em> is itself a question form, so it is replaced by the pronoun <em>ce</em> ("the thing") + the relative <em>que</em> (object) or <em>qui</em> (subject). <em>Qu'est-ce que</em> in an indirect question is heard in speech but is criticised as non-standard.</li>
<li><b>Orders</b> lose the imperative, which only exists for direct address; the infinitive with <em>de</em> takes over.</li>
<li><b>Que is compulsory.</b> English can drop "that" (he said he was tired); French cannot.</li>
</ul>

          h: "The shifts",
          html: `<p>The <b>concordance des temps</b> (sequence of tenses) is the rule that the tense of a subordinate clause depends on the tense of the main verb. It matters most in reported speech. After a present reporting verb (<em>il dit</em>), nothing changes. After a past one (<em>il a dit, il disait, il avait dit</em>), the original tenses move one step back:</p>
<div class="tbl"><table>
<tr><th>Words spoken</th><th>Reported: <em>Il a dit que…</em></th></tr>
<tr><td>présent: <em>« Je <b>suis</b> prêt. »</em></td><td>imparfait: <em>il <b>était</b> prêt</em></td></tr>

<tr><td>futur proche: <em>« Je <b>vais partir</b>. »</em></td><td><em>il <b>allait</b> partir</em></td></tr>

<ul>
<li>what was simultaneous with "now" (présent) becomes simultaneous with a past moment (imparfait);</li>
<li>what was before "now" (passé composé) becomes before a past moment (plus-que-parfait);</li>
<li>what was after "now" (futur) becomes after a past moment: the conditionnel, which is literally a future built on past endings (<em>viendr-<b>ait</b></em>);</li>
<li>the completed future (futur antérieur) becomes a completed future-in-the-past (conditionnel passé).</li>

<p>The imparfait, plus-que-parfait and conditionnel are already "past-anchored", so they cannot move further back and stay as they are: <em>« J'étais malade. »</em> → <em>Il a dit qu'il <b>était</b> malade.</em></p>

<p>If the fact is clearly over, shift: <em>Elle a dit qu'elle <b>était</b> malade</em> (last week).</p>

  lessons: [

    {

        { h: "The two base rules", html: `<p>You already know the basics from Lesson: Passé composé with être and Lesson: Direct object pronouns. Here is the whole system in one place.</p>
<ul><li><b>With <em>être</em></b>: the <em>participe passé</em> (past participle) agrees with the <em>sujet</em> (subject). <em>Elles sont arriv<b>ées</b>.</em> This applies to every tense of <em>être</em> and to the passive.</li>
<li><b>With <em>avoir</em></b>: the participle agrees with the <em>COD</em> (complément d'objet direct, direct object) <b>only if the COD comes before the verb</b>. Otherwise it stays in the masculine singular.</li></ul>
<div class="tbl"><table><tr><th>Preceding COD</th><th>Example</th></tr>
<tr><td>object pronoun</td><td><em>Ces photos, je <b>les</b> ai pris<b>es</b>.</em></td></tr>
<tr><td>relative <em>que</em></td><td><em>la lettre <b>que</b> j'ai écrit<b>e</b></em></td></tr>
<tr><td><em>combien de</em> + noun</td><td><em><b>Combien de pommes</b> as-tu mang<b>ées</b> ?</em></td></tr>
<tr><td><em>quel</em> + noun</td><td><em><b>Quelle robe</b> as-tu choisi<b>e</b> ?</em></td></tr></table></div>
<p><b><em>En</em> blocks agreement.</b> <em>En</em> is partitive ('some of it/them') and has no fixed gender or number, so the modern standard rule leaves the participle invariable: <em>Des pommes ? J'<b>en</b> ai mang<b>é</b>.</em> Some writers, mostly literary, still agree (<em>des fleurs comme je n'en ai jamais vues</em>), but the OQLF gives the invariable form as the general rule. Write the invariable form.</p>` },
        { h: "How it works", html: `<p>The participle began life as a Latin adjective (<em>scriptam epistulam habeo</em>, 'I have a letter written'), so it agreed like any adjective. With <em>être</em> it is still essentially an adjective describing the subject, which is why it agrees: <em>elle est part<b>ie</b></em> works like <em>elle est content<b>e</b></em>.</p>
<p>With <em>avoir</em>, the participle gradually fused with the auxiliary into a single tense, and agreement weakened. In the 16th century the poet Clément Marot set out a word-order rule, which later grammarians made the norm: agree only when the object has <b>already been mentioned</b>. The traditional explanation is about information: when you reach <em>écrite</em> in <em>la lettre que j'ai écrite</em>, you already know what was written, so it is marked; in <em>j'ai écrit une lettre</em> you do not yet know.</p>
<p>This gives one universal test for tricky cases: <b>find the real COD and ask whether it comes before the participle</b>. Every special case below is just this test applied carefully. Most agreements are silent; you hear them only when the masculine ends in a silent consonant (<em>pris → prise, fait → faite, écrit → écrite, mis → mise</em>), and casual speech often drops even those.</p>` },
        { h: "Pronominal verbs", html: `<p>Pronominal verbs use <em>être</em>, but the participle behaves as if the auxiliary were <em>avoir</em>. Swap <em>être</em> for <em>avoir</em> and find the COD.</p>
<ul><li><b><em>se</em> is the COD</b> (laver quelqu'un) → agree with <em>se</em>, which means with the subject: <em>Elle s'est lav<b>ée</b>.</em> <em>Ils se sont regard<b>és</b>.</em></li>
<li><b>another COD comes after</b> → invariable, because <em>se</em> is now indirect ('for/to herself'): <em>Elle s'est lav<b>é</b> les mains.</em> If that COD moves before, agree with it: <em>les mains qu'elle s'est lav<b>ées</b></em>.</li>
<li><b><em>se</em> is a COI</b> (verb + <em>à</em>) and there is no COD → invariable: <em>se parler, se téléphoner, se sourire, se mentir, se nuire, se plaire, se succéder</em>. <em>Elles se sont <b>parlé</b>. Les rois qui se sont <b>succédé</b>.</em></li>
<li><em>se rendre compte</em>: <em>compte</em> is the COD and follows, so invariable: <em>Elle s'est <b>rendu</b> compte de son erreur.</em></li>
<li><b>Essentially pronominal verbs</b> (no non-pronominal form, or a different meaning) agree with the subject: <em>Elles se sont souven<b>ues</b>. Ils se sont enfu<b>is</b>. Elle s'est aperç<b>ue</b> de son erreur.</em> One classic exception: <em>s'arroger</em> agrees only with a preceding COD (<em>les droits qu'il s'est arrog<b>és</b></em>).</li></ul>
<p>More on these verbs in Lesson: Pronominal verbs: nuances.</p>` },
        { h: "Infinitives, impersonals and measure verbs", html: `<p><b>Participle + infinitive.</b> Agree with the preceding COD only if it is the one <b>doing</b> the infinitive's action.</p>
<ul><li><em>Ces chanteuses, je les ai entend<b>ues</b> chanter.</em> (the singers sing → agree)</li>
<li><em>Les chansons que j'ai entend<b>u</b> chanter.</em> (the songs are sung, not singing → invariable)</li>
<li><em>fait</em> + infinitive is <b>always invariable</b>: <em>la maison qu'ils ont <b>fait</b> construire</em>. Since the 1990 spelling rectifications, <em>laissé</em> + infinitive is invariable too (<em>Je les ai <b>laissé</b> partir</em>); the traditional agreement (<em>laissés</em>) is still accepted.</li></ul>
<p><b>Impersonal verbs</b> have no real COD, so they never agree: <em>les chaleurs qu'il a <b>fait</b></em>, <em>les efforts qu'il a <b>fallu</b></em>.</p>
<p><b>Measure verbs</b> (<em>coûter, valoir, peser, mesurer, courir, vivre</em>): in the literal sense the preceding word is a measurement, not a COD, so no agreement. In the figurative sense it is a true COD, so agree.</p>

    {
      id: "u10-passive",
      title: "The passive & its alternatives",
      summary: "être + participle, par vs de, which verbs allow it, and on / se / se faire instead",
      minutes: 18,
      goals: [
        "Form the passive in any tense and make the participle agree",
        "Choose between par and de for the agent",
        "Explain why only direct transitive verbs can be passive, and rephrase with on",
        "Use the pronominal passive, se faire + infinitive and se voir + infinitive"
      ],
      theory: [
        { h: "Forming the passive", html: `<p>In the <em>voix passive</em> (passive voice), the COD of the active sentence becomes the <em>sujet</em>, and the original subject becomes an optional <em>complément d'agent</em> (agent). The verb is <b><em>être</em> in the required tense + past participle</b>, and the participle agrees with the new subject.</p>
<div class="tbl"><table><tr><th>Tense of être</th><th>Passive</th></tr>
<tr><td>présent</td><td><em>La maison <b>est</b> vendu<b>e</b>.</em></td></tr>
<tr><td>passé composé</td><td><em>La maison <b>a été</b> vendu<b>e</b>.</em></td></tr>
<tr><td>imparfait</td><td><em>Les maisons <b>étaient</b> vendu<b>es</b>.</em></td></tr>
<tr><td>futur</td><td><em>Les maisons <b>seront</b> vendu<b>es</b>.</em></td></tr>
<tr><td>subjonctif</td><td><em>... qu'elle <b>soit</b> vendu<b>e</b></em></td></tr></table></div>
<p><b><em>par</em> or <em>de</em>?</b> <em>Par</em> introduces an agent who actively does something: <em>Le voleur a été arrêté <b>par</b> la police.</em> <em>De</em> is used with verbs of feeling, opinion and description, where the agent is more a state than an action: <em>aimé <b>de</b> tous, respecté <b>de</b> ses collègues, entouré <b>d'</b>arbres, couvert <b>de</b> neige, suivi <b>de</b>...</em> Some verbs allow both with a shift: <em>accompagné de</em> (with) / <em>accompagné par</em> (escorted by).</p>` },
        { h: "How it works", html: `<p>The passive is a way of choosing which participant becomes the grammatical subject. Only a COD can be promoted to subject, because only the COD is linked to the verb without a preposition. So <b>only direct transitive verbs can be passive</b>.</p>
<ul><li><em>répondre <b>à</b> quelqu'un</em>: no COD, so <em>Je suis répondu</em> is impossible. Say <em>On m'a répondu.</em></li>
<li><em>donner quelque chose <b>à</b> quelqu'un</em>: English 'I was given a book' promotes the indirect object, which French cannot do. Say <em>On m'a donné un livre.</em></li>
<li>Exceptions: <em>obéir à</em> and <em>pardonner à</em> were once direct transitive, and their old passive survives: <em>Il veut être obéi. Tu es tout pardonné.</em></li></ul>
<p>The participle is grammatically an adjective attributed to the subject, so it agrees exactly as after <em>être</em> + adjective. That is also why the passive can look like the passé composé of an <em>être</em> verb. Compare:</p>
<ul><li><em>Elle <b>est partie</b>.</em> <em>partir</em> is intransitive: this is the active passé composé ('she has left').</li>
<li><em>Elle <b>est invitée</b>.</em> <em>inviter</em> is transitive: this is the present passive ('she is invited'). Its passé composé is <em>Elle <b>a été</b> invitée</em>.</li></ul>
<p>Test: if you can add <em>par</em> + agent, and the verb takes a COD, it is passive.</p>` },
        { h: "The alternatives", html: `<p>French uses the passive less than English, especially in speech. Native speakers often prefer:</p>
<ul><li><b><em>on</em></b>, the default for an unknown or general agent: <em>On a volé ma voiture.</em> <em>Ici, on parle anglais.</em></li>
<li><b>The pronominal passive</b>, for habits, norms and general truths, never with an agent: <em>Ce vin <b>se boit</b> frais. Ça <b>se vend</b> bien. Ça ne <b>se fait</b> pas.</em></li>
<li><b><em>se faire</em> + infinitive</b>, when something happens to a person, often unpleasant: <em>Il <b>s'est fait voler</b> son vélo.</em> <em>Elle s'est fait renverser par une voiture.</em> (see Lesson: Causative faire & laisser)</li>
<li><b><em>se voir</em> + infinitive</b>, formal, for something received or imposed: <em>Il <b>s'est vu refuser</b> l'entrée.</em> <em>Elle se voit confier un projet.</em></li></ul>
<p><b>When the passive is preferred</b>: when the patient (the thing affected) is the topic, when the agent is unknown or unimportant, and in formal, legal, scientific and journalistic writing: <em>Trois suspects ont été interpellés.</em></p>` }
      ],

        { t: "spot", q: "Tap the word that's wrong.", w: ["Les", "fenêtres", "ont", "été", "nettoyé", "hier"], a: 4, fix: "nettoyées", x: `In the passive the participle agrees with the subject: <em>les fenêtres</em> is feminine plural, so <em>nettoy<b>ées</b></em>.` },
        { t: "sort", q: "Which preposition introduces the agent most naturally?", cats: ["par", "de"], items: [["Le voleur a été arrêté ___ la police.", 0], ["Ce restaurant est connu ___ tout le quartier.", 1], ["La lettre a été signée ___ le directeur.", 0], ["La table était couverte ___ papiers.", 1], ["Le match a été gagné ___ l'équipe locale.", 0], ["Ce chanteur est aimé ___ tous.", 1]], x: `<em>par</em> for an agent performing an action; <em>de</em> for feelings, knowledge and descriptions (<em>connu de, couvert de, aimé de</em>).` },
        { t: "mc", q: "Which sentence is NOT possible in French?", o: ["Paul a été aidé.", "Paul a été parlé.", "Paul a été invité."], a: 1, x: `<em>parler à quelqu'un</em> has no COD, so it cannot be passive. Say <em>On a parlé à Paul.</em>` },
        { t: "mc", q: "Translate: I was told the news.", o: ["On m'a annoncé la nouvelle.", "J'ai été annoncé la nouvelle.", "Je suis annoncé la nouvelle."], a: 0, x: `'I' is the indirect object (<em>annoncer quelque chose <b>à</b> quelqu'un</em>), and French cannot promote it to subject. Use <em>on</em>.` },
        { t: "order", q: "He had his bike stolen.", w: ["Il", "s'est", "fait", "voler", "son", "vélo"], alt: [], x: `<em>se faire</em> + infinitive presents something that happened to the subject: <em>Il s'est fait voler son vélo.</em> <em>fait</em> stays invariable.` },
        { t: "mc", q: "Most natural way to say: This wine is drunk chilled.", o: ["Ce vin se boit frais.", "Ce vin se fait boire frais.", "Ce vin boit frais."], a: 0, x: `For a general norm with no agent, French uses the pronominal passive: <em>Ce vin <b>se boit</b> frais.</em>` },
        { t: "sort", q: "Passive voice or active passé composé?", cats: ["passive", "active passé composé"], items: [["Elle est invitée par Paul.", 0], ["Elle est partie.", 1], ["Ils sont arrivés.", 1], ["La porte est ouverte par le gardien.", 0], ["Nous sommes descendus.", 1], ["Les élèves sont punis par le directeur.", 0]], x: `<em>partir, arriver, descendre</em> are intransitive verbs using <em>être</em> in the passé composé. <em>inviter, ouvrir, punir</em> are transitive: <em>être</em> + participle (with <em>par</em>) is a passive.` },

      ],

    {
      id: "u10-gerondif",
      title: "Gérondif & participe présent",
      summary: "-ant forms: participe présent, en + -ant, adjectif verbal, and English -ing traps",
      minutes: 18,
      goals: [
        "Form the participe présent, including ayant, étant, sachant",
        "Use the gérondif for simultaneity, manner, means and condition, respecting the same-subject rule",
        "Tell a participe présent from an adjectif verbal, including spelling pairs",
        "Translate English -ing correctly when French needs an infinitive"
      ],
      theory: [
        { h: "Forms", html: `<p><b>Participe présent</b> (present participle): take the <em>nous</em> form of the present, remove <em>-ons</em>, add <em>-ant</em>: <em>nous finiss<b>ons</b> → finiss<b>ant</b></em>, <em>nous fais<b>ons</b> → fais<b>ant</b></em>, <em>nous mange<b>ons</b> → mange<b>ant</b></em>. Three irregulars: <em><b>ayant</b></em> (avoir), <em><b>étant</b></em> (être), <em><b>sachant</b></em> (savoir).</p>
<p><b>Participe passé composé</b> (perfect participle): <em>ayant</em> / <em>étant</em> + past participle, for an action completed before the main one: <em><b>Ayant fini</b> son travail, il est sorti.</em> <em><b>Étant partie</b> tôt, elle a évité les bouchons.</em> With <em>étant</em> the participle agrees with the subject.</p>
<p><b>Gérondif</b>: <em>en</em> + participe présent: <em><b>en</b> marchant</em>, <em><b>en</b> sachant</em>.</p>
<div class="tbl"><table><tr><th>Form</th><th>Varies?</th><th>Role</th></tr>
<tr><td>participe présent <em>obéissant</em></td><td>no</td><td>verb: takes objects, negation</td></tr>
<tr><td>gérondif <em>en obéissant</em></td><td>no</td><td>adverb: how, when, by what means</td></tr>
<tr><td>adjectif verbal <em>obéissant(e)(s)</em></td><td>yes</td><td>adjective: a quality</td></tr></table></div>` },
        { h: "How it works", html: `<p>The three forms share one shape but do different grammatical jobs, and their behaviour follows from the job.</p>
<p><b>The participe présent is a verb.</b> It describes an action, so it can take a COD, a negation or an adverb, and it never agrees. It belongs to written and formal French, where it replaces a relative clause or a cause clause: <em>les candidats <b>ayant</b> réussi</em> = <em>qui ont réussi</em>; <em><b>Étant</b> malade, il est resté chez lui</em> = <em>Comme il était malade...</em></p>
<p><b>The gérondif is an adverb.</b> It comes from the old Latin gerund in the ablative ('by doing'), which explains its meanings: means, manner, time and condition. <em>en</em> marks it as a circumstance of the main verb.</p>
<ul><li>simultaneity: <em>Il chante <b>en se rasant</b>.</em></li>
<li>means or manner: <em>Elle a appris l'italien <b>en lisant</b>.</em></li>
<li>condition: <em><b>En partant</b> maintenant, tu arriveras à l'heure.</em></li>
<li><em><b>tout en</b></em> stresses simultaneity or adds concession ('while', 'even though'): <em><b>Tout en</b> reconnaissant ses qualités, je refuse.</em></li></ul>
<p><b>Same-subject rule</b>: the implied subject of a gérondif or participle is the subject of the main clause. <em>En entrant, le professeur nous a salués</em> means the <b>teacher</b> was entering. If someone else does it, use a full clause: <em>Quand nous sommes entrés, le professeur nous a salués.</em> Fixed sayings (<em>L'appétit vient en mangeant</em>) are tolerated, but formal writing applies the rule strictly.</p>
<p><b>The adjectif verbal is an adjective.</b> It describes a lasting quality and agrees: <em>des enfants obéissant<b>s</b></em>, <em>une histoire intéressant<b>e</b></em>. Test: if you can put <em>très</em> in front, it is an adjective.</p>` },
        { h: "Spelling pairs and -ing traps", html: `<p>Some adjectifs verbaux are spelt differently from the participle. The participle keeps the verb's stem (<em>fatigu-er, convainqu-ons</em>); the adjective does not need the <em>u</em> before <em>a</em>, and the <em>-ent</em> adjectives were taken directly from Latin <em>-entem</em> forms:</p>
<div class="tbl"><table><tr><th>Participe présent</th><th>Adjectif verbal</th></tr>
<tr><td><em>fatig<b>u</b>ant, navig<b>u</b>ant, intrig<b>u</b>ant</em></td><td><em>fatigant, navigant, intrigant</em></td></tr>
<tr><td><em>convain<b>qu</b>ant, provo<b>qu</b>ant</em></td><td><em>convain<b>c</b>ant, provo<b>c</b>ant</em></td></tr>
<tr><td><em>précéd<b>a</b>nt, néglige<b>a</b>nt, différ<b>a</b>nt, équival<b>a</b>nt</em></td><td><em>précéd<b>e</b>nt, néglig<b>e</b>nt, différ<b>e</b>nt, équival<b>e</b>nt</em></td></tr></table></div>
<p><em>Un travail <b>fatigant</b></em> but <em>en <b>fatiguant</b> ses lecteurs</em>.</p>
<p>English -ing is far wider than French -ant. Use an <b>infinitive</b> after a verb or a preposition (except <em>en</em>):</p>
<ul><li>I like reading → <em>J'aime <b>lire</b>.</em></li>
<li>before leaving → <em>avant de <b>partir</b></em>; without saying → <em>sans <b>dire</b></em></li>
<li>after eating → <em>après <b>avoir mangé</b></em> (past infinitive)</li>
<li>I am eating → <em>Je <b>mange</b></em> (or <em>je suis en train de manger</em>), never an -ant form.</li></ul>` }
      ],

        { t: "fill", q: "___ fini son travail, il est rentré chez lui.", h: "avoir, participe présent", a: ["Ayant"], x: `The perfect participle <em>ayant</em> + participle marks an action completed before the main one.` },

      theory: [
        { h: "faire + infinitive", html: `<p>The <em>construction causative</em> means 'make someone do' or 'have something done'. The person who does the action is the <b>doer</b>; the thing acted on is the <b>object</b>.</p>
<ul><li>object only: <em>Je fais <b>réparer</b> ma voiture.</em> (I'm having my car repaired.)</li>
<li>doer only: <em>Le clown fait <b>rire</b> les enfants.</em> (makes the children laugh)</li>
<li>both: the doer takes <em>à</em>: <em>Je fais réparer ma voiture <b>au</b> garagiste.</em></li></ul>
<p><b>Word order</b>: the noun always comes <b>after</b> the infinitive. <em>faire</em> and the infinitive are never separated by a noun: <em>Je fais ma voiture réparer</em> is impossible.</p>
<p><b>Pronouns</b> go before <em>faire</em>, not before the infinitive (unlike Lesson: Verb + infinitive): <em>Je <b>la</b> fais réparer. Le clown <b>les</b> fait rire. Je <b>lui</b> fais réparer la voiture. Je <b>la lui</b> fais réparer.</em> Two pronouns follow the usual order (see Lesson: Pronoun order with two pronouns).</p>
<p><b>Ambiguity</b>: <em>Je fais écrire une lettre à Paul</em> can mean Paul writes it or receives it. Use <em><b>par</b></em> to name the doer clearly: <em>Je fais écrire une lettre <b>par</b> Paul.</em></p>
<p><b>Imperative</b>: affirmative puts pronouns after <em>faire</em> with hyphens: <em><b>Fais-le</b> venir. <b>Faites-les</b> entrer.</em> Negative: <em>Ne le fais pas venir.</em></p>` },
        { h: "How it works", html: `<p>In the causative, <em>faire</em> and the infinitive fuse into <b>one complex verb</b> with a single set of objects. That explains every rule:</p>
<ul><li>Nothing nominal can split the complex, so the noun follows the infinitive.</li>
<li>Pronouns attach to the first verb of the complex, which is <em>faire</em>.</li>
<li>A single verb can have only one COD. If the infinitive already has its COD (<em>la voiture</em>), the doer is pushed down to the next slot, the COI with <em>à</em>: <em>la</em> + <em>lui</em>. If there is no other COD, the doer itself is the COD: <em>Je <b>la</b> fais chanter</em> but <em>Je <b>lui</b> fais chanter une chanson</em>.</li>
<li>The participle <em>fait</em> is part of the complex, not a verb with its own object, so it is <b>always invariable</b>: <em>Je les ai <b>fait</b> venir. La maison qu'ils ont <b>fait</b> construire.</em></li></ul>
<p><b><em>se faire</em> + infinitive</b>: the subject has something done to or for itself. <em>Elle s'est fait couper les cheveux</em> (had her hair cut), <em>Je me suis fait avoir</em> (I got conned), <em>se faire comprendre</em> (make oneself understood). <b><em>faire faire</em></b> is normal: <em>Il fait faire un costume.</em></p>` },

<li>Pronoun before <em>laisser</em>: <em>Je <b>les</b> laisse jouer.</em></li></ul>
<p>When the infinitive has its own object, two patterns exist: the doer as COD (<em>Je <b>la</b> laisse conduire ma voiture</em>) or, as with <em>faire</em>, as COI (<em>Je <b>lui</b> laisse conduire ma voiture</em>). With both pronouns: <em>Je <b>la lui</b> laisse conduire</em> or <em>Je <b>la</b> laisse <b>la</b> conduire</em>.</p>
<p>Agreement: since the 1990 rectifications, <em>laissé</em> + infinitive is invariable like <em>fait</em> (<em>Je les ai <b>laissé</b> partir</em>); the traditional agreement is still accepted. See Lesson: Past participle agreement in depth.</p>` }

    {
      id: "u10-pronominal",
      title: "Pronominal verbs: nuances",
      summary: "Four kinds of pronominal verb, meaning shifts, se with infinitives, l'un l'autre",
      minutes: 16,
      goals: [

      theory: [
        { h: "Four kinds", html: `<p>Lesson: Pronominal verbs introduced <em>se</em> + verb. At B2 you need to see that <em>se</em> does four different jobs.</p>
<div class="tbl"><table><tr><th>Kind</th><th>Meaning of se</th><th>Example</th></tr>
<tr><td><em>réfléchi</em> (reflexive)</td><td>oneself</td><td><em>Elle <b>se</b> regarde dans le miroir.</em></td></tr>
<tr><td><em>réciproque</em> (reciprocal)</td><td>each other (plural subject)</td><td><em>Ils <b>s'</b>écrivent chaque semaine.</em></td></tr>
<tr><td><em>essentiellement pronominal</em></td><td>no separate meaning; part of the verb</td><td><em>se souvenir, s'évanouir, s'enfuir, s'en aller</em></td></tr>
<tr><td><em>sens passif</em> (passive)</td><td>the subject undergoes the action</td><td><em>Ça <b>se</b> mange. Ce mot ne <b>se</b> dit plus.</em></td></tr></table></div>
<p>A large group of everyday verbs works like the essentially pronominal ones: the non-pronominal verb exists, but <em>se</em> changes the meaning.</p>
<div class="tbl"><table><tr><th>Non-pronominal</th><th>Pronominal</th></tr>
<tr><td><em>apercevoir</em> catch sight of</td><td><em>s'apercevoir de / que</em> notice, realise</td></tr>
<tr><td><em>attendre</em> wait for</td><td><em>s'attendre à</em> expect</td></tr>
<tr><td><em>douter de</em> doubt</td><td><em>se douter de / que</em> suspect</td></tr>
<tr><td><em>passer</em> pass, spend</td><td><em>se passer</em> happen; <em>se passer de</em> do without</td></tr>
<tr><td><em>rendre compte de</em> report on</td><td><em>se rendre compte de</em> realise</td></tr>
<tr><td><em>servir</em> serve</td><td><em>se servir de</em> use; <em>se servir</em> help oneself</td></tr>
<tr><td><em>tromper</em> deceive, cheat on</td><td><em>se tromper (de)</em> be wrong, get the wrong...</td></tr>
<tr><td><em>ennuyer</em> bore, bother</td><td><em>s'ennuyer</em> be bored</td></tr>
<tr><td><em>plaindre</em> feel sorry for</td><td><em>se plaindre de</em> complain about</td></tr></table></div>` },
        { h: "How it works", html: `<p>Latin marked actions that affect or involve the subject with its mediopassive endings (the <em>-r</em> forms of verbs like <em>laetor</em>, 'I rejoice'). Those endings disappeared, and the Romance languages recycled the reflexive pronoun to do the same work. So <em>se</em> marks a scale of 'involvement of the subject':</p>
<ul><li>fully analysable: <em>se</em> is a COD or COI (reflexive, reciprocal);</li>
<li>half-analysable: the subject is affected or involved in a mental process (<em>s'apercevoir, se douter, s'ennuyer</em>), so the meaning drifts away from the simple verb;</li>
<li>frozen: <em>se</em> no longer means anything on its own (<em>se souvenir, s'évanouir</em>);</li>
<li>passive: the subject is the thing acted upon and the agent disappears (<em>Ça se mange</em>), as covered in Lesson: The passive & its alternatives.</li></ul>
<p>Many meaning-shift verbs are followed by <em>de</em> or <em>à</em>, so pronoun replacement uses <em>en</em> and <em>y</em>: <em>Je m'<b>en</b> doutais. Je m'<b>y</b> attendais. Je m'<b>en</b> passe.</em></p>
<p><b>Ambiguity of plural <em>se</em></b>: <em>Ils se regardent</em> can be reflexive or reciprocal. Add <em><b>l'un l'autre</b></em> (<em>les uns les autres</em>, <em>l'une l'autre</em>) for 'each other', or <em>eux-mêmes</em> for 'themselves'. With a preposition, it goes inside: <em>Ils se méfient <b>l'un de l'autre</b>.</em> <em>Elles se moquent <b>les unes des autres</b>.</em> <em>mutuellement</em> and <em>entre eux</em> also work.</p>
<p><b>Agreement</b> follows the COD test; essentially pronominal verbs and the meaning-shift verbs above agree with the subject (<em>elle s'est aperç<b>ue</b>, ils se sont plain<b>ts</b></em>) except <em>se rendre compte</em>. See Lesson: Past participle agreement in depth.</p>` },
        { h: "se with infinitives and imperatives", html: `<p><b>Infinitive</b>: the pronoun changes with the subject and sits before the infinitive: <em>Je vais <b>me</b> coucher. Nous devons <b>nous</b> lever tôt. Tu veux <b>t'</b>asseoir ?</em> Only the citation form uses <em>se</em>.</p>
<p><b>Affirmative imperative</b>: the pronoun follows with a hyphen, and <em>te</em> becomes <em>toi</em>: <em>Lève-<b>toi</b> ! Asseyez-<b>vous</b>. Dépêchons-<b>nous</b>.</em> Before <em>en</em>, <em>toi</em> elides: <em>Va-<b>t'en</b> ! Souviens-<b>t'en</b>.</em></p>
<p><b>Negative imperative</b>: normal order, pronoun before the verb: <em>Ne <b>te</b> lève pas ! Ne vous inquiétez pas.</em> (see Lesson: The imperative)</p>` }
      ],
      examples: [

        ["On peut se passer de voiture en ville.", "You can do without a car in town."],

      title: "Cause & consequence",
      summary: "parce que, car, puisque, comme; grâce à vs à cause de; donc, si bien que, tellement … que",
      minutes: 20,
      goals: [
        "Choose between parce que, car, puisque and comme by position, information and register",

      theory: [
        {
          h: "Introducing a cause",
          html: `<p>A <b>conjonction de subordination</b> (subordinating conjunction) opens a <b>subordonnée</b> (subordinate clause) with its own conjugated verb. After almost all cause connectors that verb is in the <b>indicatif</b>, because the cause is presented as a real fact.</p>
<div class="tbl"><table>
<tr><th>Connector</th><th>Position</th><th>What it signals</th></tr>
<tr><td><em>parce que</em></td><td>usually after the main clause</td><td>the neutral, objective cause; new information; answers <em>Pourquoi ?</em></td></tr>
<tr><td><em>car</em></td><td>only after the clause it explains, usually after a comma</td><td>a justification of what was just said; mostly written</td></tr>
<tr><td><em>puisque</em></td><td>either</td><td>a cause the listener already knows or must accept ("since, as we both know")</td></tr>
<tr><td><em>comme</em></td><td>at the start of the sentence</td><td>sets the cause as the background before the main point</td></tr>
<tr><td><em>étant donné que, vu que</em></td><td>either, often first</td><td>an established fact taken as the basis; <em>vu que</em> is more conversational</td></tr>
<tr><td><em>du fait que</em></td><td>either</td><td>"owing to the fact that"; formal; always indicative</td></tr>
<tr><td><em>sous prétexte que</em></td><td>after the main clause</td><td>a cause the speaker thinks is false or an excuse</td></tr>
</table></div>
<p>With a noun or infinitive instead of a clause, use a <b>préposition</b>:</p>
<ul>
<li><em><b>grâce à</b></em> + noun: a cause with a good result. <em><b>à cause de</b></em> + noun: a cause with a bad (or neutral) result.</li>
<li><em><b>en raison de</b></em> + noun: neutral and formal, typical of announcements: <em>en raison des travaux</em>.</li>
<li><em><b>faute de</b></em> + noun (usually with no article) or infinitive: "for lack of": <em>faute de temps</em>.</li>
<li><em><b>à force de</b></em> + noun or infinitive: a cause that works by repetition: <em>à force de répéter</em>.</li>
</ul>`
        },
        {
          h: "How it works",
          html: `<p><b>Subordinating versus coordinating.</b> <em>parce que, puisque, comme</em> are subordinating: the cause clause is part of the main sentence. That is why <em>parce que</em> can answer a question (<em>Pourquoi ? — Parce que…</em>) and can be highlighted: <em>C'est <b>parce qu'</b>il pleut que je reste.</em> <em>car</em> is a <b>conjonction de coordination</b> (coordinating conjunction), like <em>mais</em> and <em>donc</em>: it links two independent statements and always follows the one it explains, so it can neither come first nor answer <em>Pourquoi ?</em>, nor be highlighted with <em>c'est … que</em>. It comes from Latin <em>quare</em> ("for which reason"): the second statement explains the speaker's reason for saying the first.</p>
<p><b>Known versus new.</b> <em>parce que</em> (originally "by that that") puts the cause forward as the information that matters. <em>puisque</em> (from <em>puis</em>, "then") began as a time word, "since the time that", exactly like English <em>since</em>, and still treats the cause as already accepted, so it often sounds pointed: <em>Puisque tu sais tout, réponds !</em> <em>comme</em> sets the scene first, so the new information is in the main clause that follows.</p>
<p><b>Mood.</b> Cause and consequence are presented as facts, so they take the indicative. The main structure that changes mood is <em><b>de sorte que</b></em> (also <em>de façon que, de manière que</em>): with the indicative it states a result that happened; with the <b>subjonctif</b> it states a goal not yet reached, which belongs to Lesson: Purpose &amp; condition.</p>
<ul>
<li><em>Il a parlé fort, de sorte que tout le monde l'<b>a</b> entendu.</em> (result: everyone heard)</li>
<li><em>Parle fort, de sorte que tout le monde t'<b>entende</b>.</em> (aim: so that everyone hears)</li>
</ul>
<p>The intensity structures follow the type of word they modify: <em><b>si / tellement</b></em> + adjective or adverb, <em><b>tant / tellement</b></em> + verb, <em><b>tant de / tellement de</b></em> + noun (with bare <em>de</em>, like other quantity words). The <em>que</em> clause then gives the result in the indicative.</p>`
        },

          html: `<ul>
<li><em><b>donc</b></em>: the logical conclusion; can sit after the verb: <em>Il est <b>donc</b> parti.</em></li>
<li><em><b>alors</b></em>: the same idea, more conversational.</li>
<li><em><b>c'est pourquoi, par conséquent, en conséquence</b></em>: formal, open a new sentence or clause.</li>
<li><em><b>si bien que</b></em> + indicative: a result that follows on: <em>Il a raté le bus, si bien qu'il est arrivé en retard.</em></li>
<li><em><b>d'où</b></em> + noun: "hence": <em>Il a raté le bus, <b>d'où</b> son retard.</em></li>
</ul>
<p>In speech, <em>vu que</em> and <em>alors</em> are very common; in essays, prefer <em>étant donné que, puisque, par conséquent, c'est pourquoi</em>. Putting <em>car</em> before the clause it explains is a frequent learner error.</p>`
        }

<div class="tbl"><table>
<tr><th>Form</th><th>Followed by</th><th>Example</th></tr>

</table></div>
<p><em>néanmoins</em> and <em>toutefois</em> are formal, <em>quand même</em> is everyday. <em>Bien que</em> can drop the verb before an adjective: <em>bien que fatigué</em>.</p>
<p><b>Malgré que.</b> <em>Malgré que</em> + subjunctive is common in everyday French but criticised by many grammarians; the OQLF accepts it in ordinary language and recommends <em>bien que</em> or <em>quoique</em> in formal style. Write <em>malgré</em> + noun or <em>bien que</em> + clause.</p>`

        {
          h: "How it works",
          html: `<p><b>Why bien que takes the subjunctive.</b> The <b>indicatif</b> asserts something as new information. A concession clause does not assert: it grants a fact the listener already accepts and sets it aside. The <b>subjonctif</b> marks that the clause is not the point being made. <em>Même si</em> works differently because it is built on <em>si</em>, the hypothesis word, and <em>si</em> takes the indicative in modern French (see Lesson: Si clauses). So <em>même si</em> follows the <em>si</em> pattern: present, passé composé, imparfait or plus-que-parfait, never a conditional.</p>
<p><b>Avoir beau.</b> <em>avoir</em> is conjugated, then a bare infinitive, with no preposition. The <em>avoir beau</em> clause normally comes first and the disappointing result second. The phrase originally meant having every opportunity to do something; used ironically, it came to mean doing it in vain.</p>
<p><b>Opposition with the indicative.</b> <em><b>alors que</b></em> and <em><b>tandis que</b></em> link two real facts, so they take the indicative. Both can mean "while" in time (<em>Il est arrivé alors que je partais</em>) or "whereas" in contrast (<em>Il aime le thé, alors que je préfère le café</em>). Context decides. <em><b>au lieu de</b></em> + infinitive or noun means "instead of".</p>
<p><b>par contre / en revanche.</b> <em>Par contre</em> was long criticised by purists, who preferred <em>en revanche</em>, but it is established in usage and the OQLF treats it as fully correct. <em>En revanche</em> normally introduces an advantage, so <em>par contre</em> suits a drawback: <em>L'hôtel est beau, <b>par contre</b> il est cher.</em></p>`

<li><em><b>si</b></em> + adjective + <em>que</em> + subjunctive = however: <em>Si riche qu'il soit, il n'est pas heureux.</em></li>

          html: `<div class="tbl"><table>
<tr><th>Same subject: + infinitive</th><th>Different subject: + subjonctif</th></tr>
<tr><td><em>pour, afin de</em> (in order to)</td><td><em>pour que, afin que</em> (so that)</td></tr>
<tr><td><em>de peur de, de crainte de</em> (for fear of)</td><td><em>de peur que, de crainte que</em> (+ optional <em>ne</em>)</td></tr>
<tr><td><em>de façon à, de manière à</em> (so as to)</td><td><em>de sorte que, de façon que, de manière que</em></td></tr>
</table></div>
<p><em>Je parle lentement <b>pour</b> être clair.</em> / <em>Je parle lentement <b>pour que</b> tu <b>comprennes</b>.</em> This is the same infinitive-or-subjunctive choice as in Lesson: Subjonctif or infinitive?. <em>afin de / afin que</em> are more formal than <em>pour</em>.</p>`
        },
        {
          h: "How it works",
          html: `<p><b>Why purpose takes the subjunctive.</b> A goal is by definition not yet real. The <b>subjonctif</b> presents an action as intended, feared or required rather than stated as fact. That is why <em>de sorte que</em> takes the indicative for a result that happened (see Lesson: Cause &amp; consequence) and the subjunctive for an aim: same words, different reality.</p>
<p><b>The ne explétif.</b> After <em>de peur que, de crainte que</em> and <em>à moins que</em>, formal French may add <em>ne</em> with no negative meaning: <em>De peur qu'il <b>ne</b> se perde, je l'accompagne.</em> It reflects the idea of something unwanted lurking in the clause. It is optional and mostly written; in speech it is usually left out. Do not translate it as "not" (more in Lesson: The ne explétif).</p>
<p><b>Mood follows reality.</b> Conditions split by how real the speaker treats them:</p>
<ul>
<li><em><b>à condition que, pourvu que, pour peu que, à moins que</b></em> + subjunctive: the condition is merely required or imagined. <em>pour peu que</em> means "if only a little", "as long as": <em>Pour peu qu'il fasse beau, on sortira.</em></li>
<li><em><b>au cas où</b></em> + <b>conditionnel</b>: a possible event you prepare for: <em>au cas où il pleuvrait</em>. The conditional, not the subjunctive, marks it as a possibility.</li>
<li><em><b>si</b></em> and <em><b>même si</b></em> + indicative, never the future or conditional after <em>si</em>: <em>Si tu viens, on ira ; si tu venais, on irait</em> (see Lesson: Si clauses).</li>
</ul>
<p>With the same subject, use an infinitive: <em><b>à condition de</b> partir tôt</em>, <em><b>à moins de</b> courir</em>. With a noun: <em><b>en cas de</b> pluie</em> ("in the event of rain").</p>`

<li><em><b>Pourvu que</b></em> alone, at the start of a sentence, expresses a hope: <em>Pourvu qu'il fasse beau !</em> ("Let's hope it's fine!").</li>
</ul>`
        }

<div class="tbl"><table>
<tr><th></th><th>finir (avoir)</th><th>partir (être)</th></tr>
<tr><td><em>que je / j'</em></td><td><em>que j'<b>aie</b> fini</em></td><td><em>que je <b>sois</b> parti(e)</em></td></tr>
<tr><td><em>que tu</em></td><td><em><b>aies</b> fini</em></td><td><em><b>sois</b> parti(e)</em></td></tr>
<tr><td><em>qu'il / elle</em></td><td><em><b>ait</b> fini</em></td><td><em><b>soit</b> parti(e)</em></td></tr>
<tr><td><em>que nous</em></td><td><em><b>ayons</b> fini</em></td><td><em><b>soyons</b> parti(e)s</em></td></tr>
<tr><td><em>que vous</em></td><td><em><b>ayez</b> fini</em></td><td><em><b>soyez</b> parti(e)(s)</em></td></tr>
<tr><td><em>qu'ils / elles</em></td><td><em><b>aient</b> fini</em></td><td><em><b>soient</b> parti(e)s</em></td></tr>
</table></div>
<p>Pronominal verbs use <em>être</em>: <em>que je me <b>sois</b> trompé(e)</em>. With <em>avoir</em>, the participle agrees with a COD placed before it: <em>les seules lettres qu'elle <b>ait</b> écrit<b>es</b></em>.</p>`

          h: "How it works",
          html: `<p>The subjunctive has only two tenses in everyday French, so they do not express time the way indicative tenses do. They express <b>aspect</b>: is the action seen as completed or not? The subjonctif présent shows an action happening at the same time as the main verb or later; the subjonctif passé shows an action already <b>accompli</b> (completed) at the reference point.</p>
<ul>
<li><em>Je suis content que tu <b>viennes</b>.</em> You are coming (now or soon).</li>
<li><em>Je suis content que tu <b>sois venu</b>.</em> You came; the visit is done.</li>
</ul>
<p>The reference point can be the main verb or a time in the future. Because the subjunctive has no future perfect, the subjonctif passé covers that job too: <em>Il faut que tu <b>aies fini</b> avant midi</em> means you must have finished by noon, the equivalent of <em>tu auras fini</em> (see Lesson: Futur antérieur).</p>
<p>The main verb's tense does not change this. <em>J'étais content que tu <b>sois venu</b></em> is normal modern French; literary French would use the pluperfect subjunctive (see Lesson: Imperfect &amp; pluperfect subjunctive).</p>
<p><b>After superlatives.</b> After <em>le meilleur, le seul, le premier, le dernier … que</em>, the relative clause usually takes the subjunctive, since it judges rather than states: <em>C'est le meilleur film que j'<b>aie</b> vu.</em> The indicative is possible when you stress a plain fact, but the subjunctive is the usual written choice.</p>
<p><b>After conjunctions.</b> <em>Bien qu'il <b>ait</b> plu, nous sommes sortis.</em> <em>Attends jusqu'à ce que j'<b>aie</b> terminé.</em> <em>Avant que</em> usually takes the present (<em>avant qu'il parte</em>); <em>après que</em> takes the indicative in standard French (<em>après qu'il <b>est</b> parti</em>), although the subjunctive is common in speech.</p>`

<ul>

<li><em>le meilleur film que j'<b>aie</b> vu</em> → <em>que nous ayons vu</em></li>
</ul>`

        {
          h: "The cleft: c'est … qui / que",
          html: `<p>The <b>mise en relief</b> (highlighting) puts one element between <em>c'est</em> and a relative pronoun:</p>
<ul>
<li><b>Sujet</b> (subject) → <em>c'est … <b>qui</b></em>: <em><b>C'est</b> Marie <b>qui</b> a appelé.</em></li>
<li>Anything else (COD, time, place, manner…) → <em>c'est … <b>que</b></em>: <em><b>C'est</b> demain <b>que</b> je pars.</em> <em><b>C'est</b> ce livre <b>que</b> je veux.</em></li>
<li>A complement with a preposition keeps its preposition after <em>c'est</em>, then plain <em>que</em>: <em>C'est <b>à</b> Paul <b>que</b> j'ai écrit.</em> <em>C'est <b>de</b> ce film <b>que</b> je parle.</em></li>
</ul>
<p>Pronouns use the stressed form (see Lesson: Stressed pronouns): <em>C'est <b>moi</b> qui…, c'est <b>lui</b> que…</em></p>
<p><b>c'est or ce sont?</b> Before a third-person plural (<em>eux, elles</em>, a plural noun), formal French uses <em>ce sont</em>: <em><b>Ce sont</b> mes parents qui ont payé.</em> In speech, <em>c'est</em> is normal. With <em>nous</em> and <em>vous</em> it is always <em>c'est</em>.</p>`
        },
        {
          h: "How it works",
          html: `<p>English can stress a word with the voice: "<b>I</b> paid". French does this far less, because its stress is fixed on the last syllable of each rhythmic group. So French moves the word into a position that is stressed by structure: right after <em>c'est</em>, or detached at the edge of the sentence.</p>
<p><b>Agreement after qui.</b> <em>qui</em> takes the person and number of what it replaces, so the verb agrees with the highlighted element, not with <em>c'est</em>: <em>C'est moi qui <b>ai</b> raison. C'est toi qui <b>as</b> gagné. C'est nous qui <b>avons</b> appelé. C'est vous qui <b>êtes</b> partis.</em> <em>C'est moi qui a</em> is frequent in speech but wrong in writing.</p>
<p><b>One marker only.</b> The preposition is already shown after <em>c'est</em>, so the relative is plain <em>que</em>. <em>C'est à lui à qui je parle</em> or <em>C'est de ça dont je parle</em> mark it twice and are criticised in careful French: say <em>C'est à lui que</em>, <em>C'est de ça que</em>.</p>
<p><b>Build-up: ce qui / ce que … c'est.</b> Begin with what you are about to reveal and put the answer last: <em><b>Ce que</b> j'aime, <b>c'est</b> la mer.</em> <em><b>Ce qui</b> m'énerve, <b>c'est</b> le bruit.</em> Choose <em>ce qui</em> or <em>ce que</em> by the role inside the clause: subject → <em>ce qui</em>, object → <em>ce que</em>, a verb with <em>de</em> → <em>ce dont</em> (<em>Ce dont j'ai besoin, c'est de repos</em>).</p>
<p><b>Dislocation (détachement).</b> Move a noun to the left or right edge and leave a <b>pronom de reprise</b> (resumptive pronoun) in its normal slot. The pronoun matches the original role: <em>le/la/les</em> for a COD, <em>lui/leur</em> for <em>à</em> + person, <em>en</em> for <em>de</em> or a quantity, <em>y</em> for <em>à</em> + place or thing.</p>
<ul>
<li>Left: <em>Ce film, je <b>l'</b>ai adoré.</em> <em>Ta sœur, je <b>lui</b> ai parlé.</em> <em>Du pain, j'<b>en</b> ai acheté.</em></li>
<li>Right: <em>Je <b>l'</b>ai adoré, ce film.</em> <em>Il est où, <b>ton frère</b> ?</em></li>
</ul>
<p>A COD pronoun before the auxiliary triggers agreement: <em>Ces clés, je <b>les</b> ai trouvé<b>es</b>.</em></p>`
        },

<p>A stressed pronoun can double the subject: <em><b>Moi</b>, je pense que…</em></p>
<p><b>Register.</b> Clefts with <em>c'est … qui/que</em> and <em>ce que … c'est</em> are neutral and work in essays. Dislocation, especially to the right, is very frequent in conversation and sounds informal in formal writing.</p>`
        }

<p>The <b>subjonctif plus-que-parfait</b> (pluperfect subjunctive) is <em>eusse</em> or <em>fusse</em> + participle: <em>qu'il <b>eût</b> parlé, qu'elle <b>fût</b> partie</em>.</p>`

<p>Classical French applied a strict <b>concordance des temps</b> (sequence of tenses): when the main verb is in a past tense or the conditional, the subjunctive shifts back too.</p>

<li><em>On <b>eût dit</b> un fantôme.</em> = One would have said it was a ghost.</li>
<li><em>Si j'<b>eusse su</b>, je <b>fusse</b> resté.</em> = <em>Si j'avais su, je serais resté.</em></li>
</ul>
<p>Fixed expressions keep the imperfect subjunctive alive, with the verb placed first:</p>

<li><em>n'eût été</em> (had it not been for): <em>n'eût été la pluie</em></li>
</ul>`

<div class="tbl"><table>
<tr><th>No circumflex: indicative</th><th>Circumflex: subjunctive form</th></tr>
<tr><td><em>il eut</em> (passé simple), <em>quand il eut fini</em> (passé antérieur)</td><td><em>qu'il eût</em>; <em>il eût fallu</em> (= aurait)</td></tr>
<tr><td><em>il fut</em> (he was)</td><td><em>bien qu'il fût</em>; <em>il fût venu</em> (= serait)</td></tr>
<tr><td><em>il fit</em> (he did)</td><td><em>qu'il fît</em></td></tr>
</table></div>

<div class="tbl"><table>
<tr><th>Context</th><th>Example</th></tr>
<tr><td>fear: <em>craindre, avoir peur, redouter, de peur que, de crainte que</em></td><td><em>de peur qu'on <b>ne</b> l'oublie</em></td></tr>
<tr><td>prevention: <em>empêcher que, éviter que</em></td><td><em>évitez qu'il <b>ne</b> se blesse</em></td></tr>
<tr><td><em>avant que, à moins que</em></td><td><em>à moins qu'il <b>ne</b> refuse</em></td></tr>
<tr><td>doubt or denial, negated or questioned: <em>je ne doute pas que, je ne nie pas que</em></td><td><em>je ne doute pas qu'elle <b>ne</b> réussisse</em></td></tr>
<tr><td>comparison of inequality: <em>plus, moins, mieux, autre, autrement … que</em></td><td><em>c'est plus loin que je <b>ne</b> pensais</em></td></tr>
</table></div>
<p>All but the last take the subjunctive; comparisons keep the indicative or conditional.</p>`

          h: "How it works",
          html: `<p>The <em>ne</em> echoes a negative idea already present in the logic of the main clause:</p>
<ul>
<li>to fear X is to wish that X does <b>not</b> happen;</li>
<li><em>avant que</em> X: at a time when X has <b>not</b> yet happened; <em>à moins que</em> X: if X does <b>not</b> happen;</li>
<li><em>plus grand que je ne pensais</em>: I did <b>not</b> think it was this big.</li>
</ul>
<p>The particle signals that negative shadow; it does not assert a negation. So to really negate the subordinate you need a full <em>ne … pas</em>: <em>J'ai peur qu'il ne vienne <b>pas</b></em> = I'm afraid he won't come.</p>
<p>When the main clause itself is negative, the shadow cancels out and the <em>ne</em> disappears: <em>Je <b>ne</b> crains <b>pas</b> qu'il vienne.</em> <em>Douter</em> works the other way round: <em>douter que</em> is already negative in meaning, so the <em>ne</em> appears only when <em>douter</em> is negated (<em>je ne doute pas qu'il ne vienne</em>), and this is the most literary use of all.</p>
<p><b>Sans que</b> already contains the negation. Grammarians and the OQLF treat <em>sans qu'il ne le sache</em> as an error, even though it is common, including in print. Write <em>sans qu'il le sache</em>. <em>Avant que ne</em> is accepted but optional; many style guides prefer plain <em>avant que</em>.</p>`

<ul>
<li>pronoun subject: <b>simple inversion</b>: <em>Peut-être <b>viendra-t-il</b>.</em></li>
<li>noun subject: <b>complex inversion</b>: the noun stays first and a pronoun follows the verb: <em>Peut-être <b>Marie viendra-t-elle</b>.</em></li>

<p>The alternatives avoid inversion: move the adverb (<em>Marie viendra peut-être</em>) or use <em>peut-être que</em> / <em>sans doute que</em> + normal order (<em>Peut-être que Marie viendra</em>), which is the usual spoken form. With <em>peut-être</em> the OQLF describes inversion as usual in writing but not always present in speech.</p>

      theory: [
        { h: "tout as an adverb", html: `<p>As a déterminant or pronom (see Lesson: Indefinites: tout, chaque, chacun, quelque), <em>tout</em> agrees normally. As an adverbe meaning <em>tout à fait, complètement</em>, it is in principle invariable, with one exception: it agrees in gender and number before a <b>feminine</b> adjective beginning with a <b>consonant or aspirated h</b>.</p>
<div class="tbl"><table><tr><th>before</th><th>form</th><th>example</th></tr>
<tr><td>masculine adjective</td><td>invariable</td><td><em>Ils sont <b>tout</b> contents.</em></td></tr>
<tr><td>feminine, vowel or mute h</td><td>invariable</td><td><em>Elle est <b>tout</b> étonnée, <b>tout</b> heureuse.</em></td></tr>
<tr><td>feminine, consonant or aspirated h</td><td>agrees</td><td><em>Elle est <b>toute</b> surprise. Elles sont <b>toutes</b> honteuses.</em></td></tr></table></div>
<p><em>Tout</em> before an adverb or preposition stays invariable: <em>tout près, des pulls tout en laine</em>. With <em>autre</em>: <em>une <b>tout</b> autre affaire</em> (an entirely different matter: adverb, invariable) versus <em><b>toute</b> autre solution</em> (any other solution: determiner, agrees). Note the ambiguity <em>Elles sont toutes contentes</em>: "all of them are happy" or "they are completely happy". Only context decides.</p>` },
        { h: "même, demi, mi-, semi-, nu", html: `<ul><li><em>même</em> is an <b>adjective</b> when it means "same" (before the noun: <em>les <b>mêmes</b> erreurs</em>) or "self/very" (after a noun or stressed pronoun: <em>les enfants <b>mêmes</b>, eux-<b>mêmes</b></em>). It is an <b>adverb</b>, invariable, when it means "even": <em><b>Même</b> les enfants ont compris.</em> After a plural noun the spelling alone carries the meaning: <em>les enfants mêmes</em> (the children themselves) / <em>les enfants même</em> (even the children). With a polite or majestic singular <em>vous</em> or <em>nous</em>: <em>vous-<b>même</b></em>, <em>nous-<b>même</b></em>.</li>
<li><em>demi</em> before the noun is invariable and hyphenated: <em>une <b>demi</b>-heure, des <b>demi</b>-finales</em>. After the noun, joined by <em>et</em>, it agrees in <b>gender only</b> and stays singular: <em>deux heures et <b>demie</b>, midi et <b>demi</b></em>. <em>À demi</em> is an invariable adverb: <em>à demi nus</em>. <em>Mi-</em> and <em>semi-</em> are always invariable: <em>la mi-août, des armes semi-automatiques</em>.</li>
<li><em>nu</em> before the noun is invariable and hyphenated (<em><b>nu</b>-pieds, <b>nu</b>-tête</em>); after the noun it agrees (<em>pieds <b>nus</b>, tête <b>nue</b></em>). Legal French keeps the old agreed form <em>la nue-propriété</em>.</li></ul>` },
        { h: "How it works", html: `<p>Most of these words sit on a boundary between classes. When a word behaves like an <b>adjective</b> (it describes a noun), it agrees; when it behaves like an <b>adverb, prefix or preposition</b> (it modifies a whole adjective, number or phrase, or fuses with the following word), it does not. Position is the clue: placed before, fused by a hyphen or heading a phrase, the word has stopped being a free adjective.</p>
<p>The <em>tout</em> exception is the odd one out, and it follows the ear. In <em>toute surprise</em> the <em>t</em> is pronounced; in <em>tout surpris</em> it is not, so agreement is audible and is written. Before a vowel, liaison makes <em>tout étonnée</em> and <em>toute étonnée</em> sound identical, so grammarians kept the invariable form. Older texts sometimes agree before a vowel too, but the modern norm keeps <em>tout</em>.</p>
<p>The same logic explains the rest:</p>
<ul><li><em>quelque</em> before a number means "about" and is an adverb: <em>quelque cent personnes</em> (compare the determiner <em>quelques personnes</em>).</li>
<li><em>possible</em> after <em>le plus / le moins + noun</em> is invariable because it means "as is possible": <em>le moins de fautes <b>possible</b></em>; elsewhere it agrees: <em>toutes les solutions possibles</em>.</li>
<li><em>excepté, passé, vu, y compris</em> are prepositions before the noun (<em><b>passé</b> dix heures, <b>excepté</b> les enfants</em>) and agreeing participles after it (<em>dix heures <b>passées</b>, les enfants <b>exceptés</b></em>).</li>
<li><em>ci-joint, ci-inclus</em> are invariable at the head of a sentence or before a noun with no determiner (<em>Ci-joint les photocopies. Vous trouverez ci-joint copie du contrat.</em>), agree when they qualify a noun (<em>la facture ci-jointe</em>), and are optional before a determined noun (<em>Je vous transmets ci-joint(es) deux copies</em>).</li></ul>` },

<div class="tbl"><table><tr><th>-s</th><th>no -s</th></tr>
<tr><td><em>quatre-vingt<b>s</b>, deux cent<b>s</b></em></td><td><em>quatre-vingt-un, deux cent un, cent vingt</em></td></tr>
<tr><td><em>trois cent<b>s</b> millions</em> (<em>million</em> is a noun)</td><td><em>trois cent mille</em> (<em>mille</em> is a numeral)</td></tr></table></div>
<p><em>Mille</em> never takes <em>-s</em>: <em>trois mille euros</em>. Used as ordinals (<em>page quatre-vingt, l'an mil neuf cent</em>), <em>vingt</em> and <em>cent</em> stay invariable. The <em>-s</em> is heard only in liaison: <em>quatre-vingt<b>s</b> ans</em> [z]. On hyphens in numbers, see Lesson: The 1990 spelling reform in detail.</p>` }

      theory: [
        { h: "Known before new", html: `<p>French syntax fixes a basic order (sujet, verbe, complément), but within it the writer still chooses what comes first. Linguists call the starting point the <b>thème</b> (topic: what the sentence is about, usually known) and the rest the <b>propos</b> or <b>rhème</b> (comment: the new information). The default is thème → propos, and the end of the sentence carries the most weight.</p>
<ul><li><em>Qui a écrit cette lettre ? <b>C'est ma sœur</b> qui l'a écrite.</em> The new element is isolated in a cleft (see Lesson: Emphasis: c'est … qui / que).</li>
<li><em>Cette lettre, ma sœur l'a écrite hier.</em> The known element is detached at the front and picked up by a pronoun (dislocation).</li>
<li><em>Au fond du jardin coulait une rivière.</em> A fronted place adverbial allows <b>stylistic inversion</b>, which puts the new subject last. Fronted <em>peut-être, sans doute, aussi</em> ("therefore") normally trigger inversion in writing (see Lesson: Inversion in formal writing).</li></ul>
<p>Fronting a <b>complément circonstanciel</b> (adverbial) also creates cohesion: <em>Le lendemain, … Dans la cour, …</em> links the sentence to what precedes.</p>` },
        { h: "How it works", html: `<p>Placement changes <b>scope</b> (what a word applies to) and <b>value</b>.</p>
<ul><li>Adverbs. Inside the verb phrase an adverb modifies the event: <em>Il a <b>souvent</b> menti</em> (a neutral statement of frequency). Fronted and set off by a comma it frames the whole sentence and becomes a topic or a link: <em><b>Souvent</b>, il a menti</em> (often, as it happens, he lied), common in narrative. With sentence adverbs the shift changes meaning: <em>Il a répondu <b>franchement</b></em> (manner) / <em><b>Franchement</b>, il a répondu</em> (the speaker's comment). Focus adverbs bind to what follows: <em>Il a <b>seulement</b> lu la lettre</em> (he did nothing else) / <em>Il a lu <b>seulement</b> la lettre</em> (nothing else was read).</li>
<li>Adjectives. Postposition is the descriptive, distinguishing position: <em>un paysage magnifique</em> classifies. Anteposing an adjective that normally follows gives it <b>subjective, affective</b> value and fuses it with the noun into a single impression: <em>un magnifique paysage, une lumineuse explication</em>. Relational adjectives (<em>présidentiel, solaire</em>) cannot move. Building on Lesson: Where adjectives go, this is a stylistic choice, not a meaning change of the <em>ancien/cher</em> type.</li>
<li>End-weight. French favours putting the longest constituent last: <em>J'ai rangé dans le tiroir <b>les lettres que ma grand-mère m'avait écrites</b></em> sounds better than the reverse, because the short complement would otherwise hang after a long object. Classical rhetoric calls a sentence whose segments grow longer a <b>cadence majeure</b>; it sounds balanced and conclusive. Shrinking segments (<b>cadence mineure</b>) sound abrupt, which can be a deliberate effect.</li></ul>` },
        { h: "Detached constructions", html: `<p>An <b>apposition</b> or <b>détachement</b> places an adjective, participle, noun phrase or gérondif at the edge of the sentence, set off by commas: <em>Fatigué, il s'assit. Médecin de formation, elle a choisi le journalisme.</em> It adds background (cause, time, concession) without a subordinate clause.</p>
<p>The rule: the <b>implicit subject</b> of the detached element must be the <b>subject of the main clause</b>. Otherwise you get a <b>participe mal rattaché</b> (dangling participle):</p>
<div class="tbl"><table><tr><th>dangling</th><th>correct</th></tr>
<tr><td><em>Arrivé à la gare, le train était parti.</em></td><td><em>Arrivé à la gare, <b>j'ai vu</b> que le train était parti.</em></td></tr>
<tr><td><em>En sortant du cinéma, il pleuvait.</em></td><td><em>En sortant du cinéma, <b>nous</b> avons constaté qu'il pleuvait.</em></td></tr></table></div>
<p>Literary texts sometimes break the rule when the context removes any ambiguity, and set phrases survive (<em>L'appétit vient en mangeant</em>). Usage guides such as the OQLF still treat them as faults in careful prose, because they can be ambiguous or comic.</p>` }
      ],
      examples: [
        ["Dans le silence de la nuit retentit soudain un cri.", "In the silence of the night a scream suddenly rang out."],
        ["Ce roman, je l'ai lu trois fois.", "This novel, I've read it three times."],
        ["Souvent, il s'arrêtait sur le pont pour regarder l'eau.", "Often he would stop on the bridge to watch the water."],

        ["Épuisée par le voyage, elle s'endormit aussitôt.", "Exhausted by the journey, she fell asleep at once."],
        ["Peut-être reviendra-t-il un jour.", "Perhaps he will come back one day."]

      pitfalls: [
        `The dangling participle: <em>Arrivé à la gare, le train était parti</em> says the train arrived. Make the subjects match: <em>Arrivé à la gare, <b>j'ai constaté</b> que le train était parti.</em>`,
        `Copying English after a fronted <em>peut-être</em>: in careful writing use <em>Peut-être <b>viendra-t-il</b></em> or <em>Peut-être <b>qu'il viendra</b></em>, not <em>Peut-être il viendra</em>.`,

      activities: [
        { t: "mc", q: "Answer to 'Qui a cassé le vase ?' that puts the new information in focus:", o: ["C'est Pierre qui l'a cassé.", "Pierre, il l'a cassé.", "Le vase, il l'a cassé, Pierre."], a: 0, x: "The question makes the vase known and the culprit new. The cleft <em>C'est Pierre qui…</em> isolates the new element. Dislocation treats <em>Pierre</em> as an already-known topic." },
        { t: "match", q: "Match each technique to its example.", pairs: [["stylistic inversion", "Au fond du jardin coulait une rivière."], ["detached participle", "Épuisée, elle s'endormit."], ["left dislocation", "Ce livre, je l'ai adoré."], ["cleft sentence", "C'est lui qui a gagné."], ["anteposed adjective", "Il nous a donné une lumineuse explication."]], x: "Each technique moves a constituent to change what is presented as known or new, or to add the speaker's impression. (The inversion example also starts with a fronted adverbial, which is what licenses the inversion.)" },
        { t: "mc", q: "Which version gives the adjective its subjective, affective value?", o: ["un paysage magnifique", "un magnifique paysage"], a: 1, x: "Before the noun, an adjective that normally follows expresses the speaker's impression: <em>un magnifique paysage</em>. After it, it describes and classifies." },
        { t: "mc", q: "He only READ the letter (he didn't answer it).", o: ["Il a seulement lu la lettre.", "Il a lu seulement la lettre."], a: 0, x: "<em>Seulement</em> applies to what follows it. Before <em>lu</em> it restricts the action; before <em>la lettre</em> it restricts the object." },
        { t: "order", q: "With stylistic inversion: In the depths of the forest stood an old house.", w: ["Au", "fond", "de", "la", "forêt", "se", "dressait", "une", "vieille", "maison"], alt: [], x: "A fronted place adverbial allows stylistic inversion: the verb comes before the new subject, which takes the final, focal position." },
        { t: "fill", q: "Sur la table ___ une lettre cachetée.", h: "se trouver, imparfait", a: ["se trouvait"], x: "After a fronted place adverbial, the subject can follow the verb: <em>Sur la table se trouvait une lettre</em>. The new element ends the sentence." },
        { t: "sort", q: "Correctly attached or dangling (mal rattaché)?", cats: ["correct", "dangling"], items: [["Fatigué, il s'assit.", 0], ["Fatigué, le fauteuil l'accueillit.", 1], ["En sortant du cinéma, il pleuvait.", 1], ["En sortant du cinéma, nous avons vu qu'il pleuvait.", 0], ["Âgée de vingt ans, sa carrière commençait.", 1], ["Âgée de vingt ans, elle commençait sa carrière.", 0]], x: "The detached element must refer to the main clause's subject. A tired armchair, a rain leaving the cinema and a twenty-year-old career are the comic results of mismatches." },
        { t: "mc", q: "Which sentence is correctly constructed?", o: ["Arrivé à la gare, le train était déjà parti.", "Arrivé à la gare, j'ai constaté que le train était déjà parti.", "Arrivé à la gare, il était trop tard pour le train."], a: 1, x: "Only in the second does the subject (<em>je</em>) match the participle <em>arrivé</em>. In the third, the subject is impersonal <em>il</em>." },
        { t: "mc", q: "Which sentence has better end-weight?", o: ["J'ai rangé dans le tiroir les lettres que ma grand-mère m'avait écrites pendant la guerre.", "J'ai rangé les lettres que ma grand-mère m'avait écrites pendant la guerre dans le tiroir."], a: 0, x: "The long object goes last. In the second version <em>dans le tiroir</em> trails behind and could even seem to belong to <em>écrites</em>." },
        { t: "mc", q: "Formal writing: which version is correct?", o: ["Peut-être il viendra demain.", "Peut-être viendra-t-il demain.", "Peut-être viendra-il demain."], a: 1, x: "Fronted <em>peut-être</em> triggers inversion in careful writing, with <em>-t-</em> between the two vowels: <em>Peut-être viendra-t-il</em>. The alternative is <em>Peut-être qu'il viendra</em>." }
      ],
      sources: [
