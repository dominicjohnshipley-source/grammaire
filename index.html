[hidden] { display: none !important; }
.install-pill { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 15; display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 99px; border: 0; background: var(--sign); color: var(--sign-ink); font-family: var(--f-display); font-weight: 700; font-size: 1rem; box-shadow: var(--shadow); cursor: pointer; }

<body>
<style>
/* Layout: the course drawn as a métro map. White paper, thick line colours, white stations with black outlines,
   white interchange pills, numbered roundels, bold condensed black labels. Lines are full colour where travelled
   (lessons done) and pale ahead. French in serif italic, English in sans. One reading column (~46rem). */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --ink: #141414;          /* map labels */
  --muted: #5E6166;
  --line: #EDEDED;
  --line-strong: #D5D5D5;
  --soft: #F4F4F4;
  --link: #1F5FD1;
  --primary: #141414;
  --primary-ink: #FFFFFF;
  --gold: #C98A00;
  --gold-soft: #FCF1D6;
  --ok: #00805A;
  --ok-soft: #E1F4EC;
  --bad: #D0142C;
  --bad-soft: #FCE8EB;
  --warn: #6E5200;
  --warn-soft: #FFF6D1;
  --warn-bar: #FFCD00;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.06);
  --f-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-fr: "Newsreader", Georgia, "Times New Roman", serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --s-xs: .8125rem; --s-sm: .9rem; --s-md: 1rem; --s-lg: 1.15rem;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101113; --surface: #17181B; --ink: #F2F2F2; --muted: #A3A6AD; --line: #24262A; --line-strong: #383B40; --soft: #1E2024;
    --link: #86A9FF; --primary: #F2F2F2; --primary-ink: #101113;
    --gold: #F2C14E; --gold-soft: #3A2E12; --ok: #3FCF94; --ok-soft: #12352A; --bad: #FF7A8A; --bad-soft: #3E1C26;
    --warn: #F3D36B; --warn-soft: #2B2610; --warn-bar: #FFCD00; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .lc { --lc: var(--l2, var(--ink)); }
}
:root[data-theme="dark"] {
  --bg: #101113; --surface: #17181B; --ink: #F2F2F2; --muted: #A3A6AD; --line: #24262A; --line-strong: #383B40; --soft: #1E2024;
  --link: #86A9FF; --primary: #F2F2F2; --primary-ink: #101113;
  --gold: #F2C14E; --gold-soft: #3A2E12; --ok: #3FCF94; --ok-soft: #12352A; --bad: #FF7A8A; --bad-soft: #3E1C26;
  --warn: #F3D36B; --warn-soft: #2B2610; --warn-bar: #FFCD00; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
  color-scheme: dark;
}
.lc { --lc: var(--l, var(--ink)); --lcf: var(--lf, #fff); --lc-pale: color-mix(in srgb, var(--lc) 30%, var(--bg)); }
:root[data-theme="dark"] .lc { --lc: var(--l2, var(--ink)); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--s-md); line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--link); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--link); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.08; margin: 0; }
svg.i { width: 1.1em; height: 1.1em; vertical-align: -0.18em; flex: none; }
.wrap { max-width: 46rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* line roundel */
.ln { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--lc); color: var(--lcf); font-family: var(--f-display); font-weight: 700; font-size: .9rem; line-height: 1; flex: none; border: 0; padding: 0; font-variant-numeric: tabular-nums; }
.ln.big { width: 46px; height: 46px; font-size: 1.45rem; font-weight: 800; }
.ln.sm { width: 18px; height: 18px; font-size: .68rem; margin-right: 6px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1.5px solid var(--ink); }
.bar .wrap { display: flex; align-items: center; gap: 10px; min-height: 56px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; text-decoration: none; color: var(--ink); display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand .mark { width: 28px; height: 28px; border-radius: 50%; background: var(--bg); color: var(--ink); border: 3px solid var(--ink); display: grid; place-items: center; font-size: .9rem; font-weight: 800; }
.tabs { display: flex; gap: 2px; }
.tabs a { text-decoration: none; color: var(--muted); font-family: var(--f-display); font-weight: 700; font-size: 1rem; padding: 5px 10px; border-radius: 99px; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { background: var(--primary); color: var(--primary-ink); }
.hud { display: flex; gap: 6px; font-family: var(--f-display); font-size: .9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.hud span { display: inline-flex; align-items: center; gap: 3px; }
.hud .streak { color: var(--bad); }
.hud .xp { color: var(--gold); }
body.playing .bar { display: none; }
main { padding-block: 0 4rem; }

/* page header band (plain paper) */
.wall { background: var(--bg); border-bottom: 1px solid var(--line-strong); }
.hero { padding-block: 1.4rem 1.25rem; }
.hero h1 { font-size: 2.4rem; font-weight: 800; letter-spacing: -.01em; }
.hero p { margin: .35rem 0 0; color: var(--muted); max-width: 36rem; }
.hero-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.hero-sub { color: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: 1rem; }

/* network map */
.netmap { display: block; width: 100%; max-width: 30rem; height: auto; margin: 12px auto 4px; overflow: visible; }
.nm-base, .nm-fill { fill: none; stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; }
.nm-base { stroke: var(--lc-pale); }
.nm-fill { stroke: var(--lc); }
.nm-line { cursor: pointer; outline: none; }
.nm-line:hover .nm-base, .nm-line:focus-visible .nm-base { stroke: var(--lc); }
.nm-stops { pointer-events: none; }
.nm-stop { fill: var(--bg); stroke: var(--ink); stroke-width: 1.8; }
.nm-here { fill: var(--bg); stroke: var(--ink); stroke-width: 3.4; }
.nm-hub { fill: var(--bg); stroke: var(--ink); stroke-width: 3; }
.nm-hub-t { font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .06em; fill: var(--ink); }
.nm-roundel { cursor: pointer; }
.nm-roundel circle { fill: var(--lc); stroke: var(--bg); stroke-width: 2.5; }
.nm-roundel text { font-family: var(--f-display); font-weight: 700; font-size: 13px; fill: var(--lcf); }

/* stats */
.stats { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; margin-top: 1rem; }
.stat { background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.stat .k { font-family: var(--f-display); font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.stat .v { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
.stat .s { font-size: var(--s-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.stat.streak .v { color: var(--bad); }
.meter { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .4s; }
.meter.gold i { background: var(--gold); }
@media (max-width: 30rem) { .stats { grid-template-columns: 1fr 1fr; } .stats .stat:first-child { grid-column: 1 / -1; } }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid var(--ink); background: var(--bg); color: var(--ink); padding: 8px 16px; border-radius: 99px; font-family: var(--f-display); font-weight: 700; font-size: 1.02rem; cursor: pointer; text-decoration: none; min-height: 44px; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { opacity: .9; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .4; cursor: default; }

/* next stop & review */
.hero-cards { display: grid; gap: 10px; margin-top: 1rem; }
@media (min-width: 40rem) { .hero-cards { grid-template-columns: 1.6fr 1fr; } }
.departure { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: var(--bg); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 14px; text-decoration: none; }
.departure:hover { background: var(--soft); }
.dep-label { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .78rem; color: var(--muted); }
.dep-row { display: flex; align-items: center; gap: 12px; }
.dep-row b { flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; line-height: 1.1; }
.dep-go { font-size: 1.6rem; font-family: var(--f-display); font-weight: 800; }
.dep-meta { font-size: var(--s-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.review-card { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--bg); border: 2px solid var(--line-strong); color: var(--ink); text-decoration: none; }
.review-card:hover { border-color: var(--ink); }
.review-card > svg { color: var(--gold); width: 26px; height: 26px; }
.review-card .t { flex: 1; min-width: 0; }
.review-card small { display: block; color: var(--muted); font-family: var(--f-display); font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
.review-card b { display: block; font-family: var(--f-display); font-size: 1.2rem; font-weight: 800; }
.rc-meta { display: block; font-size: var(--s-xs); color: var(--muted); }
.review-card .go { font-family: var(--f-display); font-size: 1.4rem; font-weight: 800; }

/* map tools */
.map-tools { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); z-index: 4; background: var(--bg); border-bottom: 1px solid var(--line-strong); }
.map-tools .wrap { display: flex; gap: 8px; align-items: center; padding-block: 8px; }
.levels { display: flex; gap: 4px; flex: none; }
.lvl { font-family: var(--f-display); font-weight: 800; font-size: .85rem; border: 2px solid var(--ink); background: var(--bg); border-radius: 99px; padding: 3px 8px; cursor: pointer; color: var(--ink); min-height: 34px; }
.lvl:hover { background: var(--ink); color: var(--bg); }
#find, .hero-search { flex: 1; min-width: 0; padding: 7px 12px; border-radius: 99px; border: 2px solid var(--line-strong); background: var(--bg); min-height: 36px; font-size: 16px; color: var(--ink); }
#find:focus, .hero-search:focus { border-color: var(--ink); outline: none; }
.hero-search { display: block; width: 100%; max-width: 28rem; margin-top: 1rem; padding: 10px 14px; }

/* units = lines */
.unit { margin-top: .75rem; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 118px); }
.unit-head { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; padding: 8px 0; text-align: left; cursor: pointer; color: inherit; }
.uh-t { flex: 1; min-width: 0; }
.uh-t b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 1.4rem; line-height: 1.08; }
.uh-t small { display: block; color: var(--muted); font-size: var(--s-xs); margin-top: 2px; font-variant-numeric: tabular-nums; }
.uh-t small svg { color: var(--gold); }
.unit-head:hover .uh-t b { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.chev { display: inline-flex; color: var(--ink); }
.chev svg { transition: transform .2s; width: 1.3em; height: 1.3em; }
.unit-head[aria-expanded="true"] .chev svg { transform: rotate(180deg); }
.unit-intro { color: var(--muted); font-size: var(--s-sm); margin: .25rem 0 .25rem 58px; }
.mini-line { position: relative; display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px 58px; height: 16px; max-width: 20rem; background: linear-gradient(var(--lc-pale), var(--lc-pale)) center / 100% 6px no-repeat; }
.ml-fill { position: absolute; left: 0; top: 50%; height: 6px; margin-top: -3px; background: var(--lc); border-radius: 3px; }
.mini-line i { position: relative; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--ink); }
.mini-line i.end { width: 22px; height: 12px; border-radius: 99px; }

/* stations: each segment below a station is full colour once that station is done, pale until then */
ol.stations { list-style: none; margin: 4px 0 0; padding: 0 0 0 58px; position: relative; }
.station { position: relative; border-bottom: 1px solid var(--line); }
.station::after { content: ""; position: absolute; z-index: 0; left: -39px; width: 8px; top: 29px; bottom: -29px; background: var(--lc-pale); }
.station.done::after { background: var(--lc); }
.station:first-child::before { }
.station::before { content: ""; position: absolute; z-index: 1; left: -44px; top: 20px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); border: 3.5px solid var(--ink); }
.station.cur::before { width: 28px; height: 28px; left: -49px; top: 15px; border-width: 5px; }
.station.terminus { border-bottom: 0; }
.station.terminus::after { display: none; }
.station.terminus::before { width: 34px; height: 18px; left: -52px; top: 20px; border-radius: 99px; }
.station > a, .term-row { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; text-decoration: none; color: inherit; }
.st-body { min-width: 0; }
.st-num { display: flex; align-items: center; font-family: var(--f-display); font-weight: 700; font-size: .8rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.here { margin-left: 4px; color: var(--bg); background: var(--ink); padding: 0 6px; border-radius: 99px; font-size: .7rem; letter-spacing: .06em; }
.st-title { display: block; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
.station a:hover .st-title { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.st-sum { display: block; color: var(--muted); font-size: var(--s-sm); line-height: 1.4; }
.st-meta { display: flex; flex-direction: column; align-items: flex-end; }
.st-min { font-size: .8rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stars { display: inline-flex; gap: 1px; color: var(--line-strong); }
.stars .on { color: var(--gold); }
ol.stations.flat { padding-left: 0; }
.flat .station::before, .flat .station::after { display: none; }
.results-head { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; font-size: .95rem; padding: 10px 0 6px; border-bottom: 2px solid var(--ink); }

/* lesson page */
.topic-head { padding-block: 1rem 1rem; }
.back { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-display); font-size: 1rem; font-weight: 700; text-decoration: none; min-height: 36px; color: var(--ink); }
.strip { display: flex; align-items: center; gap: 10px; margin-top: .5rem; }
.strip-track { position: relative; flex: 1; height: 32px; min-width: 0; }
.sp-base, .sp-fill { position: absolute; top: 50%; height: 8px; margin-top: -4px; left: 4%; border-radius: 4px; }
.sp-base { right: 3%; background: var(--lc-pale); }
.sp-fill { background: var(--lc); }
.sp-stop { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--bg); border: 3px solid var(--ink); }
.sp-stop.here { width: 28px; height: 28px; margin: -14px 0 0 -14px; border-width: 5px; }
.sp-stop:hover { background: var(--soft); }
.sp-pill { position: absolute; top: 50%; width: 30px; height: 16px; margin: -8px 0 0 -15px; border-radius: 99px; background: var(--bg); border: 3px solid var(--ink); }
.eyebrow { font-family: var(--f-display); font-size: .85rem; font-weight: 700; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; margin-top: .75rem; }
.lesson-title { font-size: 2.2rem; font-weight: 800; margin-top: .2rem; letter-spacing: -.01em; }
.meta-line { color: var(--muted); font-size: var(--s-sm); margin-top: .3rem; font-variant-numeric: tabular-nums; }
.lede { color: var(--ink); margin: .6rem 0 0; font-size: var(--s-lg); }
.goals { margin: 1rem 0 0; padding: 12px 14px 12px 34px; background: var(--soft); border-radius: var(--radius); font-size: var(--s-sm); }
.goals li { margin: 2px 0; }
.goals .goals-h { list-style: none; font-family: var(--f-display); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; margin: 0 0 4px -20px; }
.head-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 1rem; align-items: center; }
.done-note { font-size: var(--s-sm); color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.sec { margin-top: 2rem; }
.sec > h2 { font-size: 1.05rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ink); margin-bottom: .75rem; display: flex; align-items: center; gap: 10px; }
.sec > h2::before { content: ""; width: 22px; height: 8px; border-radius: 4px; background: var(--lc, var(--ink)); flex: none; }
.sec > h2::after { content: ""; flex: 1; height: 1.5px; background: var(--line-strong); }
.prose { max-width: 40rem; }
.prose p { margin: 0 0 .85rem; }

<script>
const COURSE = [];
COURSE.push({
  id: "u0",
  level: "A1",
  title: "Grammar toolkit",
  intro: "The vocabulary of grammar itself, and the spelling habits that carry grammar. Every later lesson uses these terms and assumes you can read these signals.",
  lessons: [
    {
      id: "u0-sentence",
      title: "How a French sentence is built",
      summary: "Parts of speech, sentence roles (sujet, COD, COI) and where French word order differs",
      minutes: 14,
      goals: [
        "Name the eight French parts of speech and give an example of each",
        "Identify the sujet, verbe, COD, COI and complément circonstanciel in a simple sentence",
        "Place object pronouns, adjectives and adverbs in the normal French position"
      ],
      theory: [
        { h: "Parts of speech", html: `<p>French grammar sorts words into eight <em>classes de mots</em> (parts of speech). The class is what a word <b>is</b>, whatever sentence it appears in.</p>
<div class="tbl"><table>
<tr><th>Class</th><th>English</th><th>Examples</th></tr>
<tr><td><em>nom</em></td><td>noun</td><td><em>chat, maison, Paris</em></td></tr>
<tr><td><em>déterminant</em></td><td>determiner (article, my, this...)</td><td><em>le, une, mon, ce</em></td></tr>
<tr><td><em>adjectif</em></td><td>adjective</td><td><em>petit, rouge</em></td></tr>
<tr><td><em>verbe</em></td><td>verb</td><td><em>parler, être</em></td></tr>
<tr><td><em>pronom</em></td><td>pronoun</td><td><em>je, elle, le, lui</em></td></tr>
<tr><td><em>adverbe</em></td><td>adverb</td><td><em>souvent, très, bien</em></td></tr>
<tr><td><em>préposition</em></td><td>preposition</td><td><em>à, de, dans, avec</em></td></tr>
<tr><td><em>conjonction</em></td><td>conjunction</td><td><em>et, mais, ou, que</em></td></tr>
</table></div>
<p>The first five are <b>variable</b>: they change form for gender, number or person. Adverbs, prepositions and conjunctions are <b>invariable</b>: they never change.</p>` },
        { h: "Sentence roles", html: `<p>A word's role (<em>fonction</em>) is the job it does in one particular sentence.</p>
<ul>
<li><em>sujet</em> (subject): who or what does the action. <em><b>Marie</b> lit.</em></li>
<li><em>verbe</em> (verb): the action or state. <em>Marie <b>lit</b>.</em></li>
<li><em>COD</em>, <em>complément d'objet direct</em> (direct object): attached to the verb with no preposition. <em>Marie lit <b>un livre</b>.</em></li>
<li><em>COI</em>, <em>complément d'objet indirect</em> (indirect object): attached with a preposition, usually <em>à</em> or <em>de</em>. <em>Marie parle <b>à son frère</b>.</em> When a verb has both a COD and a COI, the COI is often called the <em>COS</em> (<em>complément d'objet second</em>).</li>
<li><em>complément circonstanciel</em> (adverbial): when, where, how, why. It can usually move or be deleted. <em>Marie lit <b>le soir</b>.</em></li>
</ul>` },
        { h: "How it works", html: `<p>Class and role are two separate questions. <em>livre</em> is always a <em>nom</em>, but it can be a sujet (<em>Le livre est rouge.</em>) or a COD (<em>Je lis le livre.</em>). Grammar rules usually depend on both: agreement depends on class, word order depends on role.</p>
<p>French, like English, is mainly <b>sujet + verbe + complément</b>. Nouns do not change form for their role, so position does the work: <em>Le chat regarde le chien</em> and <em>Le chien regarde le chat</em> mean different things.</p>
<p>Prepositions are the second signal. A verb is built either to take its object directly or through <em>à</em>/<em>de</em>, and this is fixed for each verb, not for its English translation. <em>téléphoner <b>à</b> quelqu'un</em> takes a COI even though English says "phone someone".</p>
<p>Pronouns are different from nouns: they still have separate forms for each role (<em>le</em> for a COD, <em>lui</em> for a COI). Because their form shows their job, they do not need to sit in the object position, and French puts them before the verb.</p>
<p>The variable classes are linked by agreement. Determiners and adjectives copy the noun's gender and number; the verb copies the subject's person and number. Much of French grammar is these links.</p>` },
        { h: "Where French order differs", html: `<ul>
<li><b>Object pronouns go before the verb.</b> <em>Je <b>la</b> vois.</em> (I see her.) <em>Il <b>lui</b> parle.</em> (He talks to him.)</li>
<li><b>Most adjectives go after the noun.</b> <em>une voiture <b>rouge</b></em>, <em>un film <b>intéressant</b></em>. A small group of short, common adjectives (<em>petit, grand, bon, beau, jeune, vieux</em>...) go before: <em>un <b>petit</b> chat</em>.</li>
<li><b>Adverbs go after the conjugated verb</b>, never between subject and verb. <em>Je mange <b>souvent</b> des pommes.</em> (I often eat apples.)</li>
</ul>` }
      ],

    {

      title: "Spelling that carries grammar",

      theory: [
        { h: "How it works", html: `<p>French spelling was largely fixed while pronunciation kept changing. Most final consonants and the final <em>-e</em> stopped being pronounced centuries ago, but the spelling kept them. Many of those silent letters are grammar:</p>
<ul>
<li>plural <em>-s</em>/<em>-x</em>: <em>le chat</em> / <em>les chat<b>s</b></em> sound the same apart from the determiner</li>
<li>verb endings: <em>il parl<b>e</b></em>, <em>tu parl<b>es</b></em>, <em>ils parl<b>ent</b></em> all sound identical</li>
<li>feminine <em>-e</em>: <em>ami</em> / <em>ami<b>e</b></em> sound the same; with <em>petit</em> / <em>petit<b>e</b></em> the <em>-e</em> makes the <em>t</em> heard</li>
</ul>
<p>So written French shows grammar the ear often cannot hear, and you must write it even when you do not say it. In speech, the information moves to small words (<em>le</em>/<em>les</em>, <em>il</em>/<em>ils</em>) and to liaison.</p>
<p>Spoken French also avoids two vowel sounds colliding (a <em>hiatus</em>). Elision removes the first vowel (<em>le ami</em> → <em>l'ami</em>); liaison brings back a silent consonant as a bridge (<em>les‿amis</em>). The same logic produces <em>cet ami</em> and <em>mon amie</em>, which you will meet in Unit 1.</p>` },
        { h: "The accents", html: `<p>Accents are part of the spelling. Leaving one out can change the word.</p>
<div class="tbl"><table>
<tr><th>Mark</th><th>Where</th><th>What it does</th></tr>
<tr><td><em>é</em> accent aigu</td><td>e only</td><td>closed "ay" sound; ending of most past participles (<em>parl<b>é</b></em>). Initial <em>é</em> often matches English s-: <em>école</em> (school), <em>étudiant</em> (student)</td></tr>
<tr><td><em>è</em> accent grave</td><td>e, a, u</td><td>on e: open "eh" sound (<em>mère</em>). On a and u: tells apart words that sound alike: <em>a</em> (has) / <em><b>à</b></em> (to), <em>la</em> (the) / <em>l<b>à</b></em> (there), <em>ou</em> (or) / <em>o<b>ù</b></em> (where)</td></tr>
<tr><td><em>ê â î ô û</em> circonflexe</td><td>any vowel</td><td>often marks an s that has disappeared: <em>forêt</em> (forest), <em>hôpital</em> (hospital), <em>île</em> (isle); also separates <em>sur</em> (on) / <em>sûr</em> (sure), <em>du</em> / <em>dû</em></td></tr>
<tr><td><em>ç</em> cédille</td><td>c before a, o, u</td><td>keeps c soft (s sound): <em>garçon</em>, <em>nous commen<b>ç</b>ons</em></td></tr>
<tr><td><em>ë ï</em> tréma</td><td>e, i (rarely u)</td><td>the vowel is pronounced separately: <em>Noël</em>, <em>naïf</em></td></tr>
</table></div>
<p>Since the 1990 spelling reform, the circumflex on <em>i</em> and <em>u</em> is optional in many words (<em>connaître</em> or <em>connaitre</em>) but kept where it separates two words (<em>sûr</em>, <em>dû</em>). Both spellings are correct.</p>` },
        { h: "Elision", html: `<p>Before a vowel or an <em>h muet</em> (silent h), these short words drop their vowel and take an apostrophe:</p>
<ul>
<li><em>le, la</em> → <em>l'</em>: <em>l'arbre, l'école, l'homme</em></li>
<li><em>je, me, te, se</em> → <em>j', m', t', s'</em>: <em>j'aime, il s'appelle</em></li>
<li><em>ne, de, que</em> → <em>n', d', qu'</em>: <em>je n'ai pas, qu'il</em></li>
<li><em>si</em> → <em>s'</em> only before <em>il</em>/<em>ils</em>: <em>s'il</em>, but <em>si elle</em></li>
</ul>
<p>Elision is compulsory in writing. <em>tu</em> does not elide in standard French: <em>tu as</em>.</p>` },
        { h: "Liaison and the two h's", html: `<p>In a liaison, a silent final consonant is pronounced at the start of the next word: <em>les‿amis</em> (z sound), <em>un‿ami</em> (n), <em>nous‿avons</em> (z). It is required between a determiner and its noun, a subject pronoun and its verb, and a short adjective and the noun after it (<em>un petit‿enfant</em>). It is never made after <em>et</em>.</p>
<p>The letter <em>h</em> is never pronounced, but there are two kinds:</p>
<ul>
<li><em>h muet</em>: the word behaves as if it began with a vowel. <em>l'homme, les‿hôtels, j'habite</em>.</li>
<li><em>h aspiré</em>: the word behaves as if it began with a consonant. No elision, no liaison: <em>le héros, la honte, les | haricots</em>. Many of these words came into French from Germanic languages, and their h was still pronounced in Old French.</li>
</ul>
<p>You cannot tell from the spelling. Dictionaries mark h aspiré, often with an asterisk or apostrophe.</p>` }

        { t: "mc", q: "In which phrase do you pronounce a liaison?", o: ["les amis", "et elle", "les héros"], a: 0, x: "<em>les‿amis</em> needs a z liaison. There is never a liaison after <em>et</em>, and <em>héros</em> has an h aspiré." },
        { t: "sort", q: "h muet or h aspiré?", cats: ["h muet (l', liaison)", "h aspiré (le/la, no liaison)"], items: [["homme", 0], ["hôtel", 0], ["heure", 0], ["histoire", 0], ["héros", 1], ["haricot", 1], ["honte", 1], ["hibou", 1]], x: "<em>l'homme, l'hôtel, l'heure, l'histoire</em>, but <em>le héros, le haricot, la honte, le hibou</em>. You have to learn which is which." },

COURSE.push({
  id: "u1",
  level: "A1",
  title: "Nouns & determiners",
  intro: "Every French noun comes with a gender, a number and a determiner. This unit shows how those three fit together, so that agreement in every later unit has something to agree with.",
  lessons: [
    {
      id: "u1-gender",
      title: "Gender of nouns",
      summary: "le/la, the ending clues and their exceptions, and why gender matters everywhere",
      minutes: 14,
      goals: [
        "Explain why every French noun has a gender",
        "Predict gender from common endings and know the main exceptions",
        "Tell apart nouns whose meaning changes with gender (le livre / la livre)",
        "Form masculine and feminine nouns for people"
      ],
      theory: [
        { h: "Every noun has a gender", html: `<p>Every French noun is either <em>masculin</em> (masculine) or <em>féminin</em> (feminine), including objects and ideas: <em><b>le</b> livre</em> (the book), <em><b>la</b> table</em> (the table). There is no neuter.</p>
<p>The noun itself rarely shows its gender. The determiner does: <em>le</em>/<em>un</em> for masculine, <em>la</em>/<em>une</em> for feminine. Learn every noun with <em>un</em> or <em>une</em> in front of it. (<em>l'</em> and <em>les</em> hide the gender, so they are no help.)</p>` },
        { h: "Ending clues", html: `<div class="tbl"><table>
<tr><th>Ending</th><th>Gender</th><th>Examples</th><th>Common exceptions</th></tr>
<tr><td><em>-tion, -sion</em></td><td>f</td><td><em>la nation, la télévision</em></td><td>almost none</td></tr>
<tr><td><em>-té</em></td><td>f</td><td><em>la liberté, la santé</em></td><td><em>l'été, le côté, le comité, le pâté</em> (m)</td></tr>
<tr><td><em>-ure, -ette</em></td><td>f</td><td><em>la voiture, la baguette</em></td><td><em>le squelette</em> (m)</td></tr>
<tr><td><em>-ance, -ence</em></td><td>f</td><td><em>la chance, la patience</em></td><td><em>le silence</em> (m)</td></tr>
<tr><td><em>-age</em></td><td>m</td><td><em>le fromage, le voyage</em></td><td><em>la page, la plage, la cage, l'image, la rage</em> (f)</td></tr>
<tr><td><em>-ment</em></td><td>m</td><td><em>le moment, le gouvernement</em></td><td><em>la jument</em> (f)</td></tr>
<tr><td><em>-isme</em></td><td>m</td><td><em>le tourisme</em></td><td>none common</td></tr>
<tr><td><em>-eau</em></td><td>m</td><td><em>le bateau, le gâteau</em></td><td><em>l'eau, la peau</em> (f)</td></tr>
</table></div>
<p>A plain final <em>-e</em> leans feminine, but many common nouns in <em>-e</em> are masculine: <em>le problème, le musée, le lycée, le livre, le groupe</em>.</p>` },
        { h: "How it works", html: `<p>Gender is a grammatical class, not a statement about sex. A table is not female; <em>table</em> simply belongs to the feminine class.</p>
<p>The classes come from Latin, which had three genders. The neuter mostly merged into the masculine, leaving French with two. Latin feminine nouns in <em>-a</em> became French nouns in <em>-e</em> (<em>rosa</em> → <em>rose</em>), which is why <em>-e</em> leans feminine.</p>
<p>Suffixes carry their Latin gender with them. <em>-tion</em> comes from feminine <em>-tio</em>, <em>-té</em> from feminine <em>-tas</em>, and <em>-age</em> from neuter <em>-aticum</em> (<em>formaticum</em> → <em>fromage</em>), so these endings are reliable. The <em>-age</em> exceptions are not built with that suffix: <em>page</em> comes from Latin <em>pagina</em> and <em>image</em> from <em>imago</em>, both feminine.</p>
<p>Gender matters because so much copies it: determiners (<em>un/une</em>, <em>ce/cette</em>), adjectives (<em>petit/petite</em>), pronouns (<em>il/elle</em> for things too) and, later, past participles. Get the noun's gender wrong and every word linked to it goes wrong.</p>` },
        { h: "Two genders, and people", html: `<p>A few nouns have two genders with two meanings:</p>
<ul>
<li><em>le livre</em> (book) / <em>la livre</em> (pound)</li>
<li><em>le tour</em> (tour, turn) / <em>la tour</em> (tower)</li>
<li><em>le poste</em> (job, set) / <em>la poste</em> (post office)</li>
</ul>
<p>Nouns for people usually have both forms: <em>un étudiant / une étudiant<b>e</b></em>, <em>un ami / une ami<b>e</b></em>, <em>un chanteur / une chant<b>euse</b></em>, <em>un acteur / une act<b>rice</b></em>. Some have one form for both: <em>un/une élève</em>, <em>un/une journaliste</em>.</p>
<p>Some nouns keep their gender whoever they refer to: <em>une personne</em>, <em>une victime</em>, <em>un bébé</em>. Feminine job titles such as <em>la professeure</em> have long been standard in Québec; France has accepted them more recently (the Académie française did so in 2019), so you will see both <em>la professeure</em> and <em>le professeur</em> for a woman.</p>` }
      ],
      examples: [
        ["La télévision est dans le salon.", "The television is in the living room."],
        ["Le fromage est sur la table.", "The cheese is on the table."],
        ["J'ai un problème avec la voiture.", "I have a problem with the car."],

</table></div>
<p><em>le</em> and <em>la</em> elide: <em>l'arbre, l'école, l'hôtel</em>, but <em>le héros</em> (h aspiré). <em>à</em> and <em>de</em> fuse with <em>le</em> and <em>les</em>: <em>à + le = <b>au</b></em>, <em>à + les = <b>aux</b></em>, <em>de + le = <b>du</b></em>, <em>de + les = <b>des</b></em>. <em>la</em> and <em>l'</em> never fuse: <em>à la, de l'</em>.</p>` },
        { h: "How it works", html: `<p>The definite article comes from Latin <em>ille/illa</em> ("that"); the indefinite from <em>unus</em> ("one"). The meanings still follow: <em>le</em> points to something identifiable, <em>un</em> introduces one item that has not been identified.</p>
<ul>
<li><em>Le livre est sur la table.</em> We both know which book.</li>
<li><em>J'ai un livre.</em> One book, new information.</li>
</ul>
<p>The key difference from English: a French noun almost always needs a determiner. English can say "I like coffee" or "Life is beautiful" with no article. French cannot leave the slot empty, so for a whole category or an abstract idea it uses the definite article, which points to the category as a whole:</p>
<ul>
<li><em>J'aime <b>le</b> café.</em> (I like coffee.)</li>
<li><em><b>La</b> vie est belle.</em> (Life is beautiful.)</li>
<li><em><b>Les</b> chats sont indépendants.</em> (Cats are independent.)</li>
</ul>
<p><em>des</em> is simply the plural of <em>un</em>. English often uses no word at all: <em>J'ai des amis à Paris</em> (I have friends in Paris).</p>` },
        { h: "Days, body, languages, countries", html: `<ul>

<li><b>Languages:</b> as subjects or objects they take <em>le</em>: <em>Le français est logique. J'étudie le français.</em> After <em>parler</em> the article is usually dropped: <em>Je parle français.</em></li>
<li><b>Countries:</b> most take an article: <em>la France, le Japon, les États-Unis</em>. <em>J'aime la France.</em> After "in/to" the article changes or disappears (<em>en France, au Japon</em>), which comes later.</li>

      title: "The partitive article",
      summary: "du, de la, de l', des for 'some', and when they shrink to de",
      minutes: 14,
      goals: [
        "Use du, de la, de l' and des for an unspecified amount",
        "Replace them with de after a negative (except with être)",

      theory: [
        { h: "The forms", html: `<div class="tbl"><table>
<tr><th>masculine</th><th>feminine</th><th>before vowel / h muet</th><th>plural</th></tr>
<tr><td><em>du</em> pain</td><td><em>de la</em> confiture</td><td><em>de l'</em>eau</td><td><em>des</em> légumes</td></tr>
</table></div>
<p>English says "some", "any", or nothing: <em>Je bois <b>de l'</b>eau</em> (I drink water / some water). <em>Tu veux <b>du</b> pain ?</em> (Do you want any bread?)</p>` },
        { h: "How it works", html: `<p>French gives you three ways to present a noun:</p>
<ul>
<li><em>le café</em>: coffee as a whole category, or a known coffee</li>
<li><em>un café</em>: one countable unit (a cup of coffee)</li>
<li><em>du café</em>: an unspecified amount of the substance</li>
</ul>
<p>The partitive is literally <em>de</em> ("of") + the definite article: <em>de + le = du</em>, <em>de + la</em>, <em>de + l'</em>, <em>de + les = des</em>. <em>du pain</em> means "some of the bread that exists": a part of the whole. That is where the name comes from.</p>
<p>Because French needs a determiner before the noun, it cannot say "I eat bread" with nothing in front of it. The partitive fills the slot for things you do not count: food, drink, materials, and abstract qualities (<em>du courage</em>, <em>de la patience</em>). <em>des</em> is the plural for both <em>un</em> and <em>du</em>.</p>` },
        { h: "When it shrinks to de", html: `<p><b>After a negative</b>, <em>du, de la, de l', des</em> (and <em>un, une</em>) become <em>de</em> / <em>d'</em>. Zero quantity needs no article:</p>
<ul>
<li><em>Je bois du café</em> → <em>Je ne bois pas <b>de</b> café.</em></li>
<li><em>Il y a de l'eau</em> → <em>Il n'y a pas <b>d'</b>eau.</em></li>
</ul>
<p>Exception: with <em>être</em> the article stays, because you are denying what something is, not a quantity: <em>Ce n'est pas <b>du</b> vin, c'est du jus.</em></p>
<p><b>After an expression of quantity</b>, use plain <em>de</em>: <em>beaucoup <b>de</b> pain, un peu <b>de</b> sucre, trop <b>de</b> sel, assez <b>d'</b>argent, un kilo <b>de</b> pommes, une tasse <b>de</b> thé</em>. The quantity word already measures the amount. Two common exceptions keep <em>des</em>: <em>la plupart des</em>, <em>bien des</em>.</p>` },
        { h: "Liking verbs take le/la", html: `<p><em>aimer, adorer, préférer, détester</em> talk about a thing in general, so they take <em>le/la/les</em>, not the partitive: <em>J'aime <b>le</b> chocolat</em>, but <em>Je mange <b>du</b> chocolat</em>.</p>
<p>The definite article does not change after a negative: <em>Je n'aime pas <b>le</b> fromage.</em> Compare <em>Je ne mange pas <b>de</b> fromage.</em></p>` }
      ],

    {

      summary: "mon/ma/mes etc., agreement with the thing owned, and son vs sa",

      theory: [
        { h: "The forms", html: `<div class="tbl"><table>
<tr><th>owner</th><th>masc. sing.</th><th>fem. sing.</th><th>plural</th></tr>
<tr><td>my</td><td><em>mon</em></td><td><em>ma</em></td><td><em>mes</em></td></tr>
<tr><td>your (<em>tu</em>)</td><td><em>ton</em></td><td><em>ta</em></td><td><em>tes</em></td></tr>
<tr><td>his / her / its</td><td><em>son</em></td><td><em>sa</em></td><td><em>ses</em></td></tr>
<tr><td>our</td><td><em>notre</em></td><td><em>notre</em></td><td><em>nos</em></td></tr>
<tr><td>your (<em>vous</em>)</td><td><em>votre</em></td><td><em>votre</em></td><td><em>vos</em></td></tr>
<tr><td>their</td><td><em>leur</em></td><td><em>leur</em></td><td><em>leurs</em></td></tr>
</table></div>
<p>They replace the article: <em>le livre</em> → <em>mon livre</em>, never <em>le mon livre</em>.</p>` },
        { h: "How it works", html: `<p>A possessive is a determiner, so like <em>le/la/les</em> it agrees with the noun it introduces. Each form carries two pieces of information:</p>
<ul>
<li>the <b>start</b> shows the owner: <em>m-</em> me, <em>t-</em> you, <em>s-</em> him/her/it, <em>n-</em> us, <em>v-</em> you, <em>leur</em> them</li>
<li>the <b>ending</b> shows the gender and number of the thing owned: <em>-on</em> masculine, <em>-a</em> feminine, <em>-es</em> plural</li>
</ul>
<p>English "his/her" shows the owner's sex. French does not: <em>son père</em> is "his father" or "her father", <em>sa mère</em> is "his mother" or "her mother". The choice depends only on <em>père</em> (m) and <em>mère</em> (f).</p>
<p>Before a feminine noun starting with a vowel or h muet, <em>ma, ta, sa</em> become <em>mon, ton, son</em>: <em>mon amie, ton école, son histoire</em>. This avoids two vowels colliding, the same reason as <em>l'</em> and <em>cet</em>. Older French elided instead (<em>m'amie</em>). Before an h aspiré the feminine form stays: <em>sa honte</em>.</p>` },
        { h: "His or her? Son or sa?", html: `<p>Context usually makes the owner clear. When it does not, add <em>à lui</em> (his) or <em>à elle</em> (hers) after the noun:</p>
<ul>
<li><em>C'est son livre <b>à elle</b>.</em> (It's her book.)</li>
<li><em>C'est sa voiture <b>à lui</b>.</em> (It's his car.)</li>
</ul>
<p>For several owners, use <em>leur</em> (one thing) or <em>leurs</em> (several things): <em>Les enfants aiment <b>leur</b> chien. Ils aiment <b>leurs</b> parents.</em></p>` },
        { h: "Body parts: le, la, les", html: `<p>When it is obvious whose body part it is, French uses the definite article, often with a reflexive pronoun showing the owner:</p>
<ul>
<li><em>Il se brosse <b>les</b> dents.</em> (He brushes his teeth.)</li>
<li><em>J'ai mal à <b>la</b> tête.</em> (My head hurts.)</li>
<li><em>Elle ferme <b>les</b> yeux.</em> (She closes her eyes.)</li>
</ul>
<p>The possessive appears when the body part is the subject: <em>Mes mains sont froides.</em></p>` }
      ],
      examples: [

        ["Julie aime son père.", "Julie loves her father."],
        ["Je te présente mon amie Sophie.", "This is my friend Sophie."],
        ["C'est son vélo à elle.", "It's her bike."],

        `Using <em>ma</em> before a vowel: not <em>ma amie</em> but <em><b>mon</b> amie</em>.`,
        `Using a possessive with body parts: not <em>Il se brosse ses dents</em> but <em>Il se brosse <b>les</b> dents</em>.`,
        `Using <em>son</em> for several owners: "their dog" is <em><b>leur</b> chien</em>.`
      ],
      activities: [
        { t: "mc", q: "(my) ___ frère s'appelle Paul.", o: ["Mon", "Ma", "Mes"], a: 0, x: "<em>frère</em> is masculine singular: <em>mon frère</em>." },
        { t: "sort", q: "mon, ma or mes?", cats: ["mon", "ma", "mes"], items: [["livre", 0], ["école", 0], ["histoire", 0], ["voiture", 1], ["maison", 1], ["table", 1], ["amis", 2], ["parents", 2]], x: "<em>école</em> and <em>histoire</em> are feminine but start with a vowel or h muet, so they take <em>mon</em>." },
        { t: "fill", q: "Julie aime ___ père.", h: "her", a: ["son"], x: "<em>père</em> is masculine, so <em>son</em>, even though the owner is a woman." },

        { t: "match", q: "Owner + thing: match the correct phrase.", pairs: [["nous + voiture", "notre voiture"], ["vous + amis", "vos amis"], ["ils + maison", "leur maison"], ["ils + enfants", "leurs enfants"], ["tu + amie", "ton amie"]], x: "<em>notre/votre/leur</em> do not change for gender; <em>-s</em> forms are for plural things; <em>ton</em> before a vowel." },

    {
      id: "u1-demonstratives",
      title: "Demonstrative determiners",
      summary: "ce, cet, cette, ces, the -ci/-là suffixes, and a first look at ça",
      minutes: 11,
      goals: [
        "Choose between ce, cet, cette and ces",
        "Use -ci and -là to contrast this and that",
        "Use ça, cela and ceci for an unnamed thing"
      ],
      theory: [
        { h: "The forms", html: `<div class="tbl"><table>
<tr><th>masculine</th><th>masc. before vowel / h muet</th><th>feminine</th><th>plural</th></tr>
<tr><td><em>ce</em> livre</td><td><em>cet</em> ami, <em>cet</em> hôtel</td><td><em>cette</em> table</td><td><em>ces</em> livres, <em>ces</em> tables</td></tr>
</table></div>
<p>They replace the article, like possessives. There is one plural for both genders; <em>cets</em> and <em>cettes</em> do not exist. Before an h aspiré, use <em>ce</em>: <em>ce héros</em>.</p>` },
        { h: "How it works", html: `<p>A demonstrative is a pointing determiner: it picks out a particular thing in the situation. Its forms come from Latin <em>ecce</em> ("look!") combined with a Latin pointing word.</p>
<p>French does not build distance into the word. <em>ce livre</em> means "this book" or "that book", and context decides. English always forces a choice; French only marks it when you need a contrast.</p>
<p><em>cet</em> exists for the same reason as <em>l'</em> and <em>mon amie</em>: to avoid two vowel sounds colliding. <em>ce ami</em> would clash, so the masculine gets a <em>t</em>. As a result <em>cet</em> and <em>cette</em> sound identical, and only the spelling shows the gender: <em>cet homme</em> (m), <em>cette femme</em> (f).</p>` },
        { h: "-ci and -là", html: `<p>To insist on "this" vs "that", add <em>-ci</em> (here) or <em>-là</em> (there) to the noun with a hyphen:</p>
<ul>
<li><em>Je préfère cette robe-<b>ci</b>, pas cette robe-<b>là</b>.</em> (I prefer this dress, not that one.)</li>
</ul>
<p>In everyday speech, <em>-là</em> is far more common than <em>-ci</em> and often does not mean distance at all: <em>ce jour-là</em> (that day), <em>à ce moment-là</em> (at that moment). With time words, <em>ce</em> alone means the current one: <em>ce matin, ce soir, cette année</em>.</p>` },
        { h: "Ça, cela, ceci", html: `<p>When there is no noun, French uses neuter pronouns that never change form:</p>
<ul>
<li><em>ça</em>: the everyday spoken form. <em>J'aime <b>ça</b>. Ça va ?</em></li>
<li><em>cela</em>: the same meaning in writing and formal speech. <em>Cela dépend.</em></li>
<li><em>ceci</em>: "this", mainly used to contrast with <em>cela</em>. <em>Prends ceci, pas cela.</em></li>
</ul>
<p><em>ce, cet, cette, ces</em> must be followed by a noun; <em>ça</em> stands alone. The pronouns that replace a specific noun (<em>celui, celle</em>) come later (see Lesson: Demonstrative pronouns, B1).</p>` }
      ],
      examples: [
        ["Ce livre est intéressant.", "This book is interesting."],
        ["Cet hôtel est trop cher.", "That hotel is too expensive."],
        ["J'aime beaucoup ces chansons.", "I really like these songs."],
        ["Tu préfères ce pull-ci ou ce pull-là ?", "Do you prefer this jumper or that one?"],
        ["Ça ne fait rien.", "It doesn't matter."]
      ],
      pitfalls: [
        `Using <em>ce</em> before a vowel: not <em>ce ami</em> but <em><b>cet</b> ami</em>.`,
        `Inventing a feminine plural: <em>cettes</em> does not exist. Use <em><b>ces</b> filles</em>.`,
        `Writing <em>cette</em> before a masculine noun because it sounds like <em>cet</em>: not <em>cette homme</em> but <em><b>cet</b> homme</em>.`,
        `Using <em>ce</em> on its own for "that": not <em>J'aime ce</em> but <em>J'aime <b>ça</b></em>.`
      ],
      activities: [
        { t: "mc", q: "___ livre est intéressant.", o: ["Ce", "Cet", "Cette"], a: 0, x: "<em>livre</em> is masculine and starts with a consonant: <em>ce livre</em>." },
        { t: "sort", q: "ce, cet or cette?", cats: ["ce", "cet", "cette"], items: [["garçon", 0], ["héros", 0], ["homme", 1], ["ami", 1], ["arbre", 1], ["fille", 2], ["maison", 2], ["école", 2]], x: "<em>cet</em> for masculine nouns starting with a vowel or h muet; <em>ce héros</em> because of the h aspiré; feminine always takes <em>cette</em>, even <em>cette école</em>." },
        { t: "fill", q: "J'aime ___ chansons.", h: "these", a: ["ces"], x: "One plural for both genders: <em>ces chansons</em>." },
        { t: "fill", q: "___ hôtel est très cher.", h: "this", a: ["Cet"], x: "<em>hôtel</em> is masculine with an h muet: <em>cet hôtel</em>." },
        { t: "mc", q: "Which is correct?", o: ["ces filles", "cettes filles", "cette filles"], a: 0, x: "<em>cettes</em> does not exist; the plural is always <em>ces</em>." },
        { t: "match", q: "Match the English to the French.", pairs: [["this book (here)", "ce livre-ci"], ["that book (there)", "ce livre-là"], ["this morning", "ce matin"], ["at that moment", "à ce moment-là"], ["I like that.", "J'aime ça."]], x: "<em>-ci</em>/<em>-là</em> add contrast; <em>ce</em> + time word means the current one; <em>ça</em> stands alone." },
        { t: "mc", q: "Which word is the formal written equivalent of ça?", o: ["cela", "ce", "cet"], a: 0, x: "<em>ça</em> is the everyday form of <em>cela</em>. <em>ce</em> and <em>cet</em> need a noun after them." },
        { t: "order", q: "This car is fast.", w: ["Cette", "voiture", "est", "rapide"], x: "<em>voiture</em> is feminine: <em>cette voiture</em>." },
        { t: "spot", q: "Tap the word that's wrong.", w: ["Je", "connais", "cette", "homme"], a: 2, fix: "cet", x: "<em>homme</em> is masculine; <em>cet</em> and <em>cette</em> sound the same, but the spelling must show the gender: <em>cet homme</em>." },
        { t: "spot", q: "Tap the word that's wrong.", w: ["Je", "n'", "aime", "pas", "ce"], a: 4, fix: "ça", x: "<em>ce</em> needs a noun after it. Standing alone, \"that\" is <em>ça</em>: <em>Je n'aime pas ça.</em>" }
      ],
      sources: [
        { t: "Ce, cet, cette, ces — Lawless French", u: "https://www.lawlessfrench.com/grammar/ce-cet-cette-ces/" },
        { t: "Indefinite demonstrative pronouns — Lawless French", u: "https://www.lawlessfrench.com/grammar/indefinite-demonstrative-pronouns/" }
      ]
    }
  ]

COURSE.push({
  id: "u2",
  level: "A1",
  title: "The present tense",
  intro: "French verbs change their ending to match the subject. This unit gives you the pronouns, the three verb groups and the present tense of regular, spelling-change, irregular and pronominal verbs, which is the base every later tense is built on.",
  lessons: [

    // ───────────────────────── 1. Subject pronouns ─────────────────────────
    {
      id: "u2-pronouns",
      title: "Subject pronouns & verb groups",
      summary: "je, tu, il, on, vous... what conjugation is, and the three verb groups",
      minutes: 12,
      goals: [
        "Choose the right subject pronoun, including tu or vous and on",
        "Explain why a French verb changes its ending with the subject",
        "Refer to things with il or elle according to their gender",
        "Sort an infinitive into the 1st, 2nd or 3rd group"
      ],
      theory: [
        { h: "The pronouns", html: `
<p>The <b>sujet</b> (subject) is who or what does the action. These are the subject pronouns:</p>
<div class="tbl"><table>
<tr><th></th><th>singular</th><th>plural</th></tr>
<tr><td>1st person</td><td><em>je</em> (I)</td><td><em>nous</em> (we)</td></tr>
<tr><td>2nd person</td><td><em>tu</em> (you, one person, informal)</td><td><em>vous</em> (you, plural or formal)</td></tr>
<tr><td>3rd person</td><td><em>il</em> (he, it), <em>elle</em> (she, it), <em>on</em> (we, one, people)</td><td><em>ils</em> (they, masc. or mixed), <em>elles</em> (they, all fem.)</td></tr>
</table></div>
<p><em>Je</em> becomes <em>j'</em> before a vowel or a mute h: <em><b>j'</b>aime</em>, <em><b>j'</b>habite</em>. This dropping of a vowel is called <b>élision</b>.</p>` },
        { h: "How it works", html: `
<p><b>Conjugaison</b> (conjugation) means changing a verb's ending to match its subject. English barely does this (<em>I speak</em>, <em>she speaks</em>). French marks person and number on almost every verb: <em>je parl<b>e</b></em>, <em>nous parl<b>ons</b></em>, <em>vous parl<b>ez</b></em>. The endings come from Latin, which marked every person on the verb: Latin <em>cantas</em> gave <em>tu chantes</em>, <em>cantant</em> gave <em>ils chantent</em>.</p>
<p>Over the centuries many final sounds stopped being pronounced, so <em>parle</em>, <em>parles</em> and <em>parlent</em> now sound identical. Latin could drop the pronoun because the ending told you the person. French cannot, so the pronoun is compulsory: <em>Je parle</em>, never just <em>Parle</em> for "I speak".</p>
<p>Gender works the same way for things. Every noun is masculine or feminine, so "it" is <em>il</em> or <em>elle</em>: <em>la voiture</em> → <em><b>elle</b> est rouge</em>; <em>le livre</em> → <em><b>il</b> est lourd</em>. A group with at least one masculine member is <em>ils</em>: only an all-female group is <em>elles</em>.</p>` },
        { h: "tu, vous and on", html: `
<ul>
<li><em>tu</em>: one person you know well (family, friends, children, pets) or a peer in a relaxed setting.</li>
<li><em>vous</em>: one person you address formally (a stranger, a shop assistant, a manager), <b>and</b> any group of two or more, formal or not. It always takes the plural verb form: <em>vous parlez</em>.</li>
<li><em>on</em>: in everyday speech it usually means "we" (<em>On mange ?</em> = Shall we eat?). It also means "one / people / they" in general (<em>Ici, on parle français</em>). Grammatically it is always 3rd person singular: <em>on parl<b>e</b></em>, like <em>il</em>. In speech it largely replaces <em>nous</em>; in formal writing <em>nous</em> is preferred.</li>
</ul>` },
        { h: "The three verb groups", html: `
<p>A verb is listed in the dictionary in its <b>infinitif</b> (infinitive): <em>parler</em> (to speak). Traditional grammar sorts verbs into three groups:</p>
<ul>
<li><b>1er groupe</b>: infinitive in <em>-er</em> (<em>parler</em>, <em>aimer</em>). About 90% of verbs, all regular in the present except <em>aller</em>. New verbs join it: <em>tweeter</em>.</li>
<li><b>2e groupe</b>: infinitive in <em>-ir</em> with <em>-iss-</em> in the plural (<em>nous fin<b>iss</b>ons</em>, <em>fin<b>iss</b>ant</em>).</li>
<li><b>3e groupe</b>: everything else: <em>-ir</em> verbs without <em>-iss-</em> (<em>partir</em>), <em>-oir</em> (<em>voir</em>), <em>-re</em> (<em>prendre</em>, <em>attendre</em>) and <em>aller</em>.</li>
</ul>
<p>The 3rd group is a mixed bag, so it contains small regular patterns of its own, covered in later lessons.</p>` }

<p>Remove <em>-er</em> from the infinitive to get the <b>radical</b> (stem), then add the <b>terminaison</b> (ending):</p>
<div class="tbl"><table>
<tr><th>parler</th><th>aimer</th></tr>
<tr><td><em>je parl<span class="end">e</span></em></td><td><em>j'aim<span class="end">e</span></em></td></tr>
<tr><td><em>tu parl<span class="end">es</span></em></td><td><em>tu aim<span class="end">es</span></em></td></tr>
<tr><td><em>il / elle / on parl<span class="end">e</span></em></td><td><em>il / elle / on aim<span class="end">e</span></em></td></tr>
<tr><td><em>nous parl<span class="end">ons</span></em></td><td><em>nous aim<span class="end">ons</span></em></td></tr>
<tr><td><em>vous parl<span class="end">ez</span></em></td><td><em>vous aim<span class="end">ez</span></em></td></tr>
<tr><td><em>ils / elles parl<span class="end">ent</span></em></td><td><em>ils / elles aim<span class="end">ent</span></em></td></tr>
</table></div>
<p>Before a vowel or mute h, <em>je</em> becomes <em>j'</em>: <em>j'écoute</em>, <em>j'habite</em>.</p>` },
        { h: "How it works", html: `
<p>The spelling keeps endings that speech has lost. <em>-e</em>, <em>-es</em> and <em>-ent</em> are all silent, so four forms sound exactly the same: <em>je parle</em>, <em>tu parles</em>, <em>il parle</em>, <em>ils parlent</em> are all "parl". Only <em>nous parl<b>ons</b></em> and <em>vous parl<b>ez</b></em> have an ending you can hear.</p>
<p>This is why the pronoun carries the information in speech. With a vowel-initial verb, the plural is still audible thanks to <b>liaison</b>: <em>il aime</em> vs <em>ils_aiment</em> (a z sound links them).</p>
<p>The <em>-ent</em> of <em>ils parlent</em> is a spelling marker of the plural, never pronounced as a syllable. Its t is heard only in liaison (<em>parlent-ils ?</em>). Think of it like the silent <em>-s</em> on plural nouns.</p>` },
        { h: "One tense, three meanings", html: `
<p>French has one present tense where English has three:</p>
<p><em>Je travaille</em> = I work / I'm working / I do work.</p>
<p>Never add <em>être</em> to make "I am working": <em>je suis travaille</em> is wrong. When you want to stress that something is in progress right now, use <em>être en train de</em> + infinitive: <em>Je suis <b>en train de</b> travailler</em> (I'm busy working).</p>
<p><b>Depuis + present.</b> For an action that started in the past and is still going on, French uses the present, because the action is still true now. English uses "have been": <em>J'habite ici <b>depuis</b> trois ans</em> = I've been living here for three years. <em>Depuis</em> + a date or moment means "since": <em>depuis 2020</em>, <em>depuis lundi</em>.</p>` }

    {
      id: "u2-er-spelling",
      title: "Spelling-change -er verbs",
      summary: "mangeons, commençons, achète, appelle, paie: spelling that follows sound",
      minutes: 15,
      goals: [
        "Write the nous form of -ger and -cer verbs correctly",

        "Handle -yer verbs: envoie, nettoie, paie or paye",

      theory: [
        { h: "-ger and -cer", html: `
<p>Before <em>a</em>, <em>o</em> or <em>u</em>, the letters g and c are "hard" (g as in <em>gare</em>, c as in <em>café</em>). The <em>-ons</em> ending would harden them, so the spelling changes in the <em>nous</em> form only:</p>
<ul>
<li><em>-ger</em>: add e. <em>nous mang<b>e</b>ons</em>, <em>nous nag<b>e</b>ons</em>, <em>nous voyag<b>e</b>ons</em>.</li>
<li><em>-cer</em>: c becomes ç. <em>nous commen<b>ç</b>ons</em>, <em>nous pla<b>ç</b>ons</em>.</li>
</ul>
<p>The other forms end in e (<em>-e, -es, -ez, -ent</em>), which keeps g and c soft anyway.</p>` },
        { h: "How it works", html: `
<p>In <em>acheter</em>, the first e is a mute e (the "uh" sound, often dropped). In the forms ending in silent <em>-e, -es, -ent</em>, the stem e would be followed by another mute e. French avoids two mute e's in a row, so the stem e becomes an open "è" sound, and the spelling shows it in one of two ways:</p>
<ul>
<li><b>a grave accent</b>: <em>j'ach<b>è</b>te</em>, <em>il l<b>è</b>ve</em>, <em>elle m<b>è</b>ne</em>, <em>il g<b>è</b>le</em>;</li>
<li><b>a double consonant</b>: <em>j'appe<b>ll</b>e</em>, <em>je je<b>tt</b>e</em>.</li>
</ul>
<p>With <em>nous</em> and <em>vous</em>, the ending <em>-ons</em> / <em>-ez</em> is a full vowel, so the stem keeps its plain e: <em>nous achetons</em>, <em>vous appelez</em>. The changed forms (je, tu, il, ils) make a "boot" shape in the table.</p>
<div class="tbl"><table>
<tr><th>acheter</th><th>appeler</th><th>préférer</th></tr>
<tr><td><em>j'ach<b>è</b>te</em></td><td><em>j'appe<b>ll</b>e</em></td><td><em>je préf<b>è</b>re</em></td></tr>
<tr><td><em>tu ach<b>è</b>tes</em></td><td><em>tu appe<b>ll</b>es</em></td><td><em>tu préf<b>è</b>res</em></td></tr>
<tr><td><em>il ach<b>è</b>te</em></td><td><em>il appe<b>ll</b>e</em></td><td><em>il préf<b>è</b>re</em></td></tr>
<tr><td><em>nous achetons</em></td><td><em>nous appelons</em></td><td><em>nous préférons</em></td></tr>
<tr><td><em>vous achetez</em></td><td><em>vous appelez</em></td><td><em>vous préférez</em></td></tr>
<tr><td><em>ils ach<b>è</b>tent</em></td><td><em>ils appe<b>ll</b>ent</em></td><td><em>ils préf<b>è</b>rent</em></td></tr>
</table></div>
<p><b>é → è</b> (<em>préférer</em>, <em>espérer</em>, <em>répéter</em>): the closed é opens to è before a final mute syllable, by the same logic.</p>` },
        { h: "Which -eler / -eter verbs double?", html: `
<p>Traditionally you must learn each verb. <em>Appeler</em>, <em>jeter</em> and their families (<em>rappeler</em>, <em>rejeter</em>) double; <em>acheter</em>, <em>geler</em>, <em>peler</em>, <em>modeler</em> take è.</p>
<p>The 1990 spelling reform (<em>rectifications de l'orthographe</em>) simplifies this: every <em>-eler</em> / <em>-eter</em> verb may take è, <b>except</b> <em>appeler</em>, <em>jeter</em> and their derivatives, which keep the double consonant. So <em>il renouvelle</em> and <em>il renouvèle</em> are both accepted (the OQLF accepts either spelling).</p>
<p>The reform also allows è in the future and conditional of é verbs: traditional <em>je préférerai</em>, reformed <em>je préfèrerai</em>, matching the pronunciation.</p>` },
        { h: "-yer verbs", html: `
<p>The y stands for a "y" sound linking two vowels (<em>nous envo<b>y</b>ons</em>). Before a silent e there is no following vowel to link to, so y becomes i:</p>
<ul>
<li><em>-oyer</em> and <em>-uyer</em>: the change is compulsory. <em>j'envo<b>i</b>e</em>, <em>il netto<b>i</b>e</em>, <em>ils s'ennu<b>i</b>ent</em>; but <em>nous envoyons</em>.</li>
<li><em>-ayer</em> (<em>payer</em>, <em>essayer</em>): optional. <em>je pa<b>i</b>e</em> (said "pè") and <em>je pa<b>y</b>e</em> (said "pèy") are both correct. <em>Nous payons</em> never changes.</li>
</ul>` }
      ],

<tr><td><em>je fin<span class="end">is</span></em></td><td><em>je par<span class="end">s</span></em></td><td><em>j'attend<span class="end">s</span></em></td></tr>
<tr><td><em>tu fin<span class="end">is</span></em></td><td><em>tu par<span class="end">s</span></em></td><td><em>tu attend<span class="end">s</span></em></td></tr>
<tr><td><em>il fin<span class="end">it</span></em></td><td><em>il par<span class="end">t</span></em></td><td><em>il attend</em></td></tr>
<tr><td><em>nous fin<span class="end">issons</span></em></td><td><em>nous part<span class="end">ons</span></em></td><td><em>nous attend<span class="end">ons</span></em></td></tr>
<tr><td><em>vous fin<span class="end">issez</span></em></td><td><em>vous part<span class="end">ez</span></em></td><td><em>vous attend<span class="end">ez</span></em></td></tr>
<tr><td><em>ils fin<span class="end">issent</span></em></td><td><em>ils part<span class="end">ent</span></em></td><td><em>ils attend<span class="end">ent</span></em></td></tr>
</table></div>
<ul>
<li>Like <em>finir</em>: <em>choisir</em>, <em>réussir</em>, <em>réfléchir</em>, <em>grandir</em>, <em>rougir</em>, <em>obéir</em>.</li>
<li>Like <em>partir</em>: <em>dormir</em> (<em>je dors</em>), <em>sortir</em> (<em>je sors</em>), <em>servir</em> (<em>je sers</em>), <em>sentir</em>, <em>mentir</em>.</li>
<li>Like <em>attendre</em>: <em>vendre</em>, <em>répondre</em>, <em>entendre</em>, <em>perdre</em>, <em>descendre</em>, <em>rendre</em>.</li>
</ul>` },
        { h: "How it works", html: `
<p>All three patterns share the singular endings <em>-s, -s, -t</em>, all silent. The difference lies in the stem.</p>
<ul>
<li><b>finir</b>: the plural adds <em>-iss-</em>. It descends from a Latin suffix <em>-isc-</em> / <em>-esc-</em> that once meant "begin to" (as in <em>florescere</em>, to start flowering). It no longer adds any meaning; in the present you see it only in the plural: <em>il finit</em> / <em>ils fin<b>iss</b>ent</em>.</li>
<li><b>partir</b>: the stem ends in a consonant (<em>part-</em>, <em>dorm-</em>, <em>sort-</em>). In the singular that consonant would be the last sound, so it was lost: <em>je pars</em>, <em>il dort</em>. In the plural a vowel follows (<em>-ons, -ez</em>, and historically <em>-ent</em>), so the consonant was kept and is still heard: <em>ils dor<b>m</b>ent</em>.</li>
<li><b>attendre</b>: the stem keeps its d throughout. With <em>il</em>, the stem's d already sits where the t would go, so no ending is added: <em>il attend</em>, <em>elle vend</em>, <em>il répond</em>. The d is silent, except in liaison: <em>attend-il ?</em> sounds like "attan-til".</li>
</ul>
<p>In all three, you can hear singular vs plural: <em>il finit / ils finissent</em>, <em>il part / ils partent</em>, <em>il attend / ils attendent</em>.</p>
<p>Traditional grammar puts <em>partir</em> and <em>attendre</em> in the 3e groupe even though they follow regular patterns.</p>` },
        { h: "Which -ir pattern?", html: `
<p>The infinitive alone does not tell you. Clues:</p>
<ul>
<li>The <em>partir</em> pattern is a small, closed set: mostly <em>dormir, partir, sortir, servir, sentir, mentir</em> and their compounds (<em>s'endormir</em>, <em>repartir</em>, <em>ressentir</em>).</li>
<li>Most other <em>-ir</em> verbs are <em>finir</em>-type, about 300 of them, including many made from adjectives: <em>rouge</em> → <em>rougir</em>, <em>grand</em> → <em>grandir</em>, <em>maigre</em> → <em>maigrir</em>. Note that some <em>-tir</em> verbs are <em>finir</em>-type: <em>ralentir</em> (<em>nous ralentissons</em>).</li>
<li>A dictionary or conjugator shows the <em>nous</em> form or the present participle: <em>-issant</em> means 2e groupe.</li>
<li>A few <em>-ir</em> verbs (<em>ouvrir</em>, <em>offrir</em>) take <em>-er</em> endings: <em>j'ouvre</em>. They come in a later lesson.</li>
</ul>` }
      ],
      examples: [
        ["Je finis à cinq heures.", "I finish at five."],
        ["Nous choisissons un film.", "We're choosing a film."],
        ["Tu pars quand ?", "When are you leaving?"],
        ["Le bébé dort.", "The baby is sleeping."],
        ["Il attend le bus.", "He's waiting for the bus."],
        ["Vous répondez au téléphone ?", "Are you answering the phone?"]
      ],
      pitfalls: [
        `Adding <em>-iss-</em> to <em>partir</em>-type verbs: <em>ils partent</em>, never <em>ils partissent</em>.`,
        `Keeping the stem consonant in the singular: <em>je dors</em>, <em>tu sors</em>, never <em>je dorms</em>.`,
        `Adding <em>-t</em> to <em>-re</em> verbs: <em>il attend</em>, never <em>il attendt</em>.`,
        `Dropping <em>-iss-</em> from the plural of <em>finir</em>: <em>nous finissons</em>, never <em>nous finons</em>.`
      ],
      activities: [
        { t: "fill", q: "Nous ___ nos devoirs.", h: "finir", a: ["finissons"], x: "<em>Finir</em> adds <em>-iss-</em> in the plural: <em>nous finissons</em>." },
        { t: "match", q: "Match each infinitive to its il form.", pairs: [["finir", "il finit"], ["partir", "il part"], ["attendre", "il attend"], ["dormir", "il dort"], ["choisir", "il choisit"]], x: "<em>Finir</em>-type: <em>-it</em>. <em>Partir</em>-type: drop the stem consonant, add <em>-t</em>. <em>-re</em>: bare stem." },
        { t: "mc", q: "Il ___ le bus.", o: ["attend", "attendt", "attende"], a: 0, x: "Regular <em>-re</em> verbs take no ending with <em>il</em>: <em>il attend</em>." },
        { t: "sort", q: "finir pattern or partir pattern?", cats: ["like finir", "like partir"], items: [["choisir", 0], ["dormir", 1], ["réussir", 0], ["sortir", 1], ["grandir", 0], ["servir", 1], ["rougir", 0], ["mentir", 1]], x: "The <em>partir</em> group is small: <em>dormir, partir, sortir, servir, sentir, mentir</em>. Most other <em>-ir</em> verbs follow <em>finir</em>." },
        { t: "fill", q: "Je ___ à huit heures.", h: "partir", a: ["pars"], x: "Drop the t of the stem in the singular: <em>je pars</em>." },
        { t: "spot", q: "Tap the word that's wrong.", w: ["Ils", "partissent", "demain"], a: 1, fix: "partent", x: "<em>Partir</em> has no <em>-iss-</em>: <em>ils partent</em>." },
        { t: "spot", q: "Tap the word that's wrong.", w: ["Tu", "dorms", "beaucoup"], a: 1, fix: "dors", x: "The m of <em>dormir</em> drops in the singular: <em>tu dors</em>." },

        { t: "order", q: "They're choosing a cake.", w: ["Ils", "choisissent", "un", "gâteau"], x: "<em>Choisir</em> is <em>finir</em>-type: <em>ils choisissent</em>." }

    // ───────────────────────── 5. The big four ─────────────────────────
    {
      id: "u2-big4",
      title: "être, avoir, aller, faire",
      summary: "The four most common verbs, why they're irregular, and their key expressions",
      minutes: 15,
      goals: [
        "Conjugate être, avoir, aller and faire in the present",
        "Explain why the most frequent verbs are the most irregular",
        "Use avoir for hunger, cold and age, and faire for weather",
        "Use il y a and ça va / je vais bien"
      ],
      theory: [
        { h: "The four verbs", html: `
<div class="tbl"><table>
<tr><th>être (be)</th><th>avoir (have)</th><th>aller (go)</th><th>faire (do, make)</th></tr>
<tr><td><em>je suis</em></td><td><em>j'ai</em></td><td><em>je vais</em></td><td><em>je fais</em></td></tr>
<tr><td><em>tu es</em></td><td><em>tu as</em></td><td><em>tu vas</em></td><td><em>tu fais</em></td></tr>
<tr><td><em>il est</em></td><td><em>il a</em></td><td><em>il va</em></td><td><em>il fait</em></td></tr>
<tr><td><em>nous sommes</em></td><td><em>nous avons</em></td><td><em>nous allons</em></td><td><em>nous faisons</em></td></tr>
<tr><td><em>vous <b>êtes</b></em></td><td><em>vous avez</em></td><td><em>vous allez</em></td><td><em>vous <b>faites</b></em></td></tr>
<tr><td><em>ils s<b>ont</b></em></td><td><em>ils <b>ont</b></em></td><td><em>ils v<b>ont</b></em></td><td><em>ils f<b>ont</b></em></td></tr>
</table></div>
<p>In <em>nous faisons</em>, the <em>ai</em> is said like the e in <em>le</em>.</p>` },
        { h: "How it works", html: `
<p>Regular patterns spread by analogy: speakers reshape rare verbs to match common patterns. Very frequent forms are heard and said so often that they are memorised whole, so they resist this levelling and keep old irregular shapes. That is why "be", "have" and "go" are irregular in English too.</p>
<p><em>Aller</em> goes further: its forms come from different Latin verbs stitched together. <em>Vais, vas, va, vont</em> come from <em>vadere</em>; the future <em>ira</em> comes from <em>ire</em>; the origin of <em>allons, allez</em> is debated.</p>
<p>The irregularity still has patterns:</p>
<ul>
<li>All four have <em>ils</em> forms in <b>-ont</b>: <em>sont, ont, vont, font</em>.</li>
<li>Only three common verbs (and a few compounds, such as <em>refaire</em>, <em>redire</em>) have <em>vous</em> forms in <b>-tes</b> instead of <em>-ez</em>: <em>vous êtes</em>, <em>vous faites</em>, <em>vous dites</em> (from <em>dire</em>). These continue the Latin <em>-tis</em> ending directly.</li>
<li>Listen for liaison: <em>ils_ont</em> (z sound) means "they have"; <em>ils sont</em> (s sound) means "they are".</li>
</ul>` },
        { h: "Key expressions", html: `
<p>French uses <em>avoir</em> where English uses "be" for many physical states, because they are treated as things you have:</p>
<ul>
<li><em>avoir faim / soif</em> (be hungry / thirsty), <em>avoir chaud / froid</em> (be hot / cold), <em>avoir peur</em> (be afraid), <em>avoir raison / tort</em> (be right / wrong).</li>
<li>Age: <em>J'<b>ai</b> trente ans</em> (I am thirty). <em>Ans</em> is compulsory.</li>
</ul>
<p>Weather uses impersonal <em>il fait</em>: <em>il fait beau</em>, <em>il fait froid</em>, <em>il fait chaud</em>. Here <em>il</em> refers to nothing, like English "it's raining".</p>
<p><em>Il y a</em> = there is / there are, for singular and plural alike: <em>il y a deux cafés</em>.</p>
<p>Health uses <em>aller</em>: <em>Ça va ? Je vais bien, merci.</em> <em>Aller</em> + infinitive also forms the near future (see Lesson: Near future, recent past &amp; time words).</p>` }
      ],
      examples: [
        ["Nous sommes en retard.", "We're late."],
        ["J'ai faim et j'ai froid.", "I'm hungry and I'm cold."],
        ["Elle a vingt-cinq ans.", "She's twenty-five."],
        ["Il fait beau aujourd'hui.", "The weather's lovely today."],
        ["Qu'est-ce que vous faites ce week-end ?", "What are you doing this weekend?"],
        ["Il y a un problème.", "There's a problem."]
      ],
      pitfalls: [
        `Using <em>être</em> for age and physical states: <em>j'<b>ai</b> trente ans</em>, <em>j'<b>ai</b> froid</em>, never <em>je suis trente</em> or <em>je suis froid</em> (which means "I'm a cold person").`,
        `Writing <em>vous faisez</em> or <em>vous disez</em>. The forms are <em>vous fai<b>tes</b></em>, <em>vous di<b>tes</b></em>, like <em>vous êtes</em>.`,
        `Mixing up <em>ils ont</em> and <em>ils sont</em>. The liaison z sound means "have": <em>ils_ont</em>.`,
        `Saying <em>c'est froid</em> about the weather. Weather takes <em>il fait</em>: <em>il fait froid</em>.`
      ],
      activities: [
        { t: "match", q: "Match the subject to the right form of être.", pairs: [["je", "suis"], ["tu", "es"], ["nous", "sommes"], ["vous", "êtes"], ["ils", "sont"]], x: "<em>Être</em> must be learnt by heart: <em>suis, es, est, sommes, êtes, sont</em>." },
        { t: "fill", q: "Nous ___ anglais.", h: "être", a: ["sommes"], x: "<em>Nous sommes</em>." },
        { t: "fill", q: "Ils ___ au cinéma.", h: "aller", a: ["vont"], x: "The big four all end in <em>-ont</em> with <em>ils</em>: <em>vont</em>." },
        { t: "mc", q: "I'm thirty.", o: ["J'ai trente ans.", "Je suis trente ans.", "J'ai trente."], a: 0, x: "Age uses <em>avoir</em> + number + <em>ans</em>." },
        { t: "mc", q: "I'm cold.", o: ["Je suis froid.", "J'ai froid.", "Je fais froid."], a: 1, x: "Feeling cold is <em>avoir froid</em>. <em>Je suis froid</em> describes a cold personality." },
        { t: "sort", q: "Which verb goes with each word?", cats: ["avoir", "être", "faire (weather)"], items: [["faim", 0], ["beau", 2], ["raison", 0], ["fatigué", 1], ["chaud (the weather)", 2], ["en retard", 1], ["peur", 0]], x: "Physical states like hunger and fear take <em>avoir</em>; adjectives like <em>fatigué</em> take <em>être</em>; weather takes <em>il fait</em>." },
        { t: "spot", q: "Tap the word that's wrong.", w: ["Vous", "faisez", "du", "sport ?"], a: 1, fix: "faites", x: "<em>Faire</em> has <em>vous faites</em>, one of only three <em>-tes</em> forms." },
        { t: "mc", q: "Ça va ? — Oui, je ___ bien.", o: ["vais", "suis", "vas"], a: 0, x: "Health uses <em>aller</em>: <em>je vais bien</em>." },
        { t: "spot", q: "Tap the word that's wrong.", w: ["Aujourd'hui,", "c'est", "très", "froid", "dehors"], a: 1, fix: "il fait", x: "Weather uses impersonal <em>il fait</em>: <em>il fait très froid</em>." },
        { t: "order", q: "There are two cafés here.", w: ["Il", "y", "a", "deux", "cafés", "ici"], alt: [["ici", "Il", "y", "a", "deux", "cafés"]], x: "<em>Il y a</em> never changes for a plural." }
      ],
      sources: [
        { t: "Top 10 French verbs — Lawless French", u: "https://www.lawlessfrench.com/grammar/top-10-verbs/" },
        { t: "Avoir expressions — Lawless French", u: "https://www.lawlessfrench.com/expressions/avoir-expressions/" }
      ]
    },

    // ───────────────────────── 6. Common irregulars ─────────────────────────
    {
      id: "u2-irregulars",
      title: "Common irregular verbs",
      summary: "pouvoir, vouloir, devoir, savoir, connaître, venir, prendre, mettre",
      minutes: 16,
      goals: [
        "Conjugate the modals pouvoir, vouloir and devoir and use them + infinitive",
        "Choose between savoir and connaître",
        "Conjugate venir, prendre and mettre and recognise their families",
        "Explain the boot pattern by stress"
      ],
      theory: [
        { h: "Modals: pouvoir, vouloir, devoir", html: `
<div class="tbl"><table>
<tr><th>pouvoir (can)</th><th>vouloir (want)</th><th>devoir (must)</th></tr>
<tr><td><em>je p<b>eu</b>x</em></td><td><em>je v<b>eu</b>x</em></td><td><em>je d<b>oi</b>s</em></td></tr>
<tr><td><em>tu p<b>eu</b>x</em></td><td><em>tu v<b>eu</b>x</em></td><td><em>tu d<b>oi</b>s</em></td></tr>
<tr><td><em>il p<b>eu</b>t</em></td><td><em>il v<b>eu</b>t</em></td><td><em>il d<b>oi</b>t</em></td></tr>
<tr><td><em>nous pouvons</em></td><td><em>nous voulons</em></td><td><em>nous devons</em></td></tr>
<tr><td><em>vous pouvez</em></td><td><em>vous voulez</em></td><td><em>vous devez</em></td></tr>
<tr><td><em>ils p<b>eu</b>vent</em></td><td><em>ils v<b>eu</b>lent</em></td><td><em>ils d<b>oi</b>vent</em></td></tr>
</table></div>
<p>A modal is followed directly by an <b>infinitif</b>, with no "to": <em>Je peux venir</em>, <em>Elle veut partir</em>, <em>Nous devons travailler</em>. Only the first verb is conjugated. Negation goes round the modal: <em>Je <b>ne</b> peux <b>pas</b> venir</em>. For a polite request, use <em>je voudrais</em> (I would like).</p>` },
        { h: "How it works", html: `
<p>Look at the shape: <em>je, tu, il</em> and <em>ils</em> share one stem; <em>nous</em> and <em>vous</em> keep the infinitive's stem. This "boot" comes from Latin stress. In the four boot forms, the stress fell on the stem, and stressed vowels changed over time (o → eu, e → oi). In <em>nous</em> and <em>vous</em>, the stress fell on the ending, so the stem vowel stayed as it was.</p>
<p>The same split explains many verbs:</p>
<ul>
<li><em>venir</em>: <em>je v<b>ie</b>ns, tu v<b>ie</b>ns, il v<b>ie</b>nt, nous venons, vous venez, ils v<b>ie</b>nnent</em>. Same for <em>tenir</em> and the family <em>devenir, revenir, obtenir, contenir</em>.</li>
<li><em>prendre</em>: <em>je prends, tu prends, il prend, nous <b>pren</b>ons, vous <b>pren</b>ez, ils pre<b>nn</b>ent</em>. Same for <em>apprendre, comprendre</em>.</li>
<li>The è verbs from Lesson: Spelling-change -er verbs (<em>j'achète / nous achetons</em>) follow the same boot.</li>
</ul>
<p><em>Mettre</em> is simpler: <em>je mets, tu mets, il met, nous mettons, vous mettez, ils mettent</em>. Same for <em>permettre, promettre</em>.</p>` },
        { h: "savoir vs connaître", html: `
<p><em>savoir</em>: <em>sais, sais, sait, savons, savez, savent</em>. <em>connaître</em>: <em>connais, connais, connaît, connaissons, connaissez, connaissent</em> (the 1990 reform also allows <em>il connait</em> without the circumflex).</p>
<ul>
<li><em>savoir</em> = know a fact or know how to: + infinitive (<em>je sais nager</em>), + <em>que / si / où / quand</em> (<em>je sais où il habite</em>), or a fact (<em>je sais la réponse</em>).</li>
<li><em>connaître</em> = be familiar with or acquainted with: + a person, place or thing (<em>je connais Marie</em>, <em>tu connais Londres ?</em>, <em>je connais ce livre</em>). It is never followed by a clause or an infinitive.</li>
</ul>` }
      ],
      examples: [
        ["Tu peux m'aider ?", "Can you help me?"],
        ["Je veux apprendre le français.", "I want to learn French."],
        ["Nous devons partir à six heures.", "We have to leave at six."],
        ["Elle sait conduire, mais elle ne connaît pas la ville.", "She can drive, but she doesn't know the town."],
        ["Ils viennent de Glasgow.", "They come from Glasgow."],
        ["Je prends le train et je mets mon manteau.", "I take the train and put on my coat."]
      ],
      pitfalls: [
        `Conjugating the second verb: <em>je dois <b>partir</b></em>, never <em>je dois pars</em>.`,
        `Translating "to" after a modal: <em>je veux manger</em>, never <em>je veux à manger</em> or <em>je veux de manger</em>.`,
        `Using <em>connaître</em> with a clause or infinitive: <em>je <b>sais</b> où il habite</em>, <em>je <b>sais</b> nager</em>.`,
        `Treating <em>prendre</em> as a regular <em>-re</em> verb: <em>nous prenons</em>, <em>ils prennent</em>, never <em>nous prendons</em>.`
      ],
      activities: [
        { t: "match", q: "Match each verb to its ils form.", pairs: [["pouvoir", "ils peuvent"], ["vouloir", "ils veulent"], ["devoir", "ils doivent"], ["venir", "ils viennent"], ["prendre", "ils prennent"]], x: "The <em>ils</em> form belongs to the boot and shares the changed stem of <em>je, tu, il</em>." },
        { t: "fill", q: "Nous ___ partir maintenant.", h: "devoir", a: ["devons"], x: "<em>Nous</em> keeps the infinitive's stem: <em>nous devons</em>." },
        { t: "fill", q: "Ils ___ le bus.", h: "prendre", a: ["prennent"], x: "<em>Prendre</em> doubles the n with <em>ils</em>: <em>ils prennent</em>." },
        { t: "fill", q: "Je ___ mon manteau.", h: "mettre", a: ["mets"], x: "<em>Mettre</em>: <em>je mets, tu mets, il met</em>." },
        { t: "mc", q: "Tu ___ Marie ?", o: ["connais", "sais"], a: 0, x: "Knowing a person is <em>connaître</em>." },
        { t: "mc", q: "Je ne ___ pas où il habite.", o: ["connais", "sais"], a: 1, x: "A clause with <em>où</em> follows <em>savoir</em>." },
        { t: "sort", q: "savoir or connaître?", cats: ["savoir", "connaître"], items: [["ma voisine", 1], ["nager", 0], ["Londres", 1], ["où est la gare", 0], ["ce restaurant", 1], ["parler espagnol", 0], ["que tu es là", 0]], x: "<em>Savoir</em> + infinitive or clause; <em>connaître</em> + person, place or thing." },
        { t: "spot", q: "Tap the word that's wrong.", w: ["Je", "dois", "pars", "maintenant"], a: 2, fix: "partir", x: "After a modal the second verb stays in the infinitive: <em>je dois partir</em>." },
